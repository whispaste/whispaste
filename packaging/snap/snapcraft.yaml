# Snap manifest — WhisPaste (Snap Store / Ubuntu App Center).
#
# Fourth Linux channel per PRD §8.3 (Flatpak → AppImage → .deb → Snap, Snap last).
#
# Like the Flatpak/AppImage/.deb channels, this snap is assembled from the
# prebuilt Linux x86_64 release bundle produced by the `build-linux` job in
# .github/workflows/release.yml (artifact `linux-release` →
# WhisPaste-<version>-linux-x64.tar.gz, created with
# `tar -czf … -C build/linux/x64/release/bundle .`). We do NOT rebuild Flutter
# inside the snap — the tarball root already contains the `whispaste`
# executable, `lib/` and `data/`, with every §3.1 build pitfall (sentry-native,
# flutter_soloud Xiph, crashpad_handler chmod +x) already baked in.
#
# The `flutter` extension still wires up the GTK/GNOME runtime plumbing
# (GSettings, GDK pixbuf loaders, fontconfig, the desktop launchers) around the
# staged bundle so the app starts cleanly under confinement.
#
# App-ID = the existing reverse-DNS identifier de.whispaste.app (the snap *name*
# in the store is the lowercase `whispaste`; the desktop entry / app-id keep
# de.whispaste.app). Do not invent a new identifier.
#
# Per-release the maintainer bumps `version` + the `source` (tag URL) of the
# `whispaste-bundle` part — see packaging/snap/README.md for the runbook.
# Not auto-bumped by release.yml (unlike homebrew/scoop/winget); re-verify
# against the latest GitHub release before submitting/resubmitting.
name: whispaste
title: WhisPaste
base: core24
version: '1.5.1'
license: MIT
website: https://whispaste.de/
contact: https://github.com/whispaste/whispaste/issues
issues: https://github.com/whispaste/whispaste/issues
source-code: https://github.com/whispaste/whispaste
# Store icon (also satisfies the desktop file's Icon=de.whispaste.app lookup).
icon: de.whispaste.app.png
summary: 'Voice-input tool: hotkey, speak, paste anywhere'
description: |
  WhisPaste turns speech into text wherever you type. Press a hotkey, speak,
  and the text appears at the cursor in the app you are already using: email,
  chat, editor, terminal or search field. You never leave the window.

  Transcription runs locally on your computer by default (whisper.cpp), so
  audio and text stay on your device and it works offline. A cloud provider is
  optional and only used if you choose one. No account or subscription needed.

  - Global hotkey, push-to-talk or toggle
  - Small recording overlay with a live waveform
  - Searchable history, export as TXT, Markdown, CSV, JSON or DOCX
  - Text replacements for names and terms you use often
  - Import audio files; speakers in a conversation are separated locally

  The speech model is downloaded on first use. For automatic pasting,
  connect the uinput interface once:
  `sudo snap connect whispaste:uinput`. Without it, WhisPaste copies the text
  to the clipboard and you paste it yourself.

# Stable, store-submittable build (not a devel grade).
grade: stable
# Strict confinement keeps the snap store-auto-reviewable. The self-download of
# the Sprachdienst (whisper-server) still works under strict confinement: the
# app reads $XDG_CONFIG_HOME first (path_service.dart appDataDir), which snapd
# remaps to $SNAP_USER_DATA/.config (writable AND exec-allowed — not mounted
# noexec), so the downloaded binary is chmod +x'd and executed there.
confinement: strict

# GStreamer plugins staged by the runtime-libs part (M4A/AAC import). The
# registry lives in the per-user common dir, which strict confinement keeps
# writable. Not verified on a built snap yet.
environment:
  GST_PLUGIN_SYSTEM_PATH_1_0: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer-1.0
  GST_PLUGIN_SCANNER_1_0: $SNAP/usr/lib/x86_64-linux-gnu/gstreamer1.0/gstreamer-1.0/gst-plugin-scanner
  GST_REGISTRY_1_0: $SNAP_USER_COMMON/gstreamer-registry.bin

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  whispaste:
    # The flutter extension prepends the GTK/GNOME launcher wrappers.
    command: bin/whispaste
    extensions: [gnome]
    common-id: de.whispaste.app
    desktop: usr/share/applications/de.whispaste.app.desktop
    # Started at login from $SNAP_USER_DATA/.config/autostart/ (written by the
    # app's autostart switch, Exec=/snap/bin/whispaste --autostart, #97).
    autostart: de.whispaste.app.desktop
    plugs:
      # ── Display / windowing + Clipboard / Paste (internal-notes §2.4) ────────────
      # Clipboard write rides on the Wayland/X11 sockets; the desktop plugs cover
      # it.
      - wayland
      - x11
      - desktop
      - desktop-legacy
      # ── Auto-Paste keystroke synthesis (internal-notes §2.7) ─────────────────────
      # uinput virtual keyboard (linux/runner/desktop_paste_host.cc, ticket 30).
      # Unlike the plugs above, snapd's `uinput` interface is NOT auto-connect —
      # even with this plug declared, a user installing outside the Snap Store
      # (or before a store auto-connect assertion is granted) must run
      # `sudo snap connect whispaste:uinput` once themselves, or Auto-Paste falls
      # back to clipboard-only (CheckCapability() reports `permission_missing`).
      - uinput
      # ── Global Hotkey (internal-notes §2.5) ──────────────────────────────────────
      # The session bus reaches the WM / GlobalShortcuts portal + the keybinder
      # path. unity7 also carries the legacy session-bus + appindicator surface.
      - unity7
      # ── Audio (Aufnahme — internal-notes §2.2) ───────────────────────────────────
      - audio-record
      - audio-playback
      # ── Network: self-download of the Sprachdienst (whisper-server) + model ───
      # The app fetches the whisper-server manifest + binary + ggml model at
      # first run (lib/services/whisper_server_*.dart) over the network.
      - network
      # ── System tray / app indicator + notifications (libayatana-appindicator) ─
      - desktop  # appindicator/StatusNotifier rides the desktop session bus

parts:
  # Runtime shared libraries the bundle links against — mirrors the -dev packages
  # installed in release.yml `build-linux` (runtime soname siblings). Kept in a
  # separate part so they stage under $SNAP/usr/... and never get folded into the
  # bundle directory below.
  runtime-libs:
    plugin: nil
    stage-packages:
      - libgtk-3-0
      - libsecret-1-0
      - libnotify4
      - libayatana-appindicator3-1
      - libasound2
      - libxss1
      - libcurl4
      - libkeybinder-3.0-0
      - liblzma5
      - zlib1g
      # parecord (recording) and pactl (microphone list), started by the
      # `record` package (#85).
      - pulseaudio-utils
      # M4A/AAC import: GStreamer is loaded at runtime (linux/runner/
      # audio_file_decode_gst.cc). libav provides the AAC decoder (avdec_aac).
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
      - gstreamer1.0-libav

  # Stage the prebuilt Linux x86_64 release bundle (no Flutter rebuild) under
  # $SNAP/whispaste. Per-release: bump `source` to the tag's tarball asset.
  whispaste-bundle:
    plugin: dump
    source: https://github.com/whispaste/whispaste/releases/download/v1.5.1/WhisPaste-1.5.1-linux-x64.tar.gz
    source-type: tar
    source-checksum: sha256/581dda93bc58206d18fed23521eebfb4b9a60a85b580f0aaf475090d07104679
    # The tarball root contains a file named `whispaste` alongside lib/ and
    # data/, so `organize: '*': whispaste/` collides with that file
    # (FileExistsError). Copy the pulled bundle into whispaste/ explicitly.
    override-build: |
      install -d "${CRAFT_PART_INSTALL}/whispaste"
      cp --archive "${CRAFT_PART_BUILD}/." "${CRAFT_PART_INSTALL}/whispaste/"

  # Desktop entry + AppStream metainfo + icon + launcher symlink. The source
  # files are snap-local copies (kept in sync with packaging/flatpak/*): under
  # strict managed builds snapcraft only mounts THIS project directory, so the
  # part cannot reach ../flatpak or ../../assets.
  whispaste-desktop:
    after: [whispaste-bundle]
    plugin: nil
    source: .
    override-build: |
      craftctl default
      install -d "$CRAFT_PART_INSTALL/bin"
      ln -sf ../whispaste/whispaste "$CRAFT_PART_INSTALL/bin/whispaste"
      install -Dm644 "$CRAFT_PROJECT_DIR/de.whispaste.app.desktop" \
        "$CRAFT_PART_INSTALL/usr/share/applications/de.whispaste.app.desktop"
      install -Dm644 "$CRAFT_PROJECT_DIR/de.whispaste.app.metainfo.xml" \
        "$CRAFT_PART_INSTALL/usr/share/metainfo/de.whispaste.app.metainfo.xml"
      install -Dm644 "$CRAFT_PROJECT_DIR/de.whispaste.app.png" \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/512x512/apps/de.whispaste.app.png"
