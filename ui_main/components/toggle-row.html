<div class="form-group">
  <div class="toggle-row">
    <div class="toggle-info">
      <label class="toggle-label" for="toggle-{{.id}}" data-i18n="{{.label}}">{{.labelDefault}}</label>
{{- if .desc}}
      <p class="toggle-desc" data-i18n="{{.desc}}">{{.descDefault}}</p>
{{- end}}
    </div>
    <div class="toggle-switch">
      <input type="checkbox" id="toggle-{{.id}}"{{if .checked}} checked{{end}}{{if .onchange}} onchange="{{.onchange}}"{{end}}>
      <label class="toggle-track" for="toggle-{{.id}}"></label>
    </div>
  </div>
</div>
