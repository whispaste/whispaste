<div id="page-feedback" class="page hidden">
  <div class="feedback-dialog">
    <h2 data-i18n="feedback.title"></h2>
    <p class="feedback-subtitle" data-i18n="feedback.subtitle"></p>

    <div class="feedback-stars" id="feedback-stars">
      <button class="star-btn" data-rating="1" aria-label="1 star">★</button>
      <button class="star-btn" data-rating="2" aria-label="2 stars">★</button>
      <button class="star-btn" data-rating="3" aria-label="3 stars">★</button>
      <button class="star-btn" data-rating="4" aria-label="4 stars">★</button>
      <button class="star-btn" data-rating="5" aria-label="5 stars">★</button>
    </div>

    <textarea id="feedback-text" maxlength="500" rows="4" data-i18n-placeholder="feedback.placeholder"></textarea>
    <div class="feedback-char-count"><span id="feedback-chars">0</span>/500</div>

    <p class="feedback-privacy" data-i18n="feedback.privacy"></p>

    <div class="feedback-actions">
      <button class="btn btn-secondary" id="feedback-cancel" data-i18n="feedback.cancel"></button>
      <button class="btn btn-primary" id="feedback-submit" disabled data-i18n="feedback.submit"></button>
    </div>

    <div id="feedback-error" class="feedback-error" hidden></div>

    <div class="feedback-success hidden" id="feedback-success">
      <span class="feedback-check">✓</span>
      <span data-i18n="feedback.thanks"></span>
    </div>
  </div>
</div>
