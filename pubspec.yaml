name: whispaste
description: "Cross-platform dictation — hotkey, speak, paste anywhere."
publish_to: 'none'
version: 1.2.19+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 3.3.1

  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Desktop window management
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  flutter_acrylic: ^1.1.0

  # System tray (desktop)
  tray_manager: ^0.5.2

  # Global hotkeys (desktop)
  hotkey_manager: ^0.2.0

  # Clipboard
  super_clipboard: ^0.9.1

  # Audio recording
  record: ^6.2.0

  # Autostart (desktop)
  launch_at_startup: ^0.5.1

  # HTTP
  http: ^1.3.0
  dio: ^5.7.0

  # Crash reporting
  sentry_flutter: ^9.20.0
  sentry_dio: ^9.20.0     # HTTP-Spans für Dio-Clients
  sentry_drift: ^9.20.0   # DB-Query-Spans für Drift

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # FFI (platform interop)
  ffi: ^2.2.0

  # Cross-platform audio engine (replaces Win32 PlaySoundW)
  flutter_soloud: ^4.0.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1
  crypto: ^3.0.6
  # Reads the build-time version from Info.plist / Windows resource block /
  # AndroidManifest — Flutter populates these from pubspec.yaml. Used by
  # app_info.dart to keep the runtime appVersion in lockstep with pubspec.
  package_info_plus: ^9.0.0
  logging: ^1.3.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  # Cross-platform native OS notifications (Windows toast, macOS UserNotifications).
  # Best-effort surface for paste failures — supplements (does NOT replace)
  # the dock-bounce / taskbar-flash + tray-badge attention layers that work
  # reliably even when notification permission is denied.
  local_notifier: ^0.1.6
  equatable: ^2.0.7
  flutter_secure_storage: ^10.2.0
  flutter_svg: ^2.1.0
  lucide_icons_flutter: ^3.1.12
  flutter_lucide_animated: ^0.0.4
  font_awesome_flutter: ^11.0.0

  # Export (DOCX ZIP generation)
  archive: ^4.0.4
  in_app_review: ^2.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.25.0
  mocktail: ^1.0.4
  msix: ^3.16.8
  golden_screenshot: ^11.0.1
  sentry_dart_plugin: ^3.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/1.5x/
    - assets/icons/2.0x/
    - assets/icons/3.0x/
    - assets/icons/4.0x/
    - assets/sounds/
    - assets/icons/logo-dark.svg
    - assets/icons/logo-light.svg
    - assets/flags/

msix_config:
  display_name: WhisPaste
  publisher_display_name: silvio_lindstedt
  identity_name: 12342SilvioLindstedt.WhisPaste
  publisher: CN=F08EEF05-5870-4208-B156-E597A1AB80B0
  msix_version: 1.2.17.0
  store: true
  logo_path: assets/icons/app_icon.png
  capabilities: microphone, internetClient

# sentry_dart_plugin — uploads native debug symbols (.pdb/.dSYM/.so) per
# Release build. Auth token MUST come from the SENTRY_AUTH_TOKEN env var
# (never committed). Sources & source-maps stay off for privacy and
# because there is no Web build. Symbol upload itself does not count
# against Sentry's Free-Tier event/span quotas.
sentry:
  project: flutter_whispaste
  org: silvio-lindstedt-und-maik-g-y2
  url: https://de.sentry.io
  upload_debug_symbols: true
  upload_sources: false
  upload_source_maps: false
  log_level: warn
