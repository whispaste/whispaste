name: whispaste
description: "Premium cross-platform dictation with AI post-processing"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 3.3.1

  # Database
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.6.0+eol

  # Desktop window management
  window_manager: ^0.5.1
  flutter_acrylic: ^1.1.0

  # System tray (desktop)
  tray_manager: ^0.5.2

  # Global hotkeys (desktop)
  hotkey_manager: ^0.2.0

  # Clipboard
  super_clipboard: ^0.9.1

  # Audio recording
  record: ^6.2.0

  # Autostart (desktop)
  launch_at_startup: ^0.5.1

  # HTTP
  http: ^1.3.0
  dio: ^5.7.0

  # Path utilities
  path_provider: ^2.1.5
  path: ^1.9.1

  # FFI for Go backend
  ffi: ^2.2.0

  # Utilities
  intl: ^0.20.2
  collection: ^1.19.1
  crypto: ^3.0.6
  logging: ^1.3.0
  shared_preferences: ^2.5.0
  url_launcher: ^6.3.0
  equatable: ^2.0.7
  flutter_svg: ^2.1.0
  lucide_icons_flutter: ^3.1.12
  font_awesome_flutter: ^11.0.0

  # Export (DOCX ZIP generation)
  archive: ^4.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.25.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/icons/1.5x/
    - assets/icons/2.0x/
    - assets/icons/3.0x/
    - assets/icons/4.0x/
    - assets/sounds/
    - assets/icons/logo-dark.svg
    - assets/icons/logo-light.svg
