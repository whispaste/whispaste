# Dependabot version updates, one grouped weekly PR per ecosystem.
# Informational only: the maintainer merges locally (dev -> main) and does not
# work through PRs, so the open-PR limit is kept small. Security advisories are
# handled separately by GitHub's own alerts (no PR cadence needed here).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pub
    directories:
      - "/"
      - "/packages/auto_updater_windows"
      - "/packages/whispaste_diagnostics"
      - "/packages/whispaste_gpu_probe"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      pub:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/website"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
