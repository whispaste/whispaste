name: Refresh Changelog
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch deploy-pages
        run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
