# Discord Auto-Cleanup — Removes dismissed/fixed crash report messages
# and expired feedback messages from Discord channels.
#
# Runs weekly (Sunday 03:00 UTC) and can be triggered manually.
# Calls the crash-cleanup Edge Function's ?action=cleanup endpoint.

name: Discord Cleanup

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Feedback retention in days (default 90)'
        required: false
        default: '90'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run Discord cleanup
        env:
          CLEANUP_URL: https://cnyniyflnefxrwafuqig.supabase.co/functions/v1/crash-cleanup
          ADMIN_API_KEY: ${{ secrets.SUPABASE_ADMIN_API_KEY }}
        run: |
          RETENTION="${{ github.event.inputs.retention_days || '90' }}"
          echo "Running Discord cleanup (retention: ${RETENTION} days)..."
          
          RESPONSE=$(curl -sf -X GET \
            "${CLEANUP_URL}?action=cleanup&retention_days=${RETENTION}" \
            -H "x-api-key: ${ADMIN_API_KEY}" \
            -H "Content-Type: application/json")
          
          echo "Response: ${RESPONSE}"
          
          # Parse results
          CRASHES=$(echo "$RESPONSE" | jq -r '.crashes_cleaned // 0')
          FEEDBACK=$(echo "$RESPONSE" | jq -r '.feedback_cleaned // 0')
          ERRORS=$(echo "$RESPONSE" | jq -r '.errors // [] | length')
          
          echo "### Discord Cleanup Results" >> $GITHUB_STEP_SUMMARY
          echo "- Crash messages cleaned: **${CRASHES}**" >> $GITHUB_STEP_SUMMARY
          echo "- Feedback messages cleaned: **${FEEDBACK}**" >> $GITHUB_STEP_SUMMARY
          if [ "$ERRORS" -gt 0 ]; then
            echo "- ⚠️ Errors: **${ERRORS}**" >> $GITHUB_STEP_SUMMARY
          fi
