name: Build Whisper Server

# Builds whisper-server from whisper.cpp for Windows (Vulkan) and macOS (Metal).
# Upstream only provides CUDA and CPU binaries — this workflow fills the gaps.
#
# The resulting binaries are uploaded to a dedicated GitHub release tagged
# "whisper-server-<version>". The WhisPaste download service queries this
# release tag to find the correct server binary for the detected GPU.

on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: 'whisper.cpp release tag (e.g., v1.8.4)'
        required: true
        default: 'v1.8.4'
      build_suffix:
        description: 'Optional suffix for re-releases (e.g., .1 or -2). Leave empty for first build.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: whisper-server-release
  cancel-in-progress: false

jobs:
  validate-input:
    name: Validate tag format
    runs-on: ubuntu-latest
    steps:
      - name: Check whisper_tag format
        run: |
          TAG="${{ inputs.whisper_tag }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.\-][0-9a-zA-Z]+)*$ ]]; then
            echo "::error::Invalid whisper_tag '$TAG'. Must match vX.Y.Z (e.g. v1.8.4)"
            exit 1
          fi
          echo "Tag '$TAG' is valid"

  build-vulkan-windows:
    name: Vulkan – Windows x64
    needs: validate-input
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "Downloading Vulkan SDK..."
          Invoke-WebRequest `
            -Uri "https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe" `
            -OutFile vulkan-sdk.exe

          Write-Host "Installing Vulkan SDK (silent)..."
          Start-Process -FilePath .\vulkan-sdk.exe `
            -ArgumentList "--accept-licenses --default-answer --confirm-command install" `
            -Wait -NoNewWindow

          # Locate the installed SDK (latest version directory).
          $sdkRoot = Get-ChildItem "C:\VulkanSDK" -Directory |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if (-not $sdkRoot) {
            Write-Error "Vulkan SDK installation failed — no directory found"
            exit 1
          }

          Write-Host "Vulkan SDK installed at: $($sdkRoot.FullName)"
          echo "VULKAN_SDK=$($sdkRoot.FullName)" >> $env:GITHUB_ENV

      - name: Clone whisper.cpp
        shell: pwsh
        run: |
          git clone --depth 1 --branch ${{ inputs.whisper_tag }} `
            https://github.com/ggml-org/whisper.cpp.git
          Write-Host "Cloned whisper.cpp at ${{ inputs.whisper_tag }}"

      - name: Configure CMake
        shell: pwsh
        run: |
          cd whisper.cpp
          cmake -B build `
            -DGGML_VULKAN=ON `
            -DBUILD_SHARED_LIBS=OFF `
            -DWHISPER_BUILD_TESTS=OFF `
            -DWHISPER_BUILD_EXAMPLES=ON `
            -DCMAKE_BUILD_TYPE=Release
          Write-Host "CMake configured with Vulkan support"

      - name: Build
        shell: pwsh
        run: |
          cd whisper.cpp
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS
          Write-Host "Build complete"

      - name: Package
        shell: pwsh
        run: |
          $stagingDir = "whisper-server-vulkan-x64"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Find the server binary (name varies by whisper.cpp version).
          $serverExe = Get-ChildItem -Path "whisper.cpp\build" -Recurse -Filter "*.exe" |
            Where-Object { $_.Name -match "^(whisper-server|server)\.exe$" } |
            Select-Object -First 1

          if (-not $serverExe) {
            Write-Error "whisper-server.exe not found in build output"
            Get-ChildItem -Path "whisper.cpp\build" -Recurse -Filter "*.exe" |
              ForEach-Object { Write-Host "  Found: $($_.FullName)" }
            exit 1
          }

          # Always name it whisper-server.exe for consistency.
          Copy-Item $serverExe.FullName "$stagingDir\whisper-server.exe"

          # Copy co-located DLLs (ggml, Vulkan shaders, etc.).
          $binDir = $serverExe.DirectoryName
          Get-ChildItem "$binDir\*.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "$stagingDir\" }

          # List contents for verification.
          Write-Host "Package contents:"
          Get-ChildItem $stagingDir | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB))KB)"
          }

          Compress-Archive -Path "$stagingDir\*" -DestinationPath "whisper-server-vulkan-x64.zip"
          Write-Host "Created whisper-server-vulkan-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: whisper-server-vulkan-x64
          path: whisper-server-vulkan-x64.zip
          retention-days: 1

  build-cpu-windows:
    name: CPU – Windows x64 (self-contained)
    needs: validate-input
    permissions:
      contents: write
    runs-on: windows-latest
    # Why this job exists (FLUTTER_WHISPASTE-A0):
    # The upstream `whisper-blas-bin-x64.zip` is the CPU floor every GPU
    # fallback ultimately drops to — but its binaries dynamically link the
    # MSVC runtime (MSVCP140 / VCRUNTIME140 / VCRUNTIME140_1) *and* the
    # OpenMP runtime (VCOMP140.DLL, pulled in by ggml-cpu.dll). Those ship
    # with the Visual C++ Redistributable, which is NOT guaranteed on a
    # user's machine — notably VCOMP140 is absent on many older/clean
    # Windows installs (e.g. the GeForce GTX 650 box that surfaced this).
    # The result is STATUS_DLL_NOT_FOUND (0xC0000135) and an exhausted
    # recovery with no further fallback. Repackaging the upstream zip with
    # those four redistributable DLLs bundled app-local makes the CPU floor
    # genuinely universal (app-local redistribution is permitted by MS's
    # redistributable license terms).
    steps:
      - name: Download upstream BLAS CPU build
        shell: pwsh
        run: |
          $url = "https://github.com/ggml-org/whisper.cpp/releases/download/${{ inputs.whisper_tag }}/whisper-blas-bin-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile blas.zip
          Expand-Archive -Path blas.zip -DestinationPath blas-extracted -Force

      - name: Stage binaries + bundle VC++ runtime DLLs
        shell: pwsh
        run: |
          $stagingDir = "whisper-server-cpu-x64"
          New-Item -ItemType Directory -Path $stagingDir -Force | Out-Null

          # Upstream lays everything under a Release/ subfolder.
          $srcDir = Get-ChildItem -Path blas-extracted -Recurse -Filter "whisper-server.exe" |
            Select-Object -First 1 | ForEach-Object { $_.DirectoryName }
          if (-not $srcDir) {
            Write-Error "whisper-server.exe not found in upstream BLAS zip"
            exit 1
          }

          # Copy the server binary + all co-located DLLs (ggml*, whisper,
          # libopenblas, SDL2). The app's extractor flattens by basename,
          # so a flat staging dir matches what ships today.
          Copy-Item "$srcDir\whisper-server.exe" "$stagingDir\"
          Get-ChildItem "$srcDir\*.dll" | ForEach-Object {
            Copy-Item $_.FullName "$stagingDir\"
          }

          # Locate the VC++ redistributable DLLs on the runner via vswhere.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot = & $vswhere -latest -property installationPath
          Write-Host "VS install: $vsRoot"

          # CRT runtime (msvcp140, vcruntime140, vcruntime140_1) + OpenMP
          # (vcomp140). Pick the highest toolset version directory present.
          $crtDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1
          $ompDir = Get-ChildItem "$vsRoot\VC\Redist\MSVC\*\x64\Microsoft.VC*.OpenMP" -Directory |
            Sort-Object FullName -Descending | Select-Object -First 1

          $needed = @{
            "msvcp140.dll"       = "$($crtDir.FullName)\msvcp140.dll"
            "vcruntime140.dll"   = "$($crtDir.FullName)\vcruntime140.dll"
            "vcruntime140_1.dll" = "$($crtDir.FullName)\vcruntime140_1.dll"
            "vcomp140.dll"       = "$($ompDir.FullName)\vcomp140.dll"
          }
          foreach ($name in $needed.Keys) {
            $path = $needed[$name]
            if (-not (Test-Path $path)) {
              Write-Error "Required redist DLL not found: $name ($path)"
              exit 1
            }
            Copy-Item $path "$stagingDir\"
            Write-Host "Bundled $name"
          }

          Write-Host "Package contents:"
          Get-ChildItem $stagingDir | ForEach-Object {
            Write-Host "  $($_.Name) ($([math]::Round($_.Length/1KB))KB)"
          }

          Compress-Archive -Path "$stagingDir\*" -DestinationPath "whisper-server-cpu-x64.zip"
          Write-Host "Created whisper-server-cpu-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: whisper-server-cpu-x64
          path: whisper-server-cpu-x64.zip
          retention-days: 1

  build-metal-macos:
    name: Metal – macOS ARM64
    needs: validate-input
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Clone whisper.cpp
        run: |
          git clone --depth 1 --branch ${{ inputs.whisper_tag }} \
            https://github.com/ggml-org/whisper.cpp.git
          echo "Cloned whisper.cpp at ${{ inputs.whisper_tag }}"

      - name: Configure CMake
        run: |
          cd whisper.cpp
          cmake -B build \
            -DGGML_METAL=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release
          echo "CMake configured with Metal support"

      - name: Build
        run: |
          cd whisper.cpp
          cmake --build build --config Release -j $(sysctl -n hw.ncpu)
          echo "Build complete"

      - name: Package
        run: |
          STAGING_DIR="whisper-server-metal-arm64"
          mkdir -p "$STAGING_DIR"

          # Find the server binary (name varies by whisper.cpp version).
          SERVER_BIN=$(find whisper.cpp/build -type f \( -name "whisper-server" -o -name "server" \) ! -name "*.o" | head -1)

          if [ -z "$SERVER_BIN" ]; then
            echo "::error::whisper-server not found in build output"
            find whisper.cpp/build -type f -perm +111 | head -20
            exit 1
          fi

          # Always name it whisper-server for consistency.
          cp "$SERVER_BIN" "$STAGING_DIR/whisper-server"
          chmod +x "$STAGING_DIR/whisper-server"

          # Copy co-located dylibs (ggml Metal shaders, etc.).
          BIN_DIR=$(dirname "$SERVER_BIN")
          cp "$BIN_DIR"/*.dylib "$STAGING_DIR/" 2>/dev/null || true

          # Copy Metal shader library if present.
          find whisper.cpp/build -name "*.metallib" -exec cp {} "$STAGING_DIR/" \; 2>/dev/null || true

          echo "Package contents:"
          ls -lh "$STAGING_DIR"

          cd "$STAGING_DIR"
          zip -r "../whisper-server-metal-arm64.zip" .
          cd ..
          echo "Created whisper-server-metal-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: whisper-server-metal-arm64
          path: whisper-server-metal-arm64.zip
          retention-days: 1

  publish-release:
    name: Publish release
    needs: [build-vulkan-windows, build-cpu-windows, build-metal-macos]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR assets/

      - name: Delete previous release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="whisper-server-${{ inputs.whisper_tag }}${{ inputs.build_suffix }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Deleting existing release $TAG..."
            gh release delete "$TAG" --yes --cleanup-tag
            sleep 5
          fi
          # Also delete orphan tag if present.
          git push origin ":refs/tags/$TAG" 2>/dev/null || true

      - name: Create tag
        run: |
          TAG="whisper-server-${{ inputs.whisper_tag }}${{ inputs.build_suffix }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG" -m "Whisper Server ${{ inputs.whisper_tag }}"
          git push origin "$TAG" --force

      # ---------------------------------------------------------------------
      # Generate the manifest BEFORE creating the release. GitHub immutable
      # releases reject any post-creation asset upload (HTTP 422), so the
      # manifest must be part of the single release-creation upload below.
      # The generator derives the WhisPaste asset entries from the locally
      # staged ZIPs in assets/ (deterministic URLs from tag + filename) —
      # no dependency on the not-yet-existing release, and no CDN retry.
      # ---------------------------------------------------------------------
      - name: Generate whisper-server-manifest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="whisper-server-${{ inputs.whisper_tag }}${{ inputs.build_suffix }}"
          bash scripts/generate-whisper-server-manifest.sh \
            "$TAG" "${{ inputs.whisper_tag }}" assets > /tmp/manifest.json
          if [[ "$(jq '.binaries | length' /tmp/manifest.json)" -lt 1 ]]; then
            echo "::error::Manifest contains no binaries"
            cat /tmp/manifest.json
            exit 1
          fi
          cp /tmp/manifest.json assets/whisper-server-manifest.json
          cat assets/whisper-server-manifest.json

      - name: Create release with assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: whisper-server-${{ inputs.whisper_tag }}${{ inputs.build_suffix }}
          name: "Whisper Server (${{ inputs.whisper_tag }}) – Vulkan + CPU + Metal"
          body: |
            Pre-built whisper-server binaries.

            **Source**: [whisper.cpp ${{ inputs.whisper_tag }}](https://github.com/ggml-org/whisper.cpp/releases/tag/${{ inputs.whisper_tag }})
            **Variants**: Vulkan (Windows x64) + CPU (Windows x64, self-contained) + Metal (macOS ARM64)

            > CUDA is provided by the upstream whisper.cpp project. The CPU
            > floor is the upstream BLAS build repackaged with the VC++
            > runtime DLLs bundled app-local, so it runs without a separate
            > Visual C++ Redistributable install (FLUTTER_WHISPASTE-A0).
          files: |
            assets/*.zip
            assets/whisper-server-manifest.json
          make_latest: false

      - name: Commit manifest to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # If nothing changed (regenerated manifest is identical), skip.
          if git diff --quiet -- assets/whisper-server-manifest.json; then
            echo "Manifest already matches main — nothing to commit"
            exit 0
          fi
          git add assets/whisper-server-manifest.json
          git commit -m "chore(whisper-server): update manifest for ${{ inputs.whisper_tag }}${{ inputs.build_suffix }}"
          # Push directly to main. Protected branches will reject; the
          # workflow then needs `contents: write` and a branch-protection
          # exemption for github-actions[bot] (or a deploy key).
          git push origin HEAD:main
