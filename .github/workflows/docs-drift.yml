name: Docs drift (soft check)

# ADVISORY Semantik-Drift-Prüfung für WhisPastes öffentliche Docs. Ergänzt den
# deterministischen Public-Docs-QS-Gate (scripts/docs-attest.sh, im CI-website-Job
# + .githooks/pre-push). Dieser hier fragt ein billiges LLM (Haiku), ob Prosa/
# Beispiele noch zur Implementierung passen — die Veralterung, die der strukturelle
# Gate nicht sehen kann (entfernte STT-Provider in der Feature-Liste, eingefrorene
# Versionslabels, App-Store-Claims für macOS …).
#
# NICHT-BLOCKIEREND per Design: schreibt den Report in die Job-Summary und failt
# den Build nie. Läuft zur Release-Zeit (jedes v*-Tag) + on demand — nicht pro Push,
# um billig zu bleiben.
#
# Auth über die Claude-Subscription (NICHT über einen Pay-per-Token-API-Key):
# die `claude`-CLI + ein `CLAUDE_CODE_OAUTH_TOKEN`-Repo-Secret (`claude setup-token`).
# Ohne Token ist der Check ein sauberer No-op mit How-to-Hinweis — der Workflow ist
# also sicher, bevor das Secret konfiguriert ist.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run docs-drift soft check (advisory, via Claude subscription)
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          {
            echo "## Docs-drift soft-check (advisory)"
            echo ""
            echo "Ground truth vs. public docs — semantische Drift, die der"
            echo "deterministische Public-Docs-QS-Gate nicht fangen kann."
            echo "Advisory only; blockiert nicht."
            echo ""
            if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
              echo "_docs-drift soft-check skipped: \`CLAUDE_CODE_OAUTH_TOKEN\` nicht konfiguriert._"
              echo ""
              echo "Einrichten (einmalig, im Terminal außerhalb von Claude):"
              echo '```'
              echo "claude setup-token   # langlebiger OAuth-Token (Claude-Subscription)"
              echo "gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo whispaste/whispaste"
              echo '```'
            else
              npm install -g @anthropic-ai/claude-code >/dev/null 2>&1 || true
              echo '```'
              bash scripts/docs-drift.sh --llm 2>&1 || echo "(docs-drift returned non-zero — see step logs)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
