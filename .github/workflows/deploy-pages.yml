name: Deploy Landing Page
# Prerequisite: Enable GitHub Pages in repo settings
# Settings → Pages → Source: "GitHub Actions"

on:
  # Redeploy when website source changes on main.
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  # Also triggered by release.yml via workflow_dispatch after a tag release,
  # so the new version's release notes become visible immediately.
  # (release: published cannot be used — Pages env protection only allows main ref)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Build releases.json from GitHub API
        run: node --experimental-strip-types --no-warnings scripts/build-releases.ts
        working-directory: website
        env:
          # German bodies now come from each release's release-notes-de.md
          # asset (see build-releases.ts) — no OpenAI translation in the
          # website build, so no OPENAI_API_KEY needed here.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Astro
        uses: withastro/action@v6
        with:
          path: website
        env:
          # Aktiviert den Source-Maps-Upload des @sentry/astro-Plugins.
          # Ohne diese Variable überspringt der Plugin den Upload mit Warnung,
          # der Build selbst läuft trotzdem durch (siehe sentry-vite-plugin).
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      - name: Submit sitemap to IndexNow (Bing, Yandex, Naver, Seznam, Yep)
        run: node scripts/push-indexnow.mjs
        working-directory: website
        env:
          # Skript ist opt-in (Exit 0 ohne Key) — Secret muss einmalig gesetzt
          # werden, siehe website/scripts/push-indexnow.mjs Kopfkommentar.
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      - name: Submit sitemap to Google Search Console
        run: node scripts/gsc-sitemap-ping.mjs
        working-directory: website
        # Schlägt mit 403 fehl, bis der Service Account einmalig manuell als
        # "Uneingeschränkt"-Nutzer auf sc-domain:whispaste.de eingetragen ist
        # (Search Console → Einstellungen → Nutzer und Berechtigungen — nicht
        # per API möglich). Darf den Deploy nie blockieren, deshalb
        # continue-on-error; sobald der manuelle Schritt erledigt ist, läuft
        # er grün mit.
        continue-on-error: true
        env:
          # Dedizierter Service Account whispaste-gsc-sitemap-ping@hellerio-ai
          # mit "Uneingeschränkt"-Zugriff NUR auf sc-domain:whispaste.de (kein
          # anderer IAM-Zugriff) — siehe website/scripts/gsc-sitemap-ping.mjs
          # Kopfkommentar.
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
