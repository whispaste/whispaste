name: Deploy Landing Page
# Prerequisite: Enable GitHub Pages in repo settings
# Settings → Pages → Source: "GitHub Actions"

on:
  # Redeploy when website source changes on main.
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  # Also triggered by release.yml via workflow_dispatch after a tag release,
  # so the new version's release notes become visible immediately.
  # (release: published cannot be used — Pages env protection only allows main ref)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install website dependencies
        run: npm ci
        working-directory: website
      - name: Build releases.json from GitHub API
        run: node --experimental-strip-types --no-warnings scripts/build-releases.ts
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - name: Build with Astro
        uses: withastro/action@v5
        with:
          path: website

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
