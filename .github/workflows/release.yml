name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup MinGW
        run: |
          # Prefer pre-installed MinGW; fall back to choco
          if (Test-Path "C:\mingw64\bin\gcc.exe") {
            echo "C:\mingw64\bin" | Out-File -Append $env:GITHUB_PATH
            Write-Host "Using pre-installed MinGW"
          } else {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append $env:GITHUB_PATH
          }

      - name: Download dependencies
        env:
          CGO_ENABLED: "1"
        run: go mod download

      - name: Generate Windows resources
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make

      - name: Determine version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = $env:REF_NAME
          $ver = $tag -replace '^v', ''
          $msixVer = ($ver -replace '-.*$', '') + '.0'
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "MSIX_VERSION=$msixVer" >> $env:GITHUB_OUTPUT

      - name: Vet
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Validate crash relay config
        env:
          CRASH_RELAY_URL: ${{ secrets.CRASH_RELAY_URL }}
        run: |
          if (-not $env:CRASH_RELAY_URL) {
            throw "Missing required secret: CRASH_RELAY_URL"
          }
          if ($env:CRASH_RELAY_URL -notmatch '^https://[a-z0-9-]+\.supabase\.co/functions/v1/crash-relay$') {
            throw "CRASH_RELAY_URL must point to a Supabase crash-relay endpoint"
          }

      - name: Build
        env:
          CGO_ENABLED: "1"
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
          CRASH_RELAY_URL: ${{ secrets.CRASH_RELAY_URL }}
        run: .\scripts\build.ps1 -Release -Version $env:APP_VERSION -CrashRelayURL $env:CRASH_RELAY_URL

      - name: Verify binary
        run: |
          if (!(Test-Path whispaste.exe)) { throw "Build failed: whispaste.exe not found" }
          $size = (Get-Item whispaste.exe).Length / 1MB
          Write-Host "Binary size: $([math]::Round($size, 2)) MB"

      - name: Generate checksum
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 whispaste.exe).Hash.ToLower()
          "$hash  whispaste.exe" | Out-File -Encoding ascii -NoNewline whispaste.exe.sha256
          Write-Host "SHA256: $hash"

      - name: Generate changelog (git-cliff)
        id: changelog
        env:
          RELEASE_TAG: ${{ steps.version.outputs.TAG }}
        run: |
          # Install git-cliff
          $ProgressPreference = 'SilentlyContinue'
          $cliffVersion = "2.7.0"
          $cliffUrl = "https://github.com/orhun/git-cliff/releases/download/v$cliffVersion/git-cliff-$cliffVersion-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $cliffUrl -OutFile git-cliff.zip
          Expand-Archive -Path git-cliff.zip -DestinationPath git-cliff-bin -Force
          $cliffExe = Get-ChildItem -Path git-cliff-bin -Recurse -Filter "git-cliff.exe" | Select-Object -First 1

          # Generate changelog for this release only (since last tag)
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          if ($prevTag) {
            & $cliffExe.FullName --config cliff.toml --unreleased --tag $env:RELEASE_TAG > raw-changelog.md
          } else {
            & $cliffExe.FullName --config cliff.toml --latest --tag $env:RELEASE_TAG > raw-changelog.md
          }

          $rawContent = Get-Content raw-changelog.md -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($rawContent)) {
            "Minor improvements and bug fixes." | Out-File raw-changelog.md -Encoding UTF8
          }
          Write-Host "Raw changelog:"
          Get-Content raw-changelog.md

      - name: Generate AI release notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          if (-not $env:OPENAI_API_KEY) {
            Write-Host "::warning::OPENAI_API_KEY not set — skipping AI release notes"
            exit 0
          }
          .\scripts\generate-release-notes.ps1 `
            -RawChangelog raw-changelog.md `
            -Version $env:APP_VERSION `
            -OpenAIKey $env:OPENAI_API_KEY `
            -OutputDir .

      - name: Prepare release body
        id: release_body
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $enNotes = ""
          if (Test-Path release-notes-en.md) {
            $enNotes = Get-Content release-notes-en.md -Raw -Encoding UTF8
          }
          if ([string]::IsNullOrWhiteSpace($enNotes)) {
            # Fallback to raw changelog
            $enNotes = Get-Content raw-changelog.md -Raw -Encoding UTF8
          }

          # Build the full release body
          $body = @"
## What's New in v$($env:APP_VERSION)

$enNotes

---

## 📦 Installation

### Installer (recommended)
Download **WhisPaste-Setup.exe** and run it. The installer adds WhisPaste to your Start Menu, optionally creates a desktop shortcut, and supports auto-start with Windows.

### Portable
1. Download **whispaste.exe**
2. Double-click it — it will appear in your system tray
3. Right-click the tray icon → Settings → choose a cloud provider key or enable local models

### MSIX Package
Download ``whispaste.msix`` for managed Windows installation.

### Checksum
Verify the binary with: ``certutil -hashfile whispaste.exe SHA256`` and compare with ``whispaste.exe.sha256``.
"@

          # Write to file (GitHub Actions multiline output)
          $body | Out-File -FilePath release-body.md -Encoding UTF8 -NoNewline

      - name: Update CHANGELOG.md
        env:
          APP_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          $enNotes = ""
          if (Test-Path release-notes-en.md) {
            $enNotes = Get-Content release-notes-en.md -Raw -Encoding UTF8
          }
          if ([string]::IsNullOrWhiteSpace($enNotes)) {
            $enNotes = Get-Content raw-changelog.md -Raw -Encoding UTF8
          }

          $date = Get-Date -Format "yyyy-MM-dd"
          $newEntry = "## $env:APP_VERSION ($date)`n`n$enNotes"

          $existing = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $header = "# Changelog`n`n"
          $rest = $existing -replace '^# Changelog\s*', ''
          $updated = "$header$newEntry`n`n---`n`n$rest"
          $updated | Out-File -FilePath CHANGELOG.md -Encoding UTF8 -NoNewline

          # Commit the updated changelog back to the repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: update CHANGELOG.md for v$env:APP_VERSION [skip ci]"
          git push origin HEAD:main || Write-Host "::warning::Could not push CHANGELOG update (tag-triggered, non-critical)"

      - name: Build NSIS installer
        run: |
          choco install nsis -y --no-progress
          $ver = "${{ steps.version.outputs.VERSION }}"
          $numVer = "${{ steps.version.outputs.MSIX_VERSION }}"
          Push-Location installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DPRODUCT_VERSION=$ver /DPRODUCT_VERSION_NUMERIC=$numVer whispaste.nsi
          Pop-Location
          $installer = "installer\WhisPaste-Setup.exe"
          if (!(Test-Path $installer)) { throw "Installer build failed" }
          Move-Item $installer .
          $size = (Get-Item "WhisPaste-Setup.exe").Length / 1MB
          Write-Host "Installer size: $([math]::Round($size, 2)) MB"

      - name: Package MSIX
        shell: pwsh
        run: |
          # Find MakeAppx.exe from Windows SDK
          $sdkPath = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\MakeAppx.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $sdkPath) { Write-Host "::warning::MakeAppx.exe not found, skipping MSIX packaging"; exit 0 }
          $makeAppx = $sdkPath.FullName

          # Prepare MSIX staging directory
          $staging = "msix-staging"
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item whispaste.exe $staging\
          Copy-Item msix\AppxManifest.xml $staging\

          # Copy or create placeholder icons
          New-Item -ItemType Directory -Force -Path "$staging\Assets" | Out-Null
          if (Test-Path msix\Assets\*.png) {
            Copy-Item msix\Assets\*.png "$staging\Assets\"
          }

          # Update version in manifest
          $manifest = [xml](Get-Content "$staging\AppxManifest.xml")
          $manifest.Package.Identity.Version = "${{ steps.version.outputs.MSIX_VERSION }}"
          $manifest.Save("$staging\AppxManifest.xml")

          # Create MSIX package
          & $makeAppx pack /d $staging /p whispaste.msix /o /nv
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::MSIX packaging failed"; exit 0 }
          Write-Host "MSIX package created: $((Get-Item whispaste.msix).Length / 1MB) MB"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          prerelease: false
          body_path: release-body.md
          files: |
            WhisPaste-Setup.exe
            whispaste.exe
            whispaste.exe.sha256
            whispaste.msix
