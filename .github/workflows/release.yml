name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags=golden

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release --no-tree-shake-icons `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          # X.X.X.0 format for Windows file properties (strip prerelease suffix)
          $parts = $version -split '[.\-]'
          $numeric = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DPRODUCT_VERSION=$version `
            /DPRODUCT_VERSION_NUMERIC=$numeric `
            installer\whispaste.nsi

          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          Write-Host "Built: installer\WhisPaste-Setup.exe"

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force

          # Portable ZIP from build output
          $buildDir = "build\windows\x64\runner\Release"
          $zipName = "WhisPaste-$version-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$artifactDir\$zipName"

          # NSIS installer (stable filename for direct download links)
          Copy-Item "installer\WhisPaste-Setup.exe" "$artifactDir\"

          Write-Host "Release artifacts:"
          Get-ChildItem $artifactDir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/

  build-msix:
    name: Build MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Configure MSIX publisher and version
        id: msix_config
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          if (-not $env:MSIX_PUBLISHER) {
            Write-Warning "MSIX_PUBLISHER secret not set — skipping MSIX build"
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $parts = $version -split '[.\-]'
          $numericVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          $content = Get-Content pubspec.yaml
          $content = $content -replace 'msix_version:.*', "msix_version: $numericVersion"
          # Replace only the `publisher:` line, not `publisher_display_name:`
          $content = $content -replace '(?m)^(\s*)publisher:\s.*', "`${1}publisher: $env:MSIX_PUBLISHER"
          $content | Set-Content pubspec.yaml

          Write-Host "MSIX configured: version=$numericVersion publisher=$env:MSIX_PUBLISHER"
          echo "skip=false" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        id: build_msix
        if: steps.msix_config.outputs.skip != 'true'
        run: dart run msix:create --store
        continue-on-error: true

      - name: Upload MSIX
        if: steps.msix_config.outputs.skip != 'true' && steps.build_msix.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: msix-release
          path: build/windows/x64/runner/Release/*.msix

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\r\n')"
          flutter build macos --release --no-tree-shake-icons "--dart-define=SUPABASE_URL=$URL" "--dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY"

      - name: Prepare release artifacts
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Portable ZIP
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/$ARTIFACT_DIR/WhisPaste-$VERSION-macos-arm64.zip" whispaste.app
          cd "$OLDPWD"

          # DMG via create-dmg (best-effort; falls back to zip-only)
          brew install create-dmg || true
          create-dmg \
            --volname "WhisPaste" \
            --window-size 500 320 \
            --icon-size 80 \
            --app-drop-link 380 170 \
            --icon "whispaste.app" 120 170 \
            "$ARTIFACT_DIR/WhisPaste-macos-arm64.dmg" \
            "$APP_PATH" || true

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-msix]
    # Run only on tag pushes and only when the mandatory builds succeeded.
    # MSIX is best-effort — allow it to fail without blocking the release.
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.result == 'success' &&
      needs.build-macos.result == 'success' &&
      needs.build-msix.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/

      - name: Download MSIX artifact
        if: needs.build-msix.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: msix-release
          path: artifacts/
        continue-on-error: true

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Build cumulative, app-only release notes for the entire minor series.
          # For patch releases (Z>0) this merges all X.Y.* patches together and
          # strips website/CI/landing-page changes — app changes only.
          node scripts/extract-cumulative-changelog.mjs "$VERSION" > release-body.md

          if [ ! -s release-body.md ]; then
            echo "Release $VERSION" > release-body.md
          fi

      - name: AI-enhance release notes
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pwsh scripts/generate-release-notes.ps1 `
            -RawChangelog "release-body.md" `
            -Version "${{ steps.notes.outputs.version }}" `
            -OutputDir "."
          if (Test-Path "release-notes-en.md") {
            Copy-Item "release-notes-en.md" "release-body.md" -Force
            Write-Host "AI-generated release notes applied"
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WhisPaste v${{ steps.notes.outputs.version }}
          body_path: release-body.md
          draft: false
          make_latest: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Org/Project/URL must match values in lib/core/app_info.dart
          SENTRY_ORG: silvio-lindstedt-und-maik-g-y2
          SENTRY_PROJECT: flutter_whispaste
          SENTRY_URL: https://de.sentry.io
        with:
          environment: production
          release: whispaste@${{ steps.notes.outputs.version }}

      - name: Trigger website redeploy
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh workflow run deploy-pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
