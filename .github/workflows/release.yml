name: Release

# Triggert ausschließlich bei Tag-Push (oder manuell). Ein reiner Merge nach
# main ohne Tag würde sonst Win+macOS+MSIX bauen, ohne dass `create-release`
# (das nur für Tags läuft) jemals ein Release veröffentlicht — die Artefakte
# wären weggeworfene Build-Zeit. CI auf dev validiert vor dem Merge.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (NSIS + MSIX)
    runs-on: windows-latest
    outputs:
      msix-built: ${{ steps.msix_config.outputs.skip != 'true' }}
      # Explicit success marker: set by the last real build step. Decouples
      # downstream jobs from `needs.build-windows.result`, which can flip to
      # `failure` when an action's Post-step (e.g. flutter-action cache save)
      # exits non-zero even though every functional step succeeded.
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          # Resolve the version from the tag (preferred) or pubspec.yaml so
          # APP_VERSION can be baked into the binary via --dart-define. This
          # makes app_info.appVersion available synchronously at app start,
          # so Sentry's options.release is correct from the first event.
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }

          flutter build windows --release --no-tree-shake-icons `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" `
            --dart-define=APP_VERSION="$version"

      # Upload native PDB/DLL debug symbols so Sentry can symbolicate
      # native crash frames. Skipped silently when the secret is unset
      # (e.g. on forks). Symbol upload does NOT count against Sentry's
      # Free-Tier event/span quotas — it is a separate billing bucket
      # only constrained by total storage (effectively unlimited at our
      # release cadence).
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          # Must match `sentryRelease` in lib/core/app_info.dart and
          # the action-release step at the end of this workflow.
          $env:SENTRY_RELEASE = "whispaste@$version"
          dart run sentry_dart_plugin

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          # X.X.X.0 format for Windows file properties (strip prerelease suffix)
          $parts = $version -split '[.\-]'
          $numeric = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DPRODUCT_VERSION=$version `
            /DPRODUCT_VERSION_NUMERIC=$numeric `
            installer\whispaste.nsi

          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          Write-Host "Built: installer\WhisPaste-Setup.exe"

      # --- WhisPaste-Diagnose: Dart-native .exe (dart compile exe) ---------
      # Native Windows build — no ps2exe, no PowerShell wrapper. Produces a
      # self-contained Dart AOT binary that ships as the release artifact.
      - name: Build WhisPaste-Diagnose.exe (Dart)
        working-directory: packages/whispaste_diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dart pub get
          $diagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($diagVersion)) { $diagVersion = 'unbekannt' }
          dart compile exe bin/whispaste_diagnose.dart `
            --define=whispaste_version=$diagVersion `
            -o dist/WhisPaste-Diagnose.exe
          if (-not (Test-Path dist/WhisPaste-Diagnose.exe)) {
            throw 'dart compile exe did not produce WhisPaste-Diagnose.exe'
          }
          Write-Output "Binary size: $((Get-Item dist/WhisPaste-Diagnose.exe).Length) bytes"

      # Wichtig: Portable ZIP MUSS vor `msix:create` gebaut werden, sonst
      # landet die später erzeugte .msix-Datei im Release-Ordner und damit
      # auch im Portable-Zip.
      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force

          # Portable ZIP from build output
          $buildDir = "build\windows\x64\runner\Release"
          $zipName = "WhisPaste-$version-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$artifactDir\$zipName"

          # NSIS installer (stable filename for direct download links)
          Copy-Item "installer\WhisPaste-Setup.exe" "$artifactDir\"

          # WhisPaste-Diagnose: Dart-native standalone .exe.
          Copy-Item "packages\whispaste_diagnostics\dist\WhisPaste-Diagnose.exe" "$artifactDir\"

          Write-Host "Release artifacts:"
          Get-ChildItem $artifactDir

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-artifacts/

      # MSIX wird im selben Job gebaut, weil msix:create unter der Haube
      # exakt denselben `flutter build windows --release` braucht, den wir
      # oben bereits ausgeführt haben. Mit `--build-windows false` überspringt
      # msix:create den Rebuild und nutzt das vorhandene Release-Verzeichnis.
      - name: Configure MSIX publisher and version
        id: msix_config
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          if (-not $env:MSIX_PUBLISHER) {
            Write-Warning "MSIX_PUBLISHER secret not set — skipping MSIX build"
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $parts = $version -split '[.\-]'
          $numericVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          $content = Get-Content pubspec.yaml
          $content = $content -replace 'msix_version:.*', "msix_version: $numericVersion"
          # Replace only the `publisher:` line, not `publisher_display_name:`
          $content = $content -replace '(?m)^(\s*)publisher:\s.*', "`${1}publisher: $env:MSIX_PUBLISHER"
          $content | Set-Content pubspec.yaml

          Write-Host "MSIX configured: version=$numericVersion publisher=$env:MSIX_PUBLISHER"
          echo "skip=false" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        if: steps.msix_config.outputs.skip != 'true'
        run: dart run msix:create --store --build-windows false

      - name: Upload MSIX
        if: steps.msix_config.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msix-release
          path: build/windows/x64/runner/Release/*.msix

      - name: Mark build succeeded
        id: mark_success
        shell: pwsh
        run: echo "ok=true" >> $env:GITHUB_OUTPUT

  wack-gate:
    name: WACK Pre-Certification (non-blocking)
    needs: [build-windows]
    # Only run when an MSIX was actually built. Non-blocking: continue-on-error
    # at job level ensures a WACK tooling failure never blocks the release.
    continue-on-error: true
    if: |
      !cancelled() &&
      needs.build-windows.outputs.msix-built == 'true' &&
      needs.build-windows.outputs.build-succeeded == 'true'
    runs-on: windows-latest
    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: msix-release
          path: msix/

      - name: Run WACK (Windows App Certification Kit)
        id: wack
        continue-on-error: true
        shell: pwsh
        run: |
          # Locate appcert.exe from the Windows SDK (installed on windows-latest runners).
          $appcert = @(
            'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe',
            'C:\Program Files\Windows Kits\10\App Certification Kit\appcert.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $appcert) {
            Write-Host "::warning::appcert.exe not found on this runner — WACK skipped (headless/tooling limitation)."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $msixPath = Get-ChildItem msix\*.msix | Select-Object -First 1 -ExpandProperty FullName
          if (-not $msixPath) {
            Write-Host "::warning::No .msix file found in msix/ — WACK skipped."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $reportPath = "$env:RUNNER_TEMP\wack-report.xml"
          Write-Host ":: Running WACK against: $msixPath"
          Write-Host ":: Report output: $reportPath"

          # Reset any previous WACK state.
          & $appcert reset
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::appcert reset failed (exit $LASTEXITCODE) — likely a headless/desktop-session limitation. WACK result unreliable."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          & $appcert test -appxpackagepath $msixPath -reportoutputpath $reportPath
          $wackExit = $LASTEXITCODE
          echo "wack_exit=$wackExit" >> $env:GITHUB_OUTPUT
          echo "wack_skipped=false" >> $env:GITHUB_OUTPUT

          if ($wackExit -ne 0) {
            Write-Host "::warning::appcert exited with code $wackExit. This may indicate a headless limitation or a real certification issue — review the uploaded WACK report artifact."
          } else {
            Write-Host ":: appcert test completed (exit 0)."
          }

          # Parse the XML report for FAIL results and surface them as warnings.
          if (Test-Path $reportPath) {
            try {
              [xml]$report = Get-Content $reportPath -Encoding UTF8
              $tests = $report.REPORT.REQUIREMENT | ForEach-Object { $_ }
              $failed = @($tests | Where-Object { $_.RESULT -eq 'FAIL' })
              $passed = @($tests | Where-Object { $_.RESULT -eq 'PASS' })
              $skipped = @($tests | Where-Object { $_.RESULT -notin @('PASS','FAIL') })
              Write-Host ":: WACK results — PASS: $($passed.Count), FAIL: $($failed.Count), OTHER: $($skipped.Count)"
              foreach ($t in $failed) {
                $name = if ($t.REQUIREMENTNAME) { $t.REQUIREMENTNAME } else { $t.Name }
                $desc = if ($t.DESCRIPTION) { " — $($t.DESCRIPTION)" } else { '' }
                Write-Host "::warning::WACK FAIL: $name$desc"
              }
              if ($failed.Count -eq 0 -and $wackExit -eq 0) {
                Write-Host "::notice::WACK: all certification tests passed."
              }
            } catch {
              Write-Host "::warning::Could not parse WACK XML report: $_"
            }
          }

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wack-report
          path: ${{ runner.temp }}\wack-report.xml
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    outputs:
      # See build-windows for rationale (decouple from Post-step failures).
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\r\n')"

          # Resolve the version from the tag (preferred) or pubspec.yaml so
          # APP_VERSION can be baked into the binary via --dart-define. This
          # makes app_info.appVersion available synchronously at app start,
          # so Sentry's options.release is correct from the first event.
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi

          flutter build macos --release --no-tree-shake-icons \
            "--dart-define=SUPABASE_URL=$URL" \
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY" \
            "--dart-define=APP_VERSION=$VERSION"

      # Upload .dSYM debug symbols for native crash symbolication.
      # See the Windows job for rationale and Free-Tier accounting.
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          export SENTRY_RELEASE="whispaste@$VERSION"
          dart run sentry_dart_plugin

      # ── Developer-ID Signing + Notarization ──────────────────────────────────
      # Requires three secrets (set via scripts/setup-gh-secrets.sh):
      #   MACOS_DEVELOPER_ID_CERT_BASE64 — base64-encoded .p12 certificate
      #   MACOS_DEVELOPER_ID_CERT_PASSWORD — .p12 export password
      #   ASC_API_KEY_BASE64 — base64-encoded AuthKey_YXVRQ2CQF7.p8
      #
      # If any of these secrets are absent the step is skipped with a clear
      # message and the job continues — unsigned DMG is still uploaded as
      # a best-effort artifact. Build stays green (AC4).
      - name: Check signing secrets
        id: signing_check
        run: |
          if [[ -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}" || \
                -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}" || \
                -z "${{ secrets.ASC_API_KEY_BASE64 }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not set — skipping Developer-ID notarization. DMG will be unsigned."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer-ID certificate
        if: steps.signing_check.outputs.skip != 'true'
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          # Create a dedicated keychain so the cert does not persist on the runner.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import the .p12 certificate.
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          echo "$MACOS_DEVELOPER_ID_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Persist keychain path for subsequent steps.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Decode ASC API key
        if: steps.signing_check.outputs.skip != 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # notarytool looks for the key at the standard Fastlane path.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_YXVRQ2CQF7.p8"
          chmod 600 "$KEY_DIR/AuthKey_YXVRQ2CQF7.p8"

      - name: Sign, notarize and staple .app
        if: steps.signing_check.outputs.skip != 'true'
        run: |
          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Sign the app bundle with Developer-ID Application cert + Hardened Runtime.
          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            --entitlements macos/Runner/Release.entitlements \
            "$APP_PATH"

          # Submit to Apple for notarization and wait (AC2: notarytool --wait).
          # Key-ID YXVRQ2CQF7, Team Q7V3X27S2U (AC3: shared ASC API key).
          xcrun notarytool submit "$APP_PATH" \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_YXVRQ2CQF7.p8" \
            --key-id "YXVRQ2CQF7" \
            --issuer "ae231e6e-48ea-400d-9f9c-2698f4a3ab57" \
            --team-id "Q7V3X27S2U" \
            --wait \
            --verbose

          # Staple the notarization ticket to the bundle (AC2).
          xcrun stapler staple "$APP_PATH"

          # Post-build smoke: verify ticket and Gatekeeper acceptance (AC5).
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose "$APP_PATH"

          echo "::notice::Developer-ID notarization and stapling completed."

      - name: Clean up keychain
        if: always() && steps.signing_check.outputs.skip != 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Prepare release artifacts
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Portable ZIP
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/$ARTIFACT_DIR/WhisPaste-$VERSION-macos-arm64.zip" whispaste.app
          cd "$OLDPWD"

          # DMG via create-dmg (best-effort; falls back to zip-only)
          brew install create-dmg || true
          create-dmg \
            --volname "WhisPaste" \
            --window-size 500 320 \
            --icon-size 80 \
            --app-drop-link 380 170 \
            --icon "whispaste.app" 120 170 \
            "$ARTIFACT_DIR/WhisPaste-macos-arm64.dmg" \
            "$APP_PATH" || true

          # WhisPaste-Diagnose: Dart-native .app bundle + DMG.
          # Builds the standalone diagnostics tool (pure Dart, no Flutter).
          cd packages/whispaste_diagnostics
          dart pub get
          bash tool/build_app_bundle.sh
          cd "$OLDPWD"
          hdiutil create -volname "WhisPaste-Diagnose" \
            -srcfolder "packages/whispaste_diagnostics/dist/WhisPaste-Diagnose.app" \
            -ov -format UDZO \
            "$ARTIFACT_DIR/WhisPaste-Diagnose-macOS.dmg"

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: release-artifacts/

      - name: Mark build succeeded
        id: mark_success
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    outputs:
      # See build-windows for rationale (decouple from Post-step failures).
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      # ── §3.1 Build-Stolperfallen — vollständig abgebildet ──────────────────────
      # sentry-native: libcurl4-openssl-dev + zlib1g-dev
      # jni-Plugin: default-jdk + JAVA_HOME
      # flutter_soloud x86 Xiph: libflac-dev + libogg-dev + libopus-dev + libvorbis-dev
      # libasound2-dev: ALSA (audio pipeline)
      # libkeybinder-3.0-dev + libnotify-dev + libayatana-appindicator3-dev: desktop integration
      # libsecret-1-dev + libgtk-3-dev: Flutter Linux baseline
      # clang + cmake + ninja-build + pkg-config: Flutter Linux build toolchain
      # -Werror: already removed in linux/CMakeLists.txt (commit 26fab952)
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libkeybinder-3.0-dev libnotify-dev \
            libayatana-appindicator3-dev libasound2-dev \
            libcurl4-openssl-dev zlib1g-dev \
            libflac-dev libogg-dev libopus-dev libvorbis-dev \
            default-jdk

      # jni-Plugin: JAVA_HOME muss gesetzt sein (§3.1)
      - name: Set JAVA_HOME
        run: |
          JAVAC_PATH="$(which javac)"
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$JAVAC_PATH")")")"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          # flutter_soloud §3.1: Xiph system libs statt x86-only Bundles verwenden
          TRY_SYSTEM_LIBS_FIRST: "1"
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\r\n')"

          # Resolve version from tag (preferred) or pubspec.yaml
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi

          flutter build linux --release --no-tree-shake-icons \
            "--dart-define=SUPABASE_URL=$URL" \
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY" \
            "--dart-define=APP_VERSION=$VERSION"

      # §3.1: crashpad_handler braucht chmod +x (kann nach dem Flutter-Build fehlen)
      - name: Ensure crashpad_handler is executable
        run: |
          HANDLER="build/linux/x64/release/bundle/lib/crashpad_handler"
          if [ -f "$HANDLER" ]; then
            chmod +x "$HANDLER"
            echo "crashpad_handler: chmod +x applied"
          else
            echo "crashpad_handler not found at expected path — skipping (may be bundled differently)"
          fi

      - name: Prepare release artifacts
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::Flutter Linux release bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          ZIP_NAME="WhisPaste-${VERSION}-linux-x64.tar.gz"
          tar -czf "$ARTIFACT_DIR/$ZIP_NAME" -C "$BUNDLE_DIR" .

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: release-artifacts/

      - name: Mark build succeeded
        id: mark_success
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # ── Optional follow-up: Linux arm64 ───────────────────────────────────────────
  # arm64 is explicitly NOT active (maintainer decision: x86_64 first).
  # To add arm64 support later, duplicate build-linux above with:
  #   runs-on: ubuntu-24.04-arm   (GitHub-hosted arm64 runner, available on paid plans)
  #   artifact name: linux-arm64-release
  #   ZIP_NAME: WhisPaste-${VERSION}-linux-arm64.tar.gz
  # No other changes needed — the Flutter Linux build is arch-agnostic given
  # the same system-library versions. Tested locally on Pi 5 / Ubuntu 26.04 arm64.
  # ──────────────────────────────────────────────────────────────────────────────

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    # Alle drei Platform-Builds müssen erfolgreich sein. (MSIX ist optional —
    # wenn MSIX_PUBLISHER nicht gesetzt ist, läuft Build-Windows trotzdem
    # erfolgreich durch und das msix-release-Artefakt fehlt einfach.)
    #
    # Wir prüfen den explizit gesetzten `build-succeeded`-Output statt
    # `needs.*.result`, weil ein non-zero-Exit in einem Action-Post-Step
    # (z. B. flutter-action Cache-Save) den Job-Result auf `failure` kippt,
    # obwohl alle echten Build/Upload-Schritte grün durchliefen. `!cancelled()`
    # stellt sicher, dass dieser Job trotz eines `failure`-Results der
    # Build-Jobs überhaupt startet, damit die Outputs ausgewertet werden.
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.outputs.build-succeeded == 'true' &&
      needs.build-macos.outputs.build-succeeded == 'true' &&
      needs.build-linux.outputs.build-succeeded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: artifacts/

      - name: Download MSIX artifact
        if: needs.build-windows.outputs.msix-built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: msix-release
          path: artifacts/

      - name: Extract changelog inputs
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Two-input split: patch-specific delta + cumulative minor highlights.
          # The AI step combines them into a non-repetitive bilingual release
          # body. Website/CI/landing-page bullets are filtered in both modes.
          node scripts/extract-cumulative-changelog.mjs "$VERSION" --mode=patch > patch-changelog.md
          node scripts/extract-cumulative-changelog.mjs "$VERSION" --mode=minor > minor-changelog.md

      - name: AI-enhance release notes
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-release-notes.mjs \
            --version "${{ steps.notes.outputs.version }}" \
            --patch patch-changelog.md \
            --minor minor-changelog.md \
            --output-dir .

          if [ -s release-notes-en.md ]; then
            cp release-notes-en.md release-body.md
            echo "AI-generated release notes applied"
          else
            echo "Release ${{ steps.notes.outputs.version }}" > release-body.md
          fi

      - name: Upload release notes as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes-en.md
            release-notes-de.md

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: WhisPaste v${{ steps.notes.outputs.version }}
          body_path: release-body.md
          draft: false
          make_latest: true
          # `release-notes-de.md` is attached as an asset so the website
          # changelog (build-releases.ts) can source the German body directly,
          # instead of re-translating the English body. Single DE source of
          # truth: the same file already drives the Microsoft Store listing.
          files: |
            artifacts/*
            release-notes-de.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Org/Project/URL must match values in lib/core/app_info.dart
          SENTRY_ORG: silvio-lindstedt-und-maik-g-y2
          SENTRY_PROJECT: flutter_whispaste
          SENTRY_URL: https://de.sentry.io
        with:
          environment: production
          release: whispaste@${{ steps.notes.outputs.version }}

      - name: Trigger website redeploy
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          gh workflow run deploy-pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit-ms-store:
    name: Submit to Microsoft Store
    needs: [build-windows, wack-gate, create-release]
    # Non-blocking channel: a failed submission warns but does not cancel sibling
    # jobs (manifest-bump runs in parallel, validate-packaging follows it).
    # Mirrors the fault-tolerance idiom used in wack-gate and manifest-bump.
    continue-on-error: true
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.outputs.msix-built == 'true' &&
      needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check required secrets
        id: check
        run: |
          if [[ -z "${{ secrets.MS_STORE_APP_ID }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::MS_STORE_APP_ID not set — skipping MS Store submission"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download MSIX artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: msix-release
          path: msix/

      - name: Download release notes
        if: steps.check.outputs.skip != 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Resolve MSIX path
        if: steps.check.outputs.skip != 'true'
        id: msix
        run: echo "path=$(ls msix/*.msix | head -1)" >> "$GITHUB_OUTPUT"

      - name: Submit to Microsoft Store
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          MS_STORE_APP_ID:        ${{ secrets.MS_STORE_APP_ID }}
          MS_STORE_TENANT_ID:     ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID:     ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          $wnEn = if (Test-Path 'release-notes-en.md') {
            Get-Content 'release-notes-en.md' -Raw -Encoding UTF8
          } else { '' }
          $wnDe = if (Test-Path 'release-notes-de.md') {
            Get-Content 'release-notes-de.md' -Raw -Encoding UTF8
          } else { '' }

          ./scripts/submit-ms-store.ps1 `
            -AppId         $env:MS_STORE_APP_ID `
            -TenantId      $env:MS_STORE_TENANT_ID `
            -ClientId      $env:MS_STORE_CLIENT_ID `
            -ClientSecret  $env:MS_STORE_CLIENT_SECRET `
            -MsixPath      '${{ steps.msix.outputs.path }}' `
            -WhatsNewEn    $wnEn `
            -WhatsNewDe    $wnDe

  # ── Manifest-Auto-Bump ────────────────────────────────────────────────────────
  # Updates version + SHA256 in all three packaging manifests as part of the release.
  # Each channel step is fault-tolerant: a failed channel emits ::warning:: and
  # continues without blocking the others.
  # The bumped manifests are committed back to dev, which then triggers the
  # packaging-validate workflow automatically. The explicit validate-packaging job
  # below provides in-workflow dependency tracking (AC5 wiring).
  manifest-bump:
    name: Bump packaging manifests (Scoop · winget · Homebrew)
    needs: [create-release]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # ── Scoop ──────────────────────────────────────────────────────────────────
      # Downloads the Windows ZIP from the just-published release, computes SHA256,
      # and patches version + url + hash in packaging/scoop/whispaste.json.
      # The checkver/autoupdate blocks stay intact for the Scoop bucket bot.
      - name: Bump Scoop manifest
        id: scoop
        continue-on-error: true
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-${VERSION}-windows-x64.zip"

          SHA256=$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::Scoop bump: could not compute SHA256 from $URL — skipped"
            exit 0
          fi

          jq --indent 4 \
            --arg v "$VERSION" --arg h "$SHA256" \
            '.version = $v |
             .architecture["64bit"].hash = $h |
             .architecture["64bit"].url  = ("https://github.com/whispaste/whispaste/releases/download/v" + $v + "/WhisPaste-" + $v + "-windows-x64.zip")' \
            packaging/scoop/whispaste.json > packaging/scoop/whispaste.json.tmp \
          && mv packaging/scoop/whispaste.json.tmp packaging/scoop/whispaste.json
          echo "::notice::Scoop manifest → $VERSION (sha256: ${SHA256:0:16}…)"

      # ── winget ─────────────────────────────────────────────────────────────────
      # Primary: wingetcreate update (downloads installer, computes SHA256, updates YAMLs).
      # No --submit flag — local manifest update only; submit is a separate manual step.
      # Fallback: direct YAML + SHA256 update via sed/curl (used until the package
      # is indexed in winget-pkgs and wingetcreate update succeeds).
      - name: Bump winget manifests (wingetcreate update — no submit)
        id: winget
        continue-on-error: true
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          INSTALLER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-Setup.exe"

          export PATH="$PATH:$HOME/.dotnet/tools"

          # Primary: wingetcreate update — no --submit, local output only.
          if dotnet tool install --global Microsoft.WingetCreate --ignore-failed-sources 2>/dev/null \
          && wingetcreate update SilvioLindstedt.WhisPaste \
               --version "$VERSION" \
               --urls    "$INSTALLER_URL" \
               --out     packaging/winget \
               --token   "${{ secrets.GITHUB_TOKEN }}" 2>&1; then
            echo "::notice::winget manifests → $VERSION via wingetcreate (no submit)"
            exit 0
          fi

          echo "::warning::wingetcreate update skipped or failed — falling back to direct YAML bump"

          # Fallback: download installer, compute SHA256 (uppercase), update YAML inline.
          SHA256=$(curl -fsSL --retry 3 "$INSTALLER_URL" | sha256sum | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::winget bump: could not compute SHA256 from installer URL — skipped"
            exit 0
          fi

          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.yaml
          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.locale.en-US.yaml
          sed -i "s|InstallerUrl:.*|InstallerUrl: $INSTALLER_URL|" packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          sed -i "s/InstallerSha256:.*/InstallerSha256: $SHA256/"  packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          echo "::notice::winget manifests → $VERSION (direct YAML bump, no submit)"

      # ── Homebrew ───────────────────────────────────────────────────────────────
      # Guard: only runs when notarization secrets are present, i.e. the macOS build
      # was notarized. An unnotarized DMG must not be pushed to the Homebrew tap
      # (Gatekeeper would quarantine it). Mirrors the signing-check idiom in build-macos.
      - name: Check notarization secrets (Homebrew guard)
        id: notarization_check
        run: |
          if [[ -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}" || \
                -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}" || \
                -z "${{ secrets.ASC_API_KEY_BASE64 }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Homebrew bump: notarization secrets absent — cask bump skipped (requires notarized build)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Homebrew cask
        id: homebrew
        continue-on-error: true
        if: steps.notarization_check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-${VERSION}-macos-arm64.zip"

          SHA256=$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::Homebrew bump: could not compute SHA256 from $URL — skipped"
            exit 0
          fi

          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" packaging/homebrew/whispaste.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/"   packaging/homebrew/whispaste.rb
          echo "::notice::Homebrew cask → $VERSION (sha256: ${SHA256:0:16}…)"

      # ── Validate Scoop manifest inline before committing ───────────────────────
      # Re-runs the same logic as packaging-validate.yml / scoop job to ensure the
      # bumped JSON is valid before it lands on dev. The full 3-channel validation
      # (including winget + Homebrew) runs in the validate-packaging job below.
      - name: Validate bumped Scoop manifest (packaging-validate gate)
        run: |
          python3 - packaging/scoop/whispaste.json <<'PYEOF'
          import json, sys, pathlib
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          errors = []
          if not data.get("version"):
              errors.append("missing: version")
          has_url  = bool(data.get("url"))
          has_arch = isinstance(data.get("architecture"), dict)
          if not has_url and not has_arch:
              errors.append("missing: url / architecture")
          has_hash      = bool(data.get("hash"))
          has_arch_hash = any(
              isinstance(v, dict) and v.get("hash")
              for v in (data.get("architecture") or {}).values()
          )
          if not has_hash and not has_arch_hash:
              errors.append("missing: hash / architecture.<arch>.hash")
          if not data.get("bin"):
              errors.append("missing: bin")
          if not data.get("autoupdate"):
              errors.append("missing: autoupdate")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("  ✓ Scoop manifest valid")
          PYEOF

      # ── Commit and push bumped manifests to dev ─────────────────────────────────
      # This push triggers packaging-validate.yml automatically (push: branches: dev,
      # paths: packaging/**) and also feeds the explicit validate-packaging job below.
      - name: Commit and push bumped manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet packaging/; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add packaging/
          git commit -m "chore(packaging): bump manifests to ${{ steps.ver.outputs.version }}"
          git push origin dev

  # ── Validate bumped manifests (full 3-channel, packaging-validate gate) ────────
  # Runs the packaging-validate reusable workflow against the bumped manifests on dev.
  # Depends on manifest-bump so it only starts after manifests are committed.
  # Non-blocking: continue-on-error would be set here if this gate should warn rather
  # than fail; currently it is a hard gate (failures are visible in the release run).
  validate-packaging:
    name: Validate bumped packaging manifests (packaging-validate gate)
    needs: [manifest-bump]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.manifest-bump.result == 'success'
    uses: ./.github/workflows/packaging-validate.yml
    with:
      ref: dev
