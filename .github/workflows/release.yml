name: Release

# Triggert ausschließlich bei Tag-Push (oder manuell). Ein reiner Merge nach
# main ohne Tag würde sonst Win+macOS+MSIX bauen, ohne dass `create-release`
# (das nur für Tags läuft) jemals ein Release veröffentlicht — die Artefakte
# wären weggeworfene Build-Zeit. CI auf dev validiert vor dem Merge.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    # Promote-Job (PRD §5.2/§7.2, Issue 05): a manual dispatch that promotes a
    # validated beta build to stable WITHOUT rebuilding — it copies the beta
    # release artifacts verbatim under a new stable tag and re-derives the
    # stable appcast (same EdDSA signature, since the bytes + seed are
    # identical). The `promote` boolean gates the dedicated job below so a plain
    # manual dispatch keeps its previous behavior (build jobs run as today).
    inputs:
      promote:
        description: 'Promote a validated beta build to stable — copy artifacts + same EdDSA signature, NO rebuild (PRD §7.2)'
        type: boolean
        required: true
        default: false
      beta-tag:
        description: 'Source beta tag, e.g. v1.2.44-beta.1'
        type: string
        required: true
      stable-version:
        description: 'Target stable version, e.g. 1.2.44 (released under tag vX.Y.Z)'
        type: string
        required: true

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows (NSIS + MSIX)
    runs-on: windows-latest
    # Skip the (expensive) multi-platform rebuilds on a Promote dispatch — the
    # promote job copies beta artifacts verbatim instead of building (PRD §7.2).
    # Tag pushes and plain manual dispatches are unaffected (the guard only
    # short-circuits when promote=true).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote == 'true') }}
    outputs:
      msix-built: ${{ steps.msix_config.outputs.skip != 'true' }}
      # Explicit success marker: set by the last real build step. Decouples
      # downstream jobs from `needs.build-windows.result`, which can flip to
      # `failure` when an action's Post-step (e.g. flutter-action cache save)
      # exits non-zero even though every functional step succeeded.
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows release
        shell: pwsh
        run: |
          # Resolve the version from the tag (preferred) or pubspec.yaml so
          # APP_VERSION can be baked into the binary via --dart-define. This
          # makes app_info.appVersion available synchronously at app start,
          # so Sentry's options.release is correct from the first event.
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }

          flutter build windows --release --no-tree-shake-icons `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" `
            --dart-define=WHISPASTE_MATOMO_URL="${{ secrets.WHISPASTE_MATOMO_URL }}" `
            --dart-define=WHISPASTE_MATOMO_SITE_ID="${{ secrets.WHISPASTE_MATOMO_SITE_ID }}" `
            --dart-define=APP_VERSION="$version"

      # Upload native PDB/DLL debug symbols so Sentry can symbolicate
      # native crash frames. Skipped silently when the secret is unset
      # (e.g. on forks). Symbol upload does NOT count against Sentry's
      # Free-Tier event/span quotas — it is a separate billing bucket
      # only constrained by total storage (effectively unlimited at our
      # release cadence).
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          # Must match `sentryRelease` in lib/core/app_info.dart and
          # the action-release step at the end of this workflow.
          $env:SENTRY_RELEASE = "whispaste@$version"
          dart run sentry_dart_plugin

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          # X.X.X.N format for Windows file properties (VIFileVersion, read by
          # WinSparkle as the "installed version" for its update comparison —
          # see auto_updater_windows: it never calls win_sparkle_set_app_details,
          # so it falls back to the EXE's own VERSIONINFO resource). The 4th
          # component MUST be the pubspec BUILD NUMBER (the "+N" suffix in
          # pubspec.yaml's version field), NOT the "-beta.B" pre-release
          # counter — those are two independent counters that can diverge
          # (e.g. beta.9+10). Flutter's own tooling already derives
          # FLUTTER_VERSION_BUILD this exact way for the actually-running
          # whispaste.exe (packages/flutter_tools/lib/src/cmake.dart's
          # _tryDetermineBuildVersion, embedded via windows/runner/Runner.rc's
          # FILEVERSION) — this must match it, or the installer advertises a
          # different numeric version than the binary it installs. That
          # mismatch is exactly why WinSparkle's "check for updates" re-offered
          # the just-installed build (mirrors generate_appcast.sh's
          # SPARKLE_VERSION_COMPARE, which uses the same derivation).
          $pubspecRaw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
          $pubspecVersion = ($pubspecRaw -replace '^\s*version:\s*', '').Trim()
          $buildNumber = '0'
          if ($pubspecVersion -match '\+(\d+)$') {
            $buildNumber = $Matches[1]
          }
          $parts = $version -split '[.\-]'
          $numeric = "$($parts[0]).$($parts[1]).$($parts[2]).$buildNumber"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DPRODUCT_VERSION=$version `
            /DPRODUCT_VERSION_NUMERIC=$numeric `
            installer\whispaste.nsi

          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          Write-Host "Built: installer\WhisPaste-Setup.exe"

      # --- WhisPaste-Diagnose: Dart-native .exe (dart compile exe) ---------
      # Native Windows build — no ps2exe, no PowerShell wrapper. Produces a
      # self-contained Dart AOT binary that ships as the release artifact.
      - name: Build WhisPaste-Diagnose.exe (Dart)
        working-directory: packages/whispaste_diagnostics
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          dart pub get
          $diagVersion = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($diagVersion)) { $diagVersion = 'unbekannt' }
          dart compile exe bin/whispaste_diagnose.dart `
            --define=whispaste_version=$diagVersion `
            -o dist/WhisPaste-Diagnose.exe
          if (-not (Test-Path dist/WhisPaste-Diagnose.exe)) {
            throw 'dart compile exe did not produce WhisPaste-Diagnose.exe'
          }
          Write-Output "Binary size: $((Get-Item dist/WhisPaste-Diagnose.exe).Length) bytes"

      # --- WhisPaste-GPU-Probe: voll gebündelte, entpack-und-doppelklick ZIP --
      # Kompiliert die Dart-native Probe-exe frisch (mit Versions-Define) und
      # fügt sie mit dem statischen, vorab gepinnten Engine-Bundle zur fertigen
      # ZIP zusammen (make-dist.ps1). Das Engine-Bundle (const-me, sherpa,
      # faster-whisper, Vulkan, DirectML + CPU-Baseline) ändert sich praktisch
      # nie und wird daher NICHT pro Release neu gebaut, sondern aus dem festen
      # Tag `gpu-probe-engines` gezogen (siehe tools/pack-engines.ps1).
      # Tolerant via continue-on-error: fehlt das Bundle (z. B. vor dem ersten
      # manuellen Upload), wird die GPU-Probe-ZIP übersprungen statt das ganze
      # Release zu brechen.
      - name: Build WhisPaste-GPU-Probe ZIP
        id: gpu_probe
        continue-on-error: true
        working-directory: packages/whispaste_gpu_probe
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENGINES_TAG: gpu-probe-engines
          ENGINES_ASSET: gpu-probe-engines-x64.zip
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($version)) { $version = 'unbekannt' }

          $runDir = Join-Path $env:RUNNER_TEMP 'gpuprobe-run'
          $outDir = Join-Path $env:RUNNER_TEMP 'gpuprobe-dist'
          New-Item -ItemType Directory -Force -Path $runDir, $outDir | Out-Null

          # Statisches Engine-Bundle vom gepinnten Release ziehen und in den
          # RunDir entpacken (Inhalt liegt im Blob bereits auf Root-Ebene).
          gh release download $env:ENGINES_TAG `
            --repo "${{ github.repository }}" `
            --pattern $env:ENGINES_ASSET `
            --dir $env:RUNNER_TEMP --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "engine bundle '$env:ENGINES_ASSET' not found on tag '$env:ENGINES_TAG' — skipping GPU-Probe ZIP"
          }
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP $env:ENGINES_ASSET) `
            -DestinationPath $runDir -Force

          # Probe-exe frisch kompilieren (Versions-Define landet im Report).
          dart pub get
          dart compile exe bin/whispaste_gpu_probe.dart `
            --define=whispaste_version=$version `
            -o (Join-Path $runDir 'whispaste-gpu-probe.exe')

          # Probe-exe + Engines + LIESMICH.txt zur nutzbaren ZIP zusammenführen.
          & ".\tools\make-dist.ps1" -Version $version -RunDir $runDir -OutDir $outDir
          $zip = Join-Path $outDir "WhisPaste-GPU-Probe-$version.zip"
          if (-not (Test-Path $zip)) { throw "make-dist did not produce $zip" }
          Write-Output "GPU-Probe ZIP: $zip ($([math]::Round((Get-Item $zip).Length / 1MB, 0)) MB)"
          echo "zip=$zip" >> $env:GITHUB_OUTPUT

      # Wichtig: Portable ZIP MUSS vor `msix:create` gebaut werden, sonst
      # landet die später erzeugte .msix-Datei im Release-Ordner und damit
      # auch im Portable-Zip.
      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          if ($refName -match '^\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force

          # Portable ZIP from build output
          $buildDir = "build\windows\x64\runner\Release"
          $zipName = "WhisPaste-$version-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$artifactDir\$zipName"

          # NSIS installer (stable filename for direct download links)
          Copy-Item "installer\WhisPaste-Setup.exe" "$artifactDir\"

          # WhisPaste-Diagnose: Dart-native standalone .exe.
          Copy-Item "packages\whispaste_diagnostics\dist\WhisPaste-Diagnose.exe" "$artifactDir\"

          # WhisPaste-GPU-Probe: voll gebündelte, nutzbare ZIP (falls gebaut —
          # der Schritt ist continue-on-error, das Engine-Bundle kann fehlen).
          $gpuZip = "${{ steps.gpu_probe.outputs.zip }}"
          if ($gpuZip -and (Test-Path $gpuZip)) {
            Copy-Item $gpuZip "$artifactDir\"
            Write-Host "Added GPU-Probe ZIP: $gpuZip"
          } else {
            Write-Warning "GPU-Probe ZIP not built — skipping (engine bundle missing?)"
          }

          Write-Host "Release artifacts:"
          Get-ChildItem $artifactDir

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: release-artifacts/

      # MSIX wird im selben Job gebaut, weil msix:create unter der Haube
      # exakt denselben `flutter build windows --release` braucht, den wir
      # oben bereits ausgeführt haben. Mit `--build-windows false` überspringt
      # msix:create den Rebuild und nutzt das vorhandene Release-Verzeichnis.
      - name: Configure MSIX publisher and version
        id: msix_config
        shell: pwsh
        env:
          MSIX_PUBLISHER: ${{ secrets.MSIX_PUBLISHER }}
        run: |
          # AC-5 / Q2 (PRD §6.3): Beta tags build NO MSIX and trigger NO Store
          # submission. Setting skip=true here short-circuits every downstream
          # MSIX step in this job (Build MSIX, Upload MSIX, .appxupload, symbol
          # upload) AND flips the `msix-built` job output to false, which in
          # turn skips wack-gate and the MSIX download in create-release.
          $refName = "${{ github.ref_name }}"
          if ($refName -match '-beta\.') {
            Write-Warning "Beta tag ($refName) — skipping MSIX build + Store submission (AC-5/Q2)."
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          if (-not $env:MSIX_PUBLISHER) {
            Write-Warning "MSIX_PUBLISHER secret not set — skipping MSIX build"
            echo "skip=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $refName = "${{ github.ref_name }}"
          if ($refName -match '^v?\d+\.\d+\.\d+') {
            $version = $refName.TrimStart('v')
          } else {
            $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
            $version = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          }
          $parts = $version -split '[.\-]'
          $numericVersion = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          $content = Get-Content pubspec.yaml
          $content = $content -replace 'msix_version:.*', "msix_version: $numericVersion"
          # Replace only the `publisher:` line, not `publisher_display_name:`
          $content = $content -replace '(?m)^(\s*)publisher:\s.*', "`${1}publisher: $env:MSIX_PUBLISHER"
          $content | Set-Content pubspec.yaml

          Write-Host "MSIX configured: version=$numericVersion publisher=$env:MSIX_PUBLISHER"
          echo "skip=false" >> $env:GITHUB_OUTPUT

      - name: Build MSIX
        if: steps.msix_config.outputs.skip != 'true'
        run: dart run msix:create --store --build-windows false

      - name: Upload MSIX
        if: steps.msix_config.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msix-release
          path: build/windows/x64/runner/Release/*.msix

      # Build a Store symbol package (.appxupload) so the Partner Center can
      # resolve failureHash/Stack-Signaturen for native crashes. .appxsym ist
      # schlicht ein ZIP der PDBs (kein MakeAppx nötig); .appxupload ist ein
      # ZIP aus MSIX + .appxsym, das der Partner Center beim Submission-Upload
      # automatisch in App + Symbole zerlegt.
      # Fault-tolerant: ein Fehlschlag blockiert niemals den Release — Sentry
      # bleibt die kanonische Crash-Quelle (Issue 04). Ergänzt MS für
      # failureHash-Trending pro Signatur + early-boot-Native-Crashes die
      # Sentry nie erreicht. Beim manuellen Submission das .appxupload statt
      # der nackten .msix hochladen.
      - name: Build Store symbol package (.appxupload)
        if: steps.msix_config.outputs.skip != 'true'
        id: appxupload
        continue-on-error: true
        shell: pwsh
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          $pdbs = Get-ChildItem -Path $buildDir -Filter *.pdb -Recurse -ErrorAction SilentlyContinue
          $msix = Get-ChildItem "$buildDir\*.msix" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $pdbs -or $pdbs.Count -eq 0 -or -not $msix) {
            Write-Warning "No PDBs ($($pdbs.Count)) or MSIX ($msix) — skipping .appxupload"
            echo "built=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $symStaging = "$buildDir\appxsym-staging"
          New-Item -ItemType Directory -Path $symStaging -Force | Out-Null
          $pdbs | Copy-Item -Destination $symStaging -Force
          $appxsym = "$buildDir\WhisPaste.appxsym"
          Compress-Archive -Path "$symStaging\*.pdb" -DestinationPath $appxsym -Force
          Remove-Item -Recurse -Force $symStaging
          if (-not (Test-Path release-artifacts)) { New-Item -ItemType Directory -Path release-artifacts -Force | Out-Null }
          $upStaging = "$buildDir\appxupload-staging"
          New-Item -ItemType Directory -Path $upStaging -Force | Out-Null
          Copy-Item $msix.FullName $upStaging
          Copy-Item $appxsym $upStaging
          $appxupload = "release-artifacts\WhisPaste.appxupload"
          Compress-Archive -Path "$upStaging\*" -DestinationPath $appxupload -Force
          Remove-Item -Recurse -Force $upStaging
          $sizeMB = [math]::Round((Get-Item $appxupload).Length / 1MB, 1)
          Write-Host "Built .appxupload with $($pdbs.Count) PDBs ($sizeMB MB)"
          echo "built=true" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX symbol package
        if: steps.appxupload.outputs.built == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: msix-symbol-package
          path: release-artifacts/*.appxupload

      - name: Mark build succeeded
        id: mark_success
        shell: pwsh
        run: echo "ok=true" >> $env:GITHUB_OUTPUT

  wack-gate:
    name: WACK Pre-Certification (non-blocking)
    needs: [build-windows]
    # Only run when an MSIX was actually built. Non-blocking: continue-on-error
    # at job level ensures a WACK tooling failure never blocks the release.
    continue-on-error: true
    if: |
      !cancelled() &&
      needs.build-windows.outputs.msix-built == 'true' &&
      needs.build-windows.outputs.build-succeeded == 'true'
    runs-on: windows-latest
    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v8
        with:
          name: msix-release
          path: msix/

      - name: Run WACK (Windows App Certification Kit)
        id: wack
        continue-on-error: true
        shell: pwsh
        run: |
          # Locate appcert.exe from the Windows SDK (installed on windows-latest runners).
          $appcert = @(
            'C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe',
            'C:\Program Files\Windows Kits\10\App Certification Kit\appcert.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $appcert) {
            Write-Host "::warning::appcert.exe not found on this runner — WACK skipped (headless/tooling limitation)."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $msixPath = Get-ChildItem msix\*.msix | Select-Object -First 1 -ExpandProperty FullName
          if (-not $msixPath) {
            Write-Host "::warning::No .msix file found in msix/ — WACK skipped."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $reportPath = "$env:RUNNER_TEMP\wack-report.xml"
          Write-Host ":: Running WACK against: $msixPath"
          Write-Host ":: Report output: $reportPath"

          # Reset any previous WACK state.
          & $appcert reset
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning::appcert reset failed (exit $LASTEXITCODE) — likely a headless/desktop-session limitation. WACK result unreliable."
            echo "wack_skipped=true" >> $env:GITHUB_OUTPUT
            exit 0
          }

          & $appcert test -appxpackagepath $msixPath -reportoutputpath $reportPath
          $wackExit = $LASTEXITCODE
          echo "wack_exit=$wackExit" >> $env:GITHUB_OUTPUT
          echo "wack_skipped=false" >> $env:GITHUB_OUTPUT

          if ($wackExit -ne 0) {
            Write-Host "::warning::appcert exited with code $wackExit. This may indicate a headless limitation or a real certification issue — review the uploaded WACK report artifact."
          } else {
            Write-Host ":: appcert test completed (exit 0)."
          }

          # Parse the XML report for FAIL results and surface them as warnings.
          if (Test-Path $reportPath) {
            try {
              [xml]$report = Get-Content $reportPath -Encoding UTF8
              $tests = $report.REPORT.REQUIREMENT | ForEach-Object { $_ }
              $failed = @($tests | Where-Object { $_.RESULT -eq 'FAIL' })
              $passed = @($tests | Where-Object { $_.RESULT -eq 'PASS' })
              $skipped = @($tests | Where-Object { $_.RESULT -notin @('PASS','FAIL') })
              Write-Host ":: WACK results — PASS: $($passed.Count), FAIL: $($failed.Count), OTHER: $($skipped.Count)"
              foreach ($t in $failed) {
                $name = if ($t.REQUIREMENTNAME) { $t.REQUIREMENTNAME } else { $t.Name }
                $desc = if ($t.DESCRIPTION) { " — $($t.DESCRIPTION)" } else { '' }
                Write-Host "::warning::WACK FAIL: $name$desc"
              }
              if ($failed.Count -eq 0 -and $wackExit -eq 0) {
                Write-Host "::notice::WACK: all certification tests passed."
              }
            } catch {
              Write-Host "::warning::Could not parse WACK XML report: $_"
            }
          }

      - name: Upload WACK report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wack-report
          path: ${{ runner.temp }}\wack-report.xml
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    # See build-windows: skip on a Promote dispatch (no rebuild).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote == 'true') }}
    outputs:
      # See build-windows for rationale (decouple from Post-step failures).
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          WHISPASTE_MATOMO_URL: ${{ secrets.WHISPASTE_MATOMO_URL }}
          WHISPASTE_MATOMO_SITE_ID: ${{ secrets.WHISPASTE_MATOMO_SITE_ID }}
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\r\n')"
          MATOMO_URL="$(printf '%s' "$WHISPASTE_MATOMO_URL" | tr -d '\r\n')"
          MATOMO_SITE_ID="$(printf '%s' "$WHISPASTE_MATOMO_SITE_ID" | tr -d '\r\n')"

          # Resolve the version from the tag (preferred) or pubspec.yaml so
          # APP_VERSION can be baked into the binary via --dart-define. This
          # makes app_info.appVersion available synchronously at app start,
          # so Sentry's options.release is correct from the first event.
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi

          flutter build macos --release --no-tree-shake-icons \
            "--dart-define=SUPABASE_URL=$URL" \
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY" \
            "--dart-define=WHISPASTE_MATOMO_URL=$MATOMO_URL" \
            "--dart-define=WHISPASTE_MATOMO_SITE_ID=$MATOMO_SITE_ID" \
            "--dart-define=APP_VERSION=$VERSION"

      # Upload .dSYM debug symbols for native crash symbolication.
      # See the Windows job for rationale and Free-Tier accounting.
      - name: Upload debug symbols to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          export SENTRY_RELEASE="whispaste@$VERSION"
          dart run sentry_dart_plugin

      # ── Developer-ID Signing + Notarization ──────────────────────────────────
      # Reactivated (v1.2.45): the stable self-signed identity (70e3eb4d) was a
      # workaround for not having a paid Apple Developer Program at the time — an
      # active program (Team REDACTED-APPLE-TEAM-ID, ASC API key already used by the local
      # Fastlane lanes) now exists, and Developer-ID is Apple's own supported path
      # for a stable, identity-based designated requirement, so it supersedes the
      # self-signed workaround outright: the macOS Accessibility (TCC) permission
      # still persists across updates (same reasoning as 70e3eb4d), AND the app is
      # notarized — no more "unidentified developer" Gatekeeper warning on a fresh
      # download, and the Homebrew cask path (which requires notarization) unlocks.
      #
      # Requires three secrets (set via scripts/setup-gh-secrets.sh):
      #   MACOS_DEVELOPER_ID_CERT_BASE64 — base64-encoded .p12 certificate
      #   MACOS_DEVELOPER_ID_CERT_PASSWORD — .p12 export password
      #   ASC_API_KEY_BASE64 — base64-encoded AuthKey_REDACTED-ASC-KEY-ID.p8
      #
      # If any of these secrets are absent the step is skipped with a clear
      # message and the job continues — unsigned DMG is still uploaded as
      # a best-effort artifact. Build stays green.
      - name: Check signing secrets
        id: signing_check
        run: |
          if [[ -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}" || \
                -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}" || \
                -z "${{ secrets.ASC_API_KEY_BASE64 }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets not set — skipping Developer-ID notarization. DMG will be unsigned and the Accessibility permission will NOT persist across updates."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import Developer-ID certificate
        if: steps.signing_check.outputs.skip != 'true'
        env:
          MACOS_DEVELOPER_ID_CERT_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}
          MACOS_DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          # Create a dedicated keychain so the cert does not persist on the runner.
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import the .p12 certificate.
          CERT_PATH="$RUNNER_TEMP/devid.p12"
          echo "$MACOS_DEVELOPER_ID_CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$MACOS_DEVELOPER_ID_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productbuild
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Persist keychain path for subsequent steps.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Decode ASC API key
        if: steps.signing_check.outputs.skip != 'true'
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          # notarytool looks for the key at the standard Fastlane path.
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          echo "$ASC_API_KEY_BASE64" | base64 --decode -o "$KEY_DIR/AuthKey_REDACTED-ASC-KEY-ID.p8"
          chmod 600 "$KEY_DIR/AuthKey_REDACTED-ASC-KEY-ID.p8"

      - name: Sign, notarize and staple .app
        if: steps.signing_check.outputs.skip != 'true'
        run: |
          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Sign the app bundle with Developer-ID Application cert + Hardened Runtime.
          codesign --deep --force --options runtime \
            --sign "Developer ID Application" \
            --entitlements macos/Runner/Release.entitlements \
            "$APP_PATH"

          # Submit to Apple for notarization and wait.
          # Key-ID REDACTED-ASC-KEY-ID, Team REDACTED-APPLE-TEAM-ID (same shared ASC API key as Fastlane).
          xcrun notarytool submit "$APP_PATH" \
            --key "$HOME/.appstoreconnect/private_keys/AuthKey_REDACTED-ASC-KEY-ID.p8" \
            --key-id "REDACTED-ASC-KEY-ID" \
            --issuer "REDACTED-ASC-ISSUER-ID" \
            --team-id "REDACTED-APPLE-TEAM-ID" \
            --wait \
            --verbose

          # Staple the notarization ticket to the bundle.
          xcrun stapler staple "$APP_PATH"

          # Post-build smoke: verify ticket and Gatekeeper acceptance.
          xcrun stapler validate "$APP_PATH"
          spctl --assess --type exec --verbose "$APP_PATH"

          echo "::notice::Developer-ID notarization and stapling completed."

      - name: Clean up keychain
        if: always() && steps.signing_check.outputs.skip != 'true'
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Prepare release artifacts
        run: |
          # Use tag version when on a tag push; fall back to pubspec.yaml on branch push
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Portable ZIP
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/$ARTIFACT_DIR/WhisPaste-$VERSION-macos-arm64.zip" whispaste.app
          cd "$OLDPWD"

          # DMG via create-dmg (best-effort; falls back to zip-only)
          brew install create-dmg || true
          create-dmg \
            --volname "WhisPaste" \
            --window-size 500 320 \
            --icon-size 80 \
            --app-drop-link 380 170 \
            --icon "whispaste.app" 120 170 \
            "$ARTIFACT_DIR/WhisPaste-macos-arm64.dmg" \
            "$APP_PATH" || true

          # WhisPaste-Diagnose: Dart-native .app bundle + DMG.
          # Builds the standalone diagnostics tool (pure Dart, no Flutter).
          cd packages/whispaste_diagnostics
          dart pub get
          bash tool/build_app_bundle.sh
          cd "$OLDPWD"
          hdiutil create -volname "WhisPaste-Diagnose" \
            -srcfolder "packages/whispaste_diagnostics/dist/WhisPaste-Diagnose.app" \
            -ov -format UDZO \
            "$ARTIFACT_DIR/WhisPaste-Diagnose-macOS.dmg"

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: release-artifacts/

      - name: Mark build succeeded
        id: mark_success
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    # See build-windows: skip on a Promote dispatch (no rebuild).
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.promote == 'true') }}
    outputs:
      # See build-windows for rationale (decouple from Post-step failures).
      build-succeeded: ${{ steps.mark_success.outputs.ok == 'true' }}
    steps:
      - uses: actions/checkout@v6

      # ── §3.1 Build-Stolperfallen — vollständig abgebildet ──────────────────────
      # sentry-native: libcurl4-openssl-dev + zlib1g-dev
      # jni-Plugin: default-jdk + JAVA_HOME
      # flutter_soloud x86 Xiph: libflac-dev + libogg-dev + libopus-dev + libvorbis-dev
      # libasound2-dev: ALSA (audio pipeline)
      # libkeybinder-3.0-dev + libnotify-dev + libayatana-appindicator3-dev: desktop integration
      # libsecret-1-dev + libgtk-3-dev: Flutter Linux baseline
      # clang + cmake + ninja-build + pkg-config: Flutter Linux build toolchain
      # -Werror: already removed in linux/CMakeLists.txt (commit 26fab952)
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libkeybinder-3.0-dev libnotify-dev \
            libayatana-appindicator3-dev libasound2-dev \
            libcurl4-openssl-dev zlib1g-dev \
            libflac-dev libogg-dev libopus-dev libvorbis-dev \
            default-jdk

      # jni-Plugin: JAVA_HOME muss gesetzt sein (§3.1)
      - name: Set JAVA_HOME
        run: |
          JAVAC_PATH="$(which javac)"
          JAVA_HOME_PATH="$(dirname "$(dirname "$(readlink -f "$JAVAC_PATH")")")"
          echo "JAVA_HOME=$JAVA_HOME_PATH" >> "$GITHUB_ENV"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build Linux release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          WHISPASTE_MATOMO_URL: ${{ secrets.WHISPASTE_MATOMO_URL }}
          WHISPASTE_MATOMO_SITE_ID: ${{ secrets.WHISPASTE_MATOMO_SITE_ID }}
          # flutter_soloud §3.1: Xiph system libs statt x86-only Bundles verwenden
          TRY_SYSTEM_LIBS_FIRST: "1"
        run: |
          URL="$(printf '%s' "$SUPABASE_URL" | tr -d '\r\n')"
          KEY="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '\r\n')"
          MATOMO_URL="$(printf '%s' "$WHISPASTE_MATOMO_URL" | tr -d '\r\n')"
          MATOMO_SITE_ID="$(printf '%s' "$WHISPASTE_MATOMO_SITE_ID" | tr -d '\r\n')"

          # Resolve version from tag (preferred) or pubspec.yaml
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi

          flutter build linux --release --no-tree-shake-icons \
            "--dart-define=SUPABASE_URL=$URL" \
            "--dart-define=SUPABASE_PUBLISHABLE_KEY=$KEY" \
            "--dart-define=WHISPASTE_MATOMO_URL=$MATOMO_URL" \
            "--dart-define=WHISPASTE_MATOMO_SITE_ID=$MATOMO_SITE_ID" \
            "--dart-define=APP_VERSION=$VERSION"

      # §3.1: crashpad_handler braucht chmod +x (kann nach dem Flutter-Build fehlen)
      - name: Ensure crashpad_handler is executable
        run: |
          HANDLER="build/linux/x64/release/bundle/lib/crashpad_handler"
          if [ -f "$HANDLER" ]; then
            chmod +x "$HANDLER"
            echo "crashpad_handler: chmod +x applied"
          else
            echo "crashpad_handler not found at expected path — skipping (may be bundled differently)"
          fi

      - name: Prepare release artifacts
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          BUNDLE_DIR="build/linux/x64/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::Flutter Linux release bundle not found at $BUNDLE_DIR"
            exit 1
          fi

          ZIP_NAME="WhisPaste-${VERSION}-linux-x64.tar.gz"
          tar -czf "$ARTIFACT_DIR/$ZIP_NAME" -C "$BUNDLE_DIR" .

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      # ── Direct-download Linux packages (Slice 17): AppImage + .deb ───────────
      # Both are packaged FROM the bundle above (no Flutter rebuild — the §3.1
      # pitfalls are already baked in). They land in $ARTIFACT_DIR so they ride
      # the existing `linux-release` artifact and the create-release
      # `files: artifacts/*` glob (AC4). Build recipes + writable-path rationale:
      # packaging/appimage/, packaging/deb/, packaging/README.md.
      - name: Build .deb package
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          bash packaging/deb/build-deb.sh \
            build/linux/x64/release/bundle "$VERSION" release-artifacts

      - name: Install AppImage tooling
        run: |
          cd /tmp
          curl -fsSL -o linuxdeploy \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
          sudo install linuxdeploy /usr/local/bin/linuxdeploy
          # FUSE is unavailable on the runner — extract+run the AppImage instead.
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          REF_NAME="${GITHUB_REF_NAME#v}"
          if echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            VERSION="$REF_NAME"
          else
            VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d '[:space:]')
          fi
          bash packaging/appimage/build-appimage.sh \
            build/linux/x64/release/bundle "$VERSION" release-artifacts
          echo "All Linux release artifacts:"
          ls -lh release-artifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-release
          path: release-artifacts/

      - name: Mark build succeeded
        id: mark_success
        run: echo "ok=true" >> "$GITHUB_OUTPUT"

  # ── Optional follow-up: Linux arm64 ───────────────────────────────────────────
  # arm64 is explicitly NOT active (maintainer decision: x86_64 first).
  # To add arm64 support later, duplicate build-linux above with:
  #   runs-on: ubuntu-24.04-arm   (GitHub-hosted arm64 runner, available on paid plans)
  #   artifact name: linux-arm64-release
  #   ZIP_NAME: WhisPaste-${VERSION}-linux-arm64.tar.gz
  # No other changes needed — the Flutter Linux build is arch-agnostic given
  # the same system-library versions. Tested locally on Pi 5 / Ubuntu 26.04 arm64.
  # ──────────────────────────────────────────────────────────────────────────────

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos, build-linux]
    # Alle drei Platform-Builds müssen erfolgreich sein. (MSIX ist optional —
    # wenn MSIX_PUBLISHER nicht gesetzt ist, läuft Build-Windows trotzdem
    # erfolgreich durch und das msix-release-Artefakt fehlt einfach.)
    #
    # Wir prüfen den explizit gesetzten `build-succeeded`-Output statt
    # `needs.*.result`, weil ein non-zero-Exit in einem Action-Post-Step
    # (z. B. flutter-action Cache-Save) den Job-Result auf `failure` kippt,
    # obwohl alle echten Build/Upload-Schritte grün durchliefen. `!cancelled()`
    # stellt sicher, dass dieser Job trotz eines `failure`-Results der
    # Build-Jobs überhaupt startet, damit die Outputs ausgewertet werden.
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.build-windows.outputs.build-succeeded == 'true' &&
      needs.build-macos.outputs.build-succeeded == 'true' &&
      needs.build-linux.outputs.build-succeeded == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v6

      # PRD §5.2/§5.3 + Q1: route by Git tag. Beta (vX.Y.Z-beta.N) is published
      # as a GitHub Prerelease and excluded from `releases/latest` (make_latest
      # false). Stable (vX.Y.Z, no suffix) is a non-prerelease and becomes the
      # org's latest release so `releases/latest` resolves to it. Downstream
      # steps consume these outputs instead of re-deriving the channel.
      - name: Resolve release channel
        id: channel
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            {
              echo "channel=beta"
              echo "prerelease=true"
              echo "make_latest=false"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "channel=stable"
              echo "prerelease=false"
              echo "make_latest=true"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: artifacts/

      - name: Download Linux artifacts
        uses: actions/download-artifact@v8
        with:
          name: linux-release
          path: artifacts/

      - name: Download MSIX artifact
        if: needs.build-windows.outputs.msix-built == 'true'
        uses: actions/download-artifact@v8
        with:
          name: msix-release
          path: artifacts/

      - name: Extract changelog inputs
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Two-input split: patch-specific delta + cumulative minor highlights.
          # The AI step combines them into a non-repetitive bilingual release
          # body. Website/CI/landing-page bullets are filtered in both modes.
          node scripts/extract-cumulative-changelog.mjs "$VERSION" --mode=patch > patch-changelog.md
          node scripts/extract-cumulative-changelog.mjs "$VERSION" --mode=minor > minor-changelog.md

      - name: AI-enhance release notes
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          node scripts/generate-release-notes.mjs \
            --version "${{ steps.notes.outputs.version }}" \
            --patch patch-changelog.md \
            --minor minor-changelog.md \
            --output-dir .

          if [ -s release-notes-en.md ]; then
            cp release-notes-en.md release-body.md
            echo "AI-generated release notes applied"
          else
            echo "Release ${{ steps.notes.outputs.version }}" > release-body.md
          fi

      - name: Upload release notes as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes-en.md
            release-notes-de.md

      # PRD §13 release discipline: the maintainer runs `docs-attest.sh attest`
      # locally before pushing a tag (enforced by .githooks/pre-push, which
      # blocks the push unless HEAD is stamped in the gitignored .docs-attest).
      # CI re-runs the structural `check` here as defense-in-depth right before
      # a release goes public — the invariant set behind `attest` (anti-vocab,
      # version-sync, msix-version-sync, platform/store SSoT, removed-features,
      # i18n) must hold at the public-release moment. `.docs-attest` itself is
      # local/gitignored, so CI can only verify the invariants, not stamp them.
      - name: docs-attest gate (public-docs consistency)
        shell: bash
        run: bash scripts/docs-attest.sh check

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: WhisPaste v${{ steps.notes.outputs.version }}
          body_path: release-body.md
          # GitHub's immutable-release feature blocks asset uploads to an
          # already-published release, and publish-appcast (below) still
          # needs to attach the signed appcast after this step runs — so the
          # release is created as a draft and only flipped to published by
          # the finalize-release job once every upload has landed.
          draft: true
          # Q1/§5.3: Stable → non-prerelease + make_latest=true so
          # releases/latest resolves to it. Beta → prerelease + make_latest=false
          # so it never displaces the stable feed (Beta never reaches
          # releases/latest). Computed in the Resolve release channel step.
          prerelease: ${{ steps.channel.outputs.prerelease }}
          make_latest: ${{ steps.channel.outputs.make_latest }}
          # `release-notes-de.md` is attached as an asset so the website
          # changelog (build-releases.ts) can source the German body directly,
          # instead of re-translating the English body. Single DE source of
          # truth: the same file already drives the Microsoft Store listing.
          files: |
            artifacts/*
            release-notes-de.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Org/Project/URL must match values in lib/core/app_info.dart
          SENTRY_ORG: silvio-lindstedt-und-maik-g-y2
          SENTRY_PROJECT: flutter_whispaste
          SENTRY_URL: https://de.sentry.io
        with:
          environment: production
          release: whispaste@${{ steps.notes.outputs.version }}

      - name: Trigger website redeploy
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          gh workflow run deploy-pages.yml --ref main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Microsoft Store submission removed — release flow runs locally on macOS now.
  # Listing text → import CSV via scripts/generate-store-listing.mjs (see store/README.md).

  # ── Sparkle appcast (self-update feed, PRD Säule E) ───────────────────────────
  # Signs the macOS DMG + Windows Setup.exe with the EdDSA key (secret
  # SPARKLE_SIGNING_KEY) and publishes ONE signed appcast.xml carrying two
  # enclosures (sparkle:os="macos" + "windows"). Sparkle (macOS) and WinSparkle
  # 0.9.x (Windows, vendored) both reject unsigned feeds, so this job is MANDATORY
  # for the in-app self-update on either platform. Runs on macOS because the
  # Sparkle CLI tools (sign_update) are Mach-O binaries; the script bootstraps
  # them from the official Sparkle release.
  publish-appcast:
    name: Publish signed Sparkle appcast
    needs: [create-release]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-release
          path: artifacts/

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-release
          path: artifacts/

      - name: Generate & upload signed appcast
        env:
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # PRD §5.2: --channel selects the feed asset filename. Beta tags emit
          # appcast-beta.xml (consumed via the beta-appcast-pointer branch,
          # §5.3); stable tags emit appcast.xml (consumed via releases/latest).
          # Feed CONTENT is
          # identical across channels (both EdDSA enclosures); only the name
          # differs (Issue 03).
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            CHANNEL="beta"
          else
            CHANNEL="stable"
          fi
          bash scripts/generate_appcast.sh \
            --channel "$CHANNEL" \
            "${GITHUB_REF_NAME}" \
            "artifacts" \
            "https://github.com/whispaste/whispaste/releases/tag/${GITHUB_REF_NAME#v}"

      # Issue 08 fix, v2: a GitHub Release OBJECT can never serve as the
      # rolling `beta-latest` pointer — GitHub's immutable-releases feature
      # (GA since 2025-10) permanently burns a tag_name the moment any release
      # (even a prerelease) is published under it: neither `--clobber`
      # re-uploads nor delete-then-recreate work, and disabling the repo
      # setting afterwards does NOT un-burn an already-used name (confirmed:
      # https://docs.github.com/en/code-security/concepts/supply-chain-security/immutable-releases).
      # The previous attempt (delete-then-recreate `beta-latest`) hit exactly
      # this wall in practice (HTTP 422 "tag_name was used by an immutable
      # release") once GitHub actually enforced it — it is not something a
      # workflow retry can work around.
      #
      # Fix: stop using a Release object for the pointer. Force-push the
      # current appcast-beta.xml to a dedicated, single-purpose branch
      # instead — branches carry none of the tag/release immutability
      # restrictions, so a force-push is safe and idempotent forever. The
      # app fetches it from raw.githubusercontent.com (see
      # `_betaAppcastFeedUrl` in lib/services/auto_updater_service.dart) —
      # not a release download URL, so nothing there needs a Release object
      # to exist at all. Only appcast-beta.xml lives on this branch — the
      # actual installers/DMG/Setup.exe stay on the versioned beta release
      # (e.g. v1.2.44-beta.1); the appcast's enclosure URLs already point
      # there and are unaffected by this fix.
      - name: Publish beta-appcast pointer via git branch (Issue 08 fix v2)
        if: contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          POINTER_DIR="$(mktemp -d)"
          cp artifacts/appcast-beta.xml "$POINTER_DIR/appcast-beta.xml"
          cd "$POINTER_DIR"
          git init -q -b beta-appcast-pointer
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add appcast-beta.xml
          git commit -q -m "beta appcast pointer: ${GITHUB_REF_NAME}"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -q --force origin beta-appcast-pointer
          echo "beta-appcast-pointer branch updated with current appcast-beta.xml"

      # Only the beta-appcast-pointer branch is checked here — it is a plain
      # git ref served via raw.githubusercontent.com, live immediately after
      # the force-push above, independent of the tag release's draft/publish
      # state. The tag release's OWN download URL
      # (releases/download/<tag>/<file> or releases/latest/download/...) is
      # NOT publicly fetchable yet at this point in the pipeline — create-
      # release deliberately leaves it a draft until finalize-release runs
      # (see that job) — so verifying it here would 404 by construction, not
      # because anything is actually broken. That check moved to
      # finalize-release, right after the release is published.
      - name: Gate — verify beta-appcast-pointer branch is fetchable & signed
        if: contains(github.ref_name, '-beta.')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 5  # let raw.githubusercontent.com's CDN settle after push
          POINTER="https://raw.githubusercontent.com/${{ github.repository }}/beta-appcast-pointer/appcast-beta.xml"
          echo "Fetching $POINTER"
          curl -fsSL -o /tmp/pointer-appcast.xml "$POINTER"
          PENC=$(grep -c '<enclosure' /tmp/pointer-appcast.xml || true)
          PSIG=$(grep -c 'sparkle:edSignature=' /tmp/pointer-appcast.xml || true)
          [[ "$PENC" -ge 1 && "$PSIG" -eq "$PENC" ]] || {
            echo "ERROR: beta-appcast-pointer branch is unsigned, empty, or stale." >&2
            exit 1
          }
          grep -qF "${GITHUB_REF_NAME#v}" /tmp/pointer-appcast.xml || {
            echo "ERROR: beta-appcast-pointer does not reference this release's version — force-push may have failed." >&2
            exit 1
          }
          echo "OK — signed appcast live at $POINTER"

  # ── Publish the release (draft → published) ────────────────────────────────
  # create-release deliberately creates the tag release as a draft (immutable-
  # release restrictions block asset uploads after publish) and publish-appcast
  # attaches the signed appcast to that same draft. Only once BOTH have
  # finished uploading does the release flip to published — the single point
  # where releases/download/<tag>/<file> starts resolving for real users.
  finalize-release:
    name: Publish GitHub Release (draft → published)
    needs: [create-release, publish-appcast]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.create-release.result == 'success' &&
      needs.publish-appcast.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}"
          echo "Published ${{ github.ref_name }}"

      # Only meaningful once the release above is actually published — the
      # releases/download/<tag>/<file> and releases/latest/download/... URLs
      # 404 on a draft release, which is why this moved out of publish-appcast
      # (see the comment on its remaining beta-appcast-pointer-only gate).
      - name: Gate — verify published appcast is fetchable & every enclosure signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sleep 5  # let the release-asset CDN settle after publish
          if [[ "${GITHUB_REF_NAME}" == *-beta.* ]]; then
            # Beta feed: fetch the just-uploaded asset via its version tag —
            # exercises the same signed bytes the app will consume.
            FEED="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/appcast-beta.xml"
          else
            # Stable feed: releases/latest resolves to this non-prerelease
            # (make_latest=true in create-release).
            FEED="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml"
          fi
          echo "Fetching $FEED"
          curl -fsSL -o /tmp/published-appcast.xml "$FEED"
          ENC=$(grep -c '<enclosure' /tmp/published-appcast.xml || true)
          SIG=$(grep -c 'sparkle:edSignature=' /tmp/published-appcast.xml || true)
          echo "Published enclosures: ${SIG}/${ENC} signed"
          [[ "$ENC" -ge 1 && "$SIG" -eq "$ENC" ]] || {
            echo "ERROR: published appcast is unsigned or empty — self-update would be rejected by Sparkle." >&2
            exit 1
          }
          echo "OK — signed appcast live at $FEED"

  # ── Manifest-Auto-Bump ────────────────────────────────────────────────────────
  # Updates version + SHA256 in all three packaging manifests as part of the release.
  # Each channel step is fault-tolerant: a failed channel emits ::warning:: and
  # continues without blocking the others.
  # The bumped manifests are committed back to dev, which then triggers the
  # packaging-validate workflow automatically. The explicit validate-packaging job
  # below provides in-workflow dependency tracking (AC5 wiring).
  manifest-bump:
    name: Bump packaging manifests (Scoop · winget · Homebrew)
    # Needs finalize-release (not just create-release): the SHA256 steps below
    # curl the installer straight from its releases/download/<tag>/<file> URL,
    # which only resolves once the release is published (see finalize-release).
    needs: [create-release, finalize-release]
    # PRD §5.1: Scoop/winget/Homebrew are STABLE direct-download channels. A
    # beta must never bump them (it would offer an `-beta.N` version to stable
    # channel users). Stable-only here; validate-packaging inherits the skip via
    # its `needs.manifest-bump.result == 'success'` condition.
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-') &&
      needs.finalize-release.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 1

      - name: Resolve version
        id: ver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      # ── Scoop ──────────────────────────────────────────────────────────────────
      # Downloads the Windows ZIP from the just-published release, computes SHA256,
      # and patches version + url + hash in packaging/scoop/whispaste.json.
      # The checkver/autoupdate blocks stay intact for the Scoop bucket bot.
      - name: Bump Scoop manifest
        id: scoop
        continue-on-error: true
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-${VERSION}-windows-x64.zip"

          SHA256=$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::Scoop bump: could not compute SHA256 from $URL — skipped"
            exit 0
          fi

          jq --indent 4 \
            --arg v "$VERSION" --arg h "$SHA256" \
            '.version = $v |
             .architecture["64bit"].hash = $h |
             .architecture["64bit"].url  = ("https://github.com/whispaste/whispaste/releases/download/v" + $v + "/WhisPaste-" + $v + "-windows-x64.zip")' \
            packaging/scoop/whispaste.json > packaging/scoop/whispaste.json.tmp \
          && mv packaging/scoop/whispaste.json.tmp packaging/scoop/whispaste.json
          echo "::notice::Scoop manifest → $VERSION (sha256: ${SHA256:0:16}…)"

      # ── winget ─────────────────────────────────────────────────────────────────
      # Primary: wingetcreate update (downloads installer, computes SHA256, updates YAMLs).
      # No --submit flag — local manifest update only; submit is a separate manual step.
      # Fallback: direct YAML + SHA256 update via sed/curl (used until the package
      # is indexed in winget-pkgs and wingetcreate update succeeds).
      - name: Bump winget manifests (wingetcreate update — no submit)
        id: winget
        continue-on-error: true
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          INSTALLER_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-Setup.exe"

          export PATH="$PATH:$HOME/.dotnet/tools"

          # Primary: wingetcreate update — no --submit, local output only.
          if dotnet tool install --global Microsoft.WingetCreate --ignore-failed-sources 2>/dev/null \
          && wingetcreate update SilvioLindstedt.WhisPaste \
               --version "$VERSION" \
               --urls    "$INSTALLER_URL" \
               --out     packaging/winget \
               --token   "${{ secrets.GITHUB_TOKEN }}" 2>&1; then
            echo "::notice::winget manifests → $VERSION via wingetcreate (no submit)"
            exit 0
          fi

          echo "::warning::wingetcreate update skipped or failed — falling back to direct YAML bump"

          # Fallback: download installer, compute SHA256 (uppercase), update YAML inline.
          SHA256=$(curl -fsSL --retry 3 "$INSTALLER_URL" | sha256sum | awk '{print $1}' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::winget bump: could not compute SHA256 from installer URL — skipped"
            exit 0
          fi

          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.yaml
          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          sed -i "s/^PackageVersion:.*/PackageVersion: $VERSION/"  packaging/winget/SilvioLindstedt.WhisPaste.locale.en-US.yaml
          sed -i "s|InstallerUrl:.*|InstallerUrl: $INSTALLER_URL|" packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          sed -i "s/InstallerSha256:.*/InstallerSha256: $SHA256/"  packaging/winget/SilvioLindstedt.WhisPaste.installer.yaml
          echo "::notice::winget manifests → $VERSION (direct YAML bump, no submit)"

      # ── Homebrew ───────────────────────────────────────────────────────────────
      # The Homebrew cask path requires a NOTARIZED build — Homebrew Cask
      # quarantines downloads by default, so an unnotarized .app would be blocked
      # by Gatekeeper on first launch. Reactivated (v1.2.45): build-macos now signs
      # and notarizes with a real Developer-ID certificate whenever the three
      # MACOS_DEVELOPER_ID_CERT_*/ASC_API_KEY_BASE64 secrets are set — mirror that
      # same gate here so this bump only runs once those secrets actually exist.
      - name: Check notarization (Homebrew guard)
        id: notarization_check
        run: |
          if [[ -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_BASE64 }}" || \
                -z "${{ secrets.MACOS_DEVELOPER_ID_CERT_PASSWORD }}" || \
                -z "${{ secrets.ASC_API_KEY_BASE64 }}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Homebrew cask bump skipped — Developer-ID notarization secrets not set."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump Homebrew cask
        id: homebrew
        continue-on-error: true
        if: steps.notarization_check.outputs.skip != 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          TAG="${{ steps.ver.outputs.tag }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/WhisPaste-${VERSION}-macos-arm64.zip"

          SHA256=$(curl -fsSL --retry 3 "$URL" | sha256sum | awk '{print $1}')
          if [[ -z "$SHA256" ]]; then
            echo "::warning::Homebrew bump: could not compute SHA256 from $URL — skipped"
            exit 0
          fi

          sed -i "s/version \"[^\"]*\"/version \"$VERSION\"/" packaging/homebrew/whispaste.rb
          sed -i "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/"   packaging/homebrew/whispaste.rb
          echo "::notice::Homebrew cask → $VERSION (sha256: ${SHA256:0:16}…)"

      # ── Validate Scoop manifest inline before committing ───────────────────────
      # Re-runs the same logic as packaging-validate.yml / scoop job to ensure the
      # bumped JSON is valid before it lands on dev. The full 3-channel validation
      # (including winget + Homebrew) runs in the validate-packaging job below.
      - name: Validate bumped Scoop manifest (packaging-validate gate)
        run: |
          python3 - packaging/scoop/whispaste.json <<'PYEOF'
          import json, sys, pathlib
          data = json.loads(pathlib.Path(sys.argv[1]).read_text())
          errors = []
          if not data.get("version"):
              errors.append("missing: version")
          has_url  = bool(data.get("url"))
          has_arch = isinstance(data.get("architecture"), dict)
          if not has_url and not has_arch:
              errors.append("missing: url / architecture")
          has_hash      = bool(data.get("hash"))
          has_arch_hash = any(
              isinstance(v, dict) and v.get("hash")
              for v in (data.get("architecture") or {}).values()
          )
          if not has_hash and not has_arch_hash:
              errors.append("missing: hash / architecture.<arch>.hash")
          if not data.get("bin"):
              errors.append("missing: bin")
          if not data.get("autoupdate"):
              errors.append("missing: autoupdate")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              sys.exit(1)
          print("  ✓ Scoop manifest valid")
          PYEOF

      # ── Commit and push bumped manifests to dev ─────────────────────────────────
      # This push triggers packaging-validate.yml automatically (push: branches: dev,
      # paths: packaging/**) and also feeds the explicit validate-packaging job below.
      - name: Commit and push bumped manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet packaging/; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git add packaging/
          git commit -m "chore(packaging): bump manifests to ${{ steps.ver.outputs.version }}"
          git push origin dev

  # ── Validate bumped manifests (full 3-channel, packaging-validate gate) ────────
  # Runs the packaging-validate reusable workflow against the bumped manifests on dev.
  # Depends on manifest-bump so it only starts after manifests are committed.
  # Non-blocking: continue-on-error would be set here if this gate should warn rather
  # than fail; currently it is a hard gate (failures are visible in the release run).
  validate-packaging:
    name: Validate bumped packaging manifests (packaging-validate gate)
    needs: [manifest-bump]
    if: |
      !cancelled() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.manifest-bump.result == 'success'
    uses: ./.github/workflows/packaging-validate.yml
    with:
      ref: dev

  # ── Promote: validated beta build → stable (PRD §5.2/§7.2, Issue 05) ─────────
  # A manual workflow_dispatch (inputs.promote=true) that turns a field-validated
  # beta X.Y.Z-beta.N into the stable X.Y.Z WITHOUT rebuilding anything. It
  # copies the beta release artifacts verbatim under a new non-prerelease tag
  # vX.Y.Z, re-derives the stable appcast (identical EdDSA signature — same
  # artifact bytes + same seed), and surfaces the operator Store-Submission step.
  #
  # Idempotent: if vX.Y.Z already exists, the existence guard re-publishes the
  # identical assets (--clobber) instead of duplicating them (AC-3). The build
  # jobs above are skipped on this dispatch, so nothing is rebuilt.
  promote-beta-to-stable:
    name: Promote beta → stable (same build, no rebuild)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote == 'true' }}
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Resolve promote inputs
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          BETA_TAG="${{ inputs.beta-tag }}"
          STABLE_VERSION="${{ inputs.stable-version }}"
          # Normalize: guarantee a leading 'v' on the beta tag and strip it
          # from the stable version (re-added as the stable tag below).
          BETA_TAG="v${BETA_TAG#v}"
          STABLE_VERSION="${STABLE_VERSION#v}"
          STABLE_TAG="v${STABLE_VERSION}"
          {
            echo "beta-tag=${BETA_TAG}"
            echo "stable-version=${STABLE_VERSION}"
            echo "stable-tag=${STABLE_TAG}"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting ${BETA_TAG} → ${STABLE_TAG} (no rebuild)"

      - name: Verify source beta release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${{ steps.vars.outputs.beta-tag }}" --repo "${{ github.repository }}" >/dev/null; then
            echo "::error::Source beta release ${{ steps.vars.outputs.beta-tag }} not found — promote aborted."
            exit 1
          fi
          echo "Source beta release found: ${{ steps.vars.outputs.beta-tag }}"

      - name: Idempotency guard — delete existing stable release if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # AC-3: GitHub's immutable-release feature blocks asset uploads to
          # an already-published release, so a re-promote of the same stable
          # version must delete the existing release object (the underlying
          # git tag is left untouched) before recreating it fresh below,
          # rather than re-publishing assets onto it via upload --clobber.
          if gh release view "${{ steps.vars.outputs.stable-tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "${{ steps.vars.outputs.stable-tag }}" --yes --repo "${{ github.repository }}"
            echo "Deleted existing stable release ${{ steps.vars.outputs.stable-tag }} (tag preserved) for a clean re-promote."
          else
            echo "Stable release ${{ steps.vars.outputs.stable-tag }} absent — will create it."
          fi

      - name: Create stable release (draft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Draft: the artifact + appcast uploads below must land before the
          # release is published (see "Publish stable release" at the end of
          # this job) — same immutable-release constraint as create-release.
          gh release create "${{ steps.vars.outputs.stable-tag }}" \
            --repo "${{ github.repository }}" \
            --draft \
            --title "WhisPaste v${{ steps.vars.outputs.stable-version }}" \
            --notes "Stable release ${{ steps.vars.outputs.stable-version }} — promoted from ${{ steps.vars.outputs.beta-tag }} (same build, same EdDSA signature; PRD §7.2)."

      - name: Copy beta artifacts verbatim (no rebuild)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promote-artifacts
          # Download ALL assets from the validated beta release. These are the
          # exact build artefacts (DMG, Setup.exe, portable ZIPs, Linux tarball
          # + .deb + AppImage, Diagnose, GPU-Probe, release-notes-de.md) — copied
          # VERBATIM. Nothing is rebuilt (PRD §7.2: gleicher Build).
          gh release download "${{ steps.vars.outputs.beta-tag }}" \
            --repo "${{ github.repository }}" \
            --dir promote-artifacts --clobber

          # Drop the beta feed(s): the stable release gets a freshly derived
          # appcast.xml (stable version + stable enclosure URLs) in the next
          # step. Carrying appcast-beta.xml into stable would anchor the stable
          # feed on the beta tag.
          rm -f promote-artifacts/appcast-beta.xml promote-artifacts/appcast.xml

          echo "Verbatim-copied stable artifacts:"
          ls -lh promote-artifacts

      - name: Attach artifacts to stable release (--clobber → idempotent, no duplicate)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # --clobber overwrites an existing same-named asset instead of
          # erroring or duplicating — this is the idempotency guarantee (AC-3):
          # a second promote of the same version re-publishes the identical
          # bytes, never a double asset.
          shopt -s nullglob
          gh release upload "${{ steps.vars.outputs.stable-tag }}" promote-artifacts/* --clobber
          echo "Artifacts attached to ${{ steps.vars.outputs.stable-tag }}."

      - name: Publish stable appcast (identical signature — same bytes + same seed)
        env:
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # PRD §7.2 + §5.2: derive the STABLE appcast (appcast.xml, version
          # X.Y.Z, stable enclosure URLs) from the verbatim-copied binaries via
          # the SAME script the beta path uses. The enclosure sparkle:edSignature
          # is BYTE-IDENTICAL to the beta's, because sign_update is deterministic
          # over the SAME artifact bytes and uses the SAME EdDSA seed (pubkey
          # Ek8FS/…). AC-2 holds: the promoted build's signature is the original
          # beta's — no rebuild, no different key.
          bash scripts/generate_appcast.sh \
            --channel stable \
            "${{ steps.vars.outputs.stable-tag }}" \
            "promote-artifacts" \
            "https://github.com/${{ github.repository }}/releases/tag/${{ steps.vars.outputs.stable-version }}"

      - name: Publish stable release (draft → published, mark latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Q1/§5.3: --latest so releases/latest resolves to this stable
          # release once published — mirrors the tag-push path's make_latest
          # (finalize-release job), applied here after every upload above has
          # landed on the still-draft release.
          gh release edit "${{ steps.vars.outputs.stable-tag }}" \
            --repo "${{ github.repository }}" \
            --draft=false --latest

      - name: Verify promoted stable feed is live + fully signed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 5  # let the release-asset CDN settle after the upload
          FEED="https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml"
          echo "Fetching promoted stable feed: $FEED"
          curl -fsSL -o /tmp/promoted-appcast.xml "$FEED"
          ENC=$(grep -c '<enclosure' /tmp/promoted-appcast.xml || true)
          SIG=$(grep -c 'sparkle:edSignature=' /tmp/promoted-appcast.xml || true)
          echo "Promoted stable enclosures: ${SIG}/${ENC} signed"
          [[ "$ENC" -ge 1 && "$SIG" -eq "$ENC" ]] || {
            echo "::error::Promoted stable appcast is unsigned or empty — self-update would be rejected by Sparkle." >&2
            exit 1
          }
          echo "OK — stable feed live at $FEED with $ENC signed enclosure(s)."

      - name: Store-Submission (operator follow-up — PRD §6.3/§13)
        shell: bash
        run: |
          # AC-4: the Store-Submission path is WIRED here (correct invocation
          # form, no CI execution). The actual LIVE run is an operator task:
          # Partner Center credentials + the stable MSIX signing happen on the
