name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags=golden

      - name: Build Windows release
        shell: pwsh
        run: |
          flutter build windows --release `
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" `
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          # X.X.X.0 format for Windows file properties (strip prerelease suffix)
          $parts = $version -split '[.\-]'
          $numeric = "$($parts[0]).$($parts[1]).$($parts[2]).0"

          & "C:\Program Files (x86)\NSIS\makensis.exe" `
            /DPRODUCT_VERSION=$version `
            /DPRODUCT_VERSION_NUMERIC=$numeric `
            installer\whispaste.nsi

          if ($LASTEXITCODE -ne 0) { throw "NSIS build failed" }
          Write-Host "Built: installer\WhisPaste-Setup.exe"

      - name: Prepare release artifacts
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $artifactDir = "release-artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force

          # Portable ZIP from build output
          $buildDir = "build\windows\x64\runner\Release"
          $zipName = "WhisPaste-$version-windows-x64.zip"
          Compress-Archive -Path "$buildDir\*" -DestinationPath "$artifactDir\$zipName"

          # NSIS installer (stable filename for direct download links)
          Copy-Item "installer\WhisPaste-Setup.exe" "$artifactDir\"

          Write-Host "Release artifacts:"
          Get-ChildItem $artifactDir

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release-artifacts/

  build-msix:
    name: Build MSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build MSIX
        run: dart run msix:create --store
        continue-on-error: true

      - name: Upload MSIX
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: msix-release
          path: build/windows/x64/runner/Release/*.msix

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build macOS release
        run: |
          flutter build macos --release \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Prepare release artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT_DIR="release-artifacts"
          mkdir -p "$ARTIFACT_DIR"

          APP_PATH="build/macos/Build/Products/Release/whispaste.app"

          # Portable ZIP
          cd build/macos/Build/Products/Release
          zip -r "$OLDPWD/$ARTIFACT_DIR/WhisPaste-$VERSION-macos-arm64.zip" whispaste.app
          cd "$OLDPWD"

          # DMG via create-dmg (best-effort; falls back to zip-only)
          brew install create-dmg || true
          create-dmg \
            --volname "WhisPaste" \
            --window-size 500 320 \
            --icon-size 80 \
            --app-drop-link 380 170 \
            --icon "whispaste.app" 120 170 \
            "$ARTIFACT_DIR/WhisPaste-macos-arm64.dmg" \
            "$APP_PATH" || true

          echo "Release artifacts:"
          ls -lh "$ARTIFACT_DIR"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-release
          path: artifacts/

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Extract section from CHANGELOG.md
          awk "/^## $VERSION/{flag=1; next} /^## /{flag=0} flag" CHANGELOG.md > release-body.md

          if [ ! -s release-body.md ]; then
            echo "Release $VERSION" > release-body.md
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: WhisPaste v${{ steps.notes.outputs.version }}
          body_path: release-body.md
          draft: true
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          # Org/Project/URL must match values in lib/core/app_info.dart
          SENTRY_ORG: silvio-lindstedt-und-maik-g-y2
          SENTRY_PROJECT: flutter_whispaste
          SENTRY_URL: https://de.sentry.io
        with:
          environment: production
          version: whispaste@${{ steps.notes.outputs.version }}
