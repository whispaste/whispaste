name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze-go:
    name: Analyze Go
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Setup MinGW
        run: |
          if (Test-Path "C:\mingw64\bin\gcc.exe") {
            echo "C:\mingw64\bin" | Out-File -Append $env:GITHUB_PATH
            Write-Host "Using pre-installed MinGW"
          } else {
            choco install mingw -y --no-progress
            echo "C:\ProgramData\mingw64\mingw64\bin" | Out-File -Append $env:GITHUB_PATH
          }

      - name: Download dependencies
        env:
          CGO_ENABLED: "1"
        run: go mod download

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        env:
          CGO_ENABLED: "1"
        run: go build -ldflags="-s -w -H windowsgui" -o whispaste.exe .

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:go"

  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
