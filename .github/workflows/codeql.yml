name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

# A newer push to the same ref supersedes an in-flight analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config-js.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  analyze-cpp:
    name: Analyze C++ (Win32/GDI+)
    runs-on: windows-latest
    # Untraced build ~8min + traced first-party rebuild + analysis ~5min.
    # Without a limit a stuck build runs until GitHub's 360min default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      # build-mode: none left CodeQL unable to resolve Win32/GDI+/Flutter
      # embedder types, producing false positives (e.g. output parameters
      # misread as globals, `std::vector` misread as a variable named
      # "vector"). A real build gives it accurate type info instead.
      #
      # Built once WITHOUT tracing first: compiling the whole CMake
      # FetchContent tree (sentry-native, crashpad, zlib, ...) under the
      # CodeQL tracer took 25-40min and pushed this job past its 45min limit
      # on most runs since 2026-09-25 (e.g. 36333393863, 36164153866) — so
      # C++ went unanalyzed. Only compilations after `init` are traced, so
      # vendored code now stays out of the database entirely.
      - name: Build Windows (untraced, warms vendored deps)
        run: flutter build windows --debug

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          config-file: .github/codeql/codeql-config-cpp.yml

      # Dropping our own object files forces exactly the first-party C++ —
      # the runner and the in-repo auto_updater_windows plugin — to recompile
      # under the tracer. If nothing recompiled, analyze fails with "no
      # source code seen", so a silent empty scan is not possible.
      - name: Rebuild first-party C++ (traced)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.obj -Path build\windows\x64\runner, build\windows\x64\plugins\auto_updater_windows |
            Remove-Item -Force
          flutter build windows --debug

      # codeql-config-cpp.yml's `paths`/`paths-ignore` only apply to
      # compiled languages under build-mode: none — with a real build above,
      # GitHub silently ignores both, so CodeQL extracts everything the
      # compiler touches, including the CMake FetchContent tree under
      # `build/` (sentry-native + its crashpad/zlib/mpack sub-vendors —
      # ~460 findings in third-party code that isn't even in this repo,
      # `build/` is gitignored). Filtering the SARIF post-hoc is GitHub's
      # documented workaround for this build-mode limitation.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"
          output: sarif-results
          upload: false

      - name: Filter out vendored build output
        uses: advanced-security/filter-sarif@v1
        with:
          patterns: |
            -**/build/**
          input: sarif-results/cpp.sarif
          output: sarif-results/cpp.sarif

      - name: Upload filtered SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif-results/cpp.sarif
          category: "/language:c-cpp"

  analyze-actions:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:actions"
