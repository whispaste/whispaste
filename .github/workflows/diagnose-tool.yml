name: Diagnose Tool

# Baut das WhisPaste-Sprachdienst-Diagnosewerkzeug. Auf jedem Push nach dev
# oder main (sofern das Skript oder dieser Workflow betroffen ist) wird das
# PowerShell-Skript geprueft (PSScriptAnalyzer), zu einer eigenstaendigen
# Windows-.exe kompiliert (ps2exe) und als Download-Artefakt bereitgestellt.
# So laesst sich das aktuelle Debug-Tool jederzeit aus dem Actions-Lauf laden,
# ohne lokal auf einem Windows-Rechner bauen zu muessen.

on:
  push:
    branches: [dev, main]
    paths:
      - 'tools/whispaste-diagnose.ps1'
      - 'tools/whispaste-diagnose.cmd'
      - '.github/workflows/diagnose-tool.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build diagnose .exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      # --- Qualitaetsgate: Skript muss lint-sauber sein -------------------
      - name: Lint with PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          $findings = Invoke-ScriptAnalyzer -Path tools/whispaste-diagnose.ps1 -Severity Warning,Error
          if ($findings) {
            $findings | Format-Table -AutoSize RuleName, Severity, Line, Message
            throw "PSScriptAnalyzer meldet $($findings.Count) Findings."
          }
          Write-Output 'Lint OK (0 Findings).'

      # --- Version aus pubspec.yaml ziehen (4-teilig fuer System.Version) --
      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $raw = (Get-Content pubspec.yaml | Select-String '^\s*version:').ToString()
          $semver = ($raw -replace '^\s*version:\s*', '' -replace '\+.*', '').Trim()
          $exeVersion = "$semver.0"
          "semver=$semver"          | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "exe_version=$exeVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Output "App-Version: $semver  ->  EXE-Version: $exeVersion"

      # --- Kompilieren mit ps2exe -----------------------------------------
      # ps2exe erzeugt .NET-4.x-Binaries und braucht Windows PowerShell 5.1
      # zum Kompilieren -> Shell explizit 'powershell' (nicht pwsh).
      # x64 + sichtbare Konsole laut MScholtes/PS2EXE die FP-aermste Variante.
      - name: Compile with ps2exe
        shell: powershell
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module ps2exe -Scope CurrentUser -Force
          New-Item -ItemType Directory -Force -Path dist-diagnose | Out-Null
          Invoke-ps2exe `
            -inputFile  tools\whispaste-diagnose.ps1 `
            -outputFile dist-diagnose\WhisPaste-Diagnose.exe `
            -x64 `
            -title       'WhisPaste Sprachdienst-Diagnose' `
            -product     'WhisPaste' `
            -company     'Silvio Lindstedt' `
            -description 'Liest die WhisPaste-Sprachdienst-Umgebung aus und erstellt einen Debug-Report.' `
            -copyright   'MIT License - Silvio Lindstedt' `
            -version     '${{ steps.ver.outputs.exe_version }}'
          if (-not (Test-Path dist-diagnose\WhisPaste-Diagnose.exe)) {
            throw 'ps2exe hat keine .exe erzeugt.'
          }

      # --- Smoke-Test: laeuft die kompilierte .exe ueberhaupt? ------------
      # Auf dem Runner ist kein WhisPaste installiert -> der Report meldet
      # erwartungsgemaess "nicht gefunden", muss aber sauber mit Exit 0 enden.
      - name: Smoke test the .exe
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'smoke.txt'
          & dist-diagnose\WhisPaste-Diagnose.exe -NoRunTest -OutFile $out | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "EXE-Smoke-Test fehlgeschlagen (Exit $LASTEXITCODE)." }
          if (-not (Test-Path $out)) { throw 'EXE hat keinen Report geschrieben.' }
          Write-Output '--- Report-Kopf ---'
          Get-Content $out -TotalCount 12

      # --- Skript-Bundle (AV-sichere Alternative zur .exe) ----------------
      - name: Stage script bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-diagnose/script-bundle | Out-Null
          Copy-Item tools/whispaste-diagnose.ps1  dist-diagnose/script-bundle/
          Copy-Item tools/whispaste-diagnose.cmd  dist-diagnose/script-bundle/

      # --- Artefakt 1: eigenstaendige .exe --------------------------------
      - name: Upload diagnose .exe
        uses: actions/upload-artifact@v7
        with:
          name: whispaste-diagnose-exe-${{ steps.ver.outputs.semver }}
          path: dist-diagnose/WhisPaste-Diagnose.exe
          if-no-files-found: error

      # --- Artefakt 2: .ps1 + .cmd (falls AV die .exe blockt) -------------
      - name: Upload script bundle
        uses: actions/upload-artifact@v7
        with:
          name: whispaste-diagnose-script-${{ steps.ver.outputs.semver }}
          path: dist-diagnose/script-bundle/*
          if-no-files-found: error
