name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-app:
    name: Flutter App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags=golden

      - name: C++ static analysis (cppcheck)
        shell: pwsh
        run: |
          choco install cppcheck -y --no-progress
          $defaultPath = 'C:\Program Files\Cppcheck\cppcheck.exe'
          if (-not (Test-Path $defaultPath)) {
            throw "cppcheck was expected at $defaultPath after Chocolatey installation."
          }
          $env:Path = "C:\Program Files\Cppcheck;$env:Path"
          $cppcheck = @{ Source = $defaultPath }
          Write-Host "Using cppcheck: $($cppcheck.Source)"
          & $cppcheck.Source `
            --enable=warning,performance,portability `
            --std=c++17 `
            --platform=win64 `
            --suppress=missingIncludeSystem `
            --suppress=unmatchedSuppression `
            --suppress=useStlAlgorithm `
            --inline-suppr `
            --error-exitcode=1 `
            --template='{file}({line}): {severity} ({id}): {message}' `
            windows/runner/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Verify build output
        run: |
          $exe = "build\windows\x64\runner\Debug\whispaste.exe"
          if (!(Test-Path $exe)) { throw "Flutter build failed: $exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Flutter app size: $([math]::Round($size, 2)) MB"

      # Verifies flutter_secure_storage against the real Windows
      # Credential Manager. Runs against a per-run unique key
      # namespace so it cannot collide with existing wp_* items.
      - name: Secure storage integration test
        run: flutter test integration_test/secure_storage_test.dart -d windows

      - name: Secret scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $extensions = @('.dart', '.yaml', '.yml', '.json', '.md')
          $excludedPattern = '\\(\.git|build|node_modules)\\'
          $pattern = '(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]+")'
          $files = Get-ChildItem -Path $repoRoot -Recurse -File | Where-Object {
            $extensions -contains $_.Extension -and
            $_.FullName -notmatch $excludedPattern
          }
          Write-Host 'Scanning for potential secrets...'
          $matches = @($files | Select-String -Pattern $pattern -CaseSensitive)
          if ($matches.Count -gt 0) {
            foreach ($match in $matches) {
              $relativePath = $match.Path.Substring($repoRoot.Length + 1)
              Write-Host "${relativePath}:$($match.LineNumber)"
            }
            throw 'Potential secrets detected in source files.'
          }
          Write-Host 'No secrets found'

  flutter-app-macos:
    name: Flutter App (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --exclude-tags=golden

      - name: Build macOS (debug)
        run: flutter build macos --debug

      - name: Verify build output
        run: |
          APP="build/macos/Build/Products/Debug/whispaste.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Flutter build failed: $APP not found"
            exit 1
          fi
          SIZE=$(du -sh "$APP" | cut -f1)
          echo "Flutter app bundle size: $SIZE"

      # Verifies flutter_secure_storage against the real macOS
      # Keychain. The test pins usesDataProtectionKeychain: false
      # because the integration-test runner binary is unsigned and
      # has no Bundle ID — see secure_storage_test.dart for why.
      - name: Secure storage integration test
        run: flutter test integration_test/secure_storage_test.dart -d macos

      - name: Secret scan
        run: |
          echo 'Scanning for potential secrets...'
          PATTERN='(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]+")'
          MATCHES=$(grep -rEn "$PATTERN" --include='*.dart' --include='*.swift' \
            --include='*.yaml' --include='*.json' --include='*.ts' --include='*.js' \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=node_modules . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES" | grep -oE '^[^:]+:[0-9]+'
            echo "::error::Potential secrets detected in source files."
            exit 1
          fi
          echo 'No secrets found'

  # Linux-only smoke test for flutter_secure_storage. Builds and runs
  # the Linux desktop app against an isolated gnome-keyring instance
  # (Secret Service via libsecret) inside a fresh D-Bus session, so it
  # exercises the real native backend without touching the runner's
  # default keyring.
  flutter-app-linux:
    name: Flutter App (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      # System packages needed by every native plugin the desktop app
      # pulls in transitively. Pinning the full set here so the build
      # does not fall over piecemeal on each new plugin discovery.
      #   gtk-3 / pkg-config / ninja-build / cmake / clang — Flutter Linux desktop
      #   libsecret-1-dev + gnome-keyring + dbus-x11      — flutter_secure_storage
      #   libkeybinder-3.0-dev                            — hotkey_manager
      #   libayatana-appindicator3-dev                    — tray_manager
      #   libasound2-dev + libpulse-dev                   — record / flutter_soloud
      #   libnotify-dev                                   — toast/notifications
      #   xvfb                                            — display for integration_test
      - name: Install Linux desktop + libsecret backend
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            cmake \
            clang \
            pkg-config \
            libgtk-3-dev \
            libsecret-1-dev \
            libkeybinder-3.0-dev \
            libayatana-appindicator3-dev \
            libasound2-dev \
            libpulse-dev \
            libnotify-dev \
            gnome-keyring \
            dbus-x11 \
            xvfb

      - name: Get dependencies
        run: flutter pub get

      # gnome-keyring needs an unlocked Secret Service before libsecret
      # can read or write. dbus-run-session starts a fresh session bus;
      # `--unlock` reads the empty passphrase from stdin and prints the
      # environment exports we need to eval. xvfb-run gives Flutter a
      # display for the desktop embedder bindings even though our test
      # never renders a widget.
      - name: Secure storage integration test
        run: |
          xvfb-run --auto-servernum dbus-run-session -- bash -c '
            set -e
            eval "$(printf "" | gnome-keyring-daemon --unlock)"
            eval "$(gnome-keyring-daemon --start --components=secrets)"
            export GNOME_KEYRING_CONTROL SSH_AUTH_SOCK
            flutter test integration_test/secure_storage_test.dart -d linux
          '

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:ci
