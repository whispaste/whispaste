name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-app:
    name: Flutter App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: C++ static analysis (cppcheck)
        shell: pwsh
        run: |
          choco install cppcheck -y --no-progress
          $cppcheck = Get-Command cppcheck -ErrorAction SilentlyContinue
          if (-not $cppcheck) {
            $defaultPath = 'C:\Program Files\Cppcheck\cppcheck.exe'
            if (Test-Path $defaultPath) {
              $cppcheck = @{ Source = $defaultPath }
            }
          }
          if (-not $cppcheck) { throw 'cppcheck was not found after installation.' }
          & $cppcheck.Source `
            --enable=warning,performance,portability `
            --std=c++17 `
            --platform=win64 `
            --suppress=missingIncludeSystem `
            --suppress=unmatchedSuppression `
            --suppress=useStlAlgorithm `
            --inline-suppr `
            --error-exitcode=1 `
            --template='{file}({line}): {severity} ({id}): {message}' `
            windows/runner/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Verify build output
        run: |
          $exe = "build\windows\x64\runner\Debug\whispaste.exe"
          if (!(Test-Path $exe)) { throw "Flutter build failed: $exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Flutter app size: $([math]::Round($size, 2)) MB"

      - name: Secret scan
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repoRoot = (Get-Location).Path
          $extensions = @('.dart', '.yaml', '.yml', '.json', '.md')
          $excludedPattern = '\\(\.git|build|node_modules)\\'
          $pattern = '(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]+")'
          $files = Get-ChildItem -Path $repoRoot -Recurse -File | Where-Object {
            $extensions -contains $_.Extension -and
            $_.FullName -notmatch $excludedPattern
          }
          Write-Host 'Scanning for potential secrets...'
          $matches = @($files | Select-String -Pattern $pattern -CaseSensitive)
          if ($matches.Count -gt 0) {
            foreach ($match in $matches) {
              $relativePath = $match.Path.Substring($repoRoot.Length + 1)
              Write-Host "${relativePath}:$($match.LineNumber): $($match.Line.Trim())"
            }
            throw 'Potential secrets detected in source files.'
          }
          Write-Host 'No secrets found'

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:ci
