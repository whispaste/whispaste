name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]

# Ohne diese Group liefe ein Push nach dev und ein zeitgleicher PR auf denselben
# Commit doppelt (push- und pull_request-Event feuern beide) — doppelte
# Runner-Zeit, doppelte Fail-Mails. Gruppiert pro Ref, storniert den älteren
# Lauf statt ihn auslaufen zu lassen.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Single repo-wide secret scan. Plattformunabhängig, daher genau einmal
  # auf einem schnellen Ubuntu-Runner statt dupliziert auf Win + macOS.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Scan for potential secrets
        run: |
          echo 'Scanning for potential secrets...'
          PATTERN='(sk-[a-zA-Z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[a-zA-Z0-9]{36}|password\s*=\s*"[^"]+")'
          MATCHES=$(grep -rEn "$PATTERN" \
            --include='*.dart' --include='*.swift' \
            --include='*.yaml' --include='*.yml' \
            --include='*.json' --include='*.md' \
            --include='*.ts' --include='*.js' \
            --exclude-dir=.git --exclude-dir=build --exclude-dir=node_modules . || true)
          if [ -n "$MATCHES" ]; then
            echo "$MATCHES" | grep -oE '^[^:]+:[0-9]+'
            echo "::error::Potential secrets detected in source files."
            exit 1
          fi
          echo 'No secrets found'

  flutter-app:
    name: Flutter App (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        # Scope to the app's own sources. A bare `flutter analyze` descends
        # into the standalone packages/ tools (own pubspec/lints, not pulled
        # via pub get in CI), which fails on unresolved package: self-imports.
        # Those packages are covered by the loam gate below.
        run: flutter analyze --fatal-infos lib test integration_test tool

      # Retried: the sqlite3 package's native-asset build hook downloads a
      # prebuilt DLL from GitHub Releases on first use, which occasionally
      # hits "Connection closed before full header was received" — a
      # transient network blip unrelated to the code under test — and was
      # observed eating the whole job (run 31663460234).
      - name: Run tests
        shell: bash
        run: |
          for attempt in 1 2 3; do
            flutter test --exclude-tags=golden && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::flutter test failed after 3 attempts."
              exit 1
            fi
            echo "flutter test failed (attempt $attempt/3) — retrying in 15s."
            sleep 15
          done

      - name: C++ static analysis (cppcheck)
        shell: pwsh
        run: |
          choco install cppcheck -y --no-progress
          $defaultPath = 'C:\Program Files\Cppcheck\cppcheck.exe'
          if (-not (Test-Path $defaultPath)) {
            throw "cppcheck was expected at $defaultPath after Chocolatey installation."
          }
          $env:Path = "C:\Program Files\Cppcheck;$env:Path"
          $cppcheck = @{ Source = $defaultPath }
          Write-Host "Using cppcheck: $($cppcheck.Source)"
          & $cppcheck.Source `
            --enable=warning,performance,portability `
            --std=c++17 `
            --platform=win64 `
            --suppress=missingIncludeSystem `
            --suppress=unmatchedSuppression `
            --suppress=useStlAlgorithm `
            --inline-suppr `
            --error-exitcode=1 `
            --template='{file}({line}): {severity} ({id}): {message}' `
            windows/runner/
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Verify build output
        run: |
          $exe = "build\windows\x64\runner\Debug\whispaste.exe"
          if (!(Test-Path $exe)) { throw "Flutter build failed: $exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Flutter app size: $([math]::Round($size, 2)) MB"

      # Verifies flutter_secure_storage against the real Windows
      # Credential Manager. Runs against a per-run unique key
      # namespace so it cannot collide with existing wp_* items.
      - name: Secure storage integration test
        run: flutter test integration_test/secure_storage_test.dart -d windows

  flutter-app-macos:
    name: Flutter App (macOS)
    runs-on: macos-latest
    # A normal run finishes in ~14-15min; run 31671272849 got killed by this
    # timeout at 20m20s with every step already green (build done, secure-
    # storage test just starting) — plain runner-speed variance, not a hang.
    # 35min gives real headroom without masking an actual stuck job.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        # Scope to the app's own sources. A bare `flutter analyze` descends
        # into the standalone packages/ tools (own pubspec/lints, not pulled
        # via pub get in CI), which fails on unresolved package: self-imports.
        # Those packages are covered by the loam gate below.
        run: flutter analyze --fatal-infos lib test integration_test tool

      # Retried: see the Windows job's "Run tests" step comment — the
      # sqlite3 native-asset download flake is platform-agnostic.
      - name: Run tests
        run: |
          for attempt in 1 2 3; do
            flutter test --exclude-tags=golden && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::flutter test failed after 3 attempts."
              exit 1
            fi
            echo "flutter test failed (attempt $attempt/3) — retrying in 15s."
            sleep 15
          done

      - name: Build macOS (debug)
        run: flutter build macos --debug

      - name: Verify build output
        run: |
          APP="build/macos/Build/Products/Debug/whispaste.app"
          if [ ! -d "$APP" ]; then
            echo "::error::Flutter build failed: $APP not found"
            exit 1
          fi
          SIZE=$(du -sh "$APP" | cut -f1)
          echo "Flutter app bundle size: $SIZE"

      # The classic login keychain (see below) is not reliably unlocked on a
      # fresh runner — SecItemAdd/SecItemUpdate then blocks on an interactive
      # authorization prompt that a headless CI session can never dismiss,
      # silently eating the whole job's timeout instead of failing fast. A
      # dedicated, always-unlocked keychain sidesteps that: no prompt is ever
      # possible because access control never has anything to ask about.
      - name: Create an unlocked keychain for the secure storage test
        run: |
          security create-keychain -p "" ci-secure-storage.keychain
          security set-keychain-settings ci-secure-storage.keychain
          security unlock-keychain -p "" ci-secure-storage.keychain
          security list-keychains -d user -s ci-secure-storage.keychain $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s ci-secure-storage.keychain

      # Verifies flutter_secure_storage against the real macOS
      # Keychain. The test pins usesDataProtectionKeychain: false
      # because the integration-test runner binary is unsigned and
      # has no Bundle ID — see secure_storage_test.dart for why.
      - name: Secure storage integration test
        timeout-minutes: 5
        run: flutter test integration_test/secure_storage_test.dart -d macos

      - name: Remove the CI keychain
        if: always()
        run: security delete-keychain ci-secure-storage.keychain || true

  flutter-app-linux:
    name: Flutter App (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Linux-Desktop-Toolchain fuer `flutter build linux`. Die reinen Unit-/
      # Widget-Tests (`flutter test`) brauchen das nicht, der Build aber schon.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libsecret-1-dev \
            libkeybinder-3.0-dev libnotify-dev libcurl4-openssl-dev \
            libayatana-appindicator3-dev libasound2-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        # Scope to the app's own sources. A bare `flutter analyze` descends
        # into the standalone packages/ tools (own pubspec/lints, not pulled
        # via pub get in CI), which fails on unresolved package: self-imports.
        # Those packages are covered by the loam gate below.
        run: flutter analyze --fatal-infos lib test integration_test tool

      # loam ratchet gate — fails when any new a11y, anti-AI-slop,
      # code-duplicate, unused-public-export, complexity-hotspot or
      # circular-dependency finding is introduced relative to baseline.json.
      # Full ruleset: a11y-*, slop-*, code-duplicates, unused-public-exports,
      # complexity-hotspots, circular-dependencies. Pinned for reproducibility.
      # 0.1.14 fixes an a11y-interactive-semantics false positive on
      # call-sites that pass label/semanticLabel/tooltip through to an
      # already-excluded Flutter class (e.g. WpButton → ElevatedButton).
      - name: Loam ratchet gate (a11y + slop + duplicates + exports + complexity + cycles)
        run: |
          dart pub global activate loam 0.1.14
          export PATH="$PATH:$HOME/.pub-cache/bin"
          export DART_SDK="$(dirname "$(command -v flutter)")/cache/dart-sdk"
          loam gate --no-update-check

      # Reproduzierbare, plattformidentische Unit-/Widget-/App-Flow-Tests
      # (inkl. test/app/app_flows_test.dart) — laufen headless ohne Display.
      # Retried: see the Windows job's "Run tests" step comment — the
      # sqlite3 native-asset download flake is platform-agnostic.
      - name: Run tests
        run: |
          for attempt in 1 2 3; do
            flutter test --exclude-tags=golden && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::flutter test failed after 3 attempts."
              exit 1
            fi
            echo "flutter test failed (attempt $attempt/3) — retrying in 15s."
            sleep 15
          done

      - name: Build Linux (debug)
        run: flutter build linux --debug

      - name: Verify build output
        run: |
          BIN="build/linux/x64/debug/bundle/whispaste"
          if [ ! -f "$BIN" ]; then
            echo "::error::Flutter build failed: $BIN not found"
            exit 1
          fi
          SIZE=$(du -sh "build/linux/x64/debug/bundle" | cut -f1)
          echo "Flutter Linux bundle size: $SIZE"

  # Golden / visual-regression tests — run only the @Tags(['golden']) suite on
  # macOS so font and rendering results match the locally generated baselines.
  # The main flutter-app-* jobs keep --exclude-tags=golden unchanged.
  golden-tests:
    name: Golden Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.1
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      # Runs only the golden-tagged tests. Uses the macOS runner so font
      # rendering matches the checked-in baseline PNGs (generated on macOS).
      # golden_screenshot applies a 0.1 % fuzzy tolerance automatically;
      # plain matchesGoldenFile tests use exact pixel comparison.
      # Retried: see the Windows job's "Run tests" step comment — the
      # sqlite3 native-asset download flake is platform-agnostic.
      - name: Run golden tests
        run: |
          for attempt in 1 2 3; do
            flutter test --tags=golden && break
            if [ "$attempt" -eq 3 ]; then
              echo "::error::flutter test failed after 3 attempts."
              exit 1
            fi
            echo "flutter test failed (attempt $attempt/3) — retrying in 15s."
            sleep 15
          done

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      # Deterministischer Public-Docs-QS-Gate (0 Token): hält README, CHANGELOG,
      # Website (DE+EN) und die Plattform/Store-SSoT (platforms.ts) konsistent.
      # Läuft aus dem Repo-Root, braucht nur bash + perl (auf ubuntu vorhanden).
      - name: Public-Docs-QS (docs-attest check)
        working-directory: ${{ github.workspace }}
        run: bash scripts/docs-attest.sh check

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium webkit

      - name: Run tests
        run: npm run test:ci
