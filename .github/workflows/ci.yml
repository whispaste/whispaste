name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  flutter-app:
    name: Flutter App
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.0
          cache: true

      - name: Verify Flutter installation
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze (lint + static analysis)
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: C++ static analysis (cppcheck)
        shell: pwsh
        run: |
          choco install cppcheck -y --no-progress
          $env:Path = "C:\Program Files\Cppcheck;$env:Path"
          .\scripts\cppcheck.ps1

      - name: Build Windows (debug)
        run: flutter build windows --debug

      - name: Verify build output
        run: |
          $exe = "build\windows\x64\runner\Debug\whispaste.exe"
          if (!(Test-Path $exe)) { throw "Flutter build failed: $exe not found" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Flutter app size: $([math]::Round($size, 2)) MB"

      - name: Secret scan
        shell: pwsh
        run: .\scripts\security-scan.ps1

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npm run test:ci
