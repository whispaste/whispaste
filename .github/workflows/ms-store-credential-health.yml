name: ms-store-credential-health

# Verifies the MS_STORE_* Partner-Center credentials used by release.yml's
# submit-ms-store job are still valid — WITHOUT touching a real submission.
# Runs weekly so a rotated/revoked client secret or a lost Partner-Center
# Manager role fails loud (GitHub email) here, instead of the next tagged
# release silently skipping its Microsoft Store submission (submit-ms-store
# is continue-on-error by design, so it degrades gracefully but quietly).
#
# See docs/store-release.md § "Microsoft-Store-Automatisierung (AFK-Aktivierung)".
#
# Note: scheduled workflows only run from the repository's default branch
# (main), so this cron activates after the next `dev` → `main` merge; use
# workflow_dispatch to verify immediately once the MS_STORE_* secrets are set.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-credentials:
    name: Check Partner Center credentials
    runs-on: windows-latest
    steps:
      - name: Check secrets are set
        id: secret_check
        shell: pwsh
        run: |
          $missing = @()
          foreach ($n in 'MS_STORE_TENANT_ID','MS_STORE_CLIENT_ID','MS_STORE_CLIENT_SECRET','MS_STORE_SELLER_ID','MS_STORE_APP_ID') {
            if (-not [Environment]::GetEnvironmentVariable($n)) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Missing secrets: $($missing -join ', ') — see docs/store-release.md § Secrets setzen."
            exit 1
          }
        env:
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          MS_STORE_SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure store credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId ${{ secrets.MS_STORE_TENANT_ID }} `
            --sellerId ${{ secrets.MS_STORE_SELLER_ID }} `
            --clientId ${{ secrets.MS_STORE_CLIENT_ID }} `
            --clientSecret ${{ secrets.MS_STORE_CLIENT_SECRET }}

      # Read-only: fetches the app's details without touching any submission.
      # A failure here means auth is broken or the Manager role was revoked —
      # exactly what the next real release's submit-ms-store job would hit.
      - name: Verify app is reachable
        shell: pwsh
        run: msstore apps get ${{ secrets.MS_STORE_APP_ID }}
