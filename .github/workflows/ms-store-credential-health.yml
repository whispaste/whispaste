name: MS Store Credential Health

# Long-term AFK safety net for the auto-submission in release.yml.
#
# Entra client secrets expire (max 24 months) and the Manager role can be
# revoked. Without a check, the first symptom would be a silently-skipped or
# failed `submit-ms-store` job on a real release. This workflow does a weekly
# test-auth against the Partner Center API and FAILS LOUDLY (GitHub emails the
# actor on a failed scheduled run) so the credential can be rotated in advance.
#
# It never prints token or secret values. If the secrets are not configured it
# exits neutrally (skip), so it is harmless before the credentials are set up.
#
# NOTE: scheduled runs only fire from the repository's default branch, so this
# file must reach `main` (i.e. ship in a release) before the weekly cron is live.

on:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Verify Partner Center credentials
    runs-on: ubuntu-latest
    steps:
      - name: Probe Partner Center auth + app API access
        env:
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          MS_STORE_TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          MS_STORE_CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          MS_STORE_CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          summary() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          if [[ -z "${MS_STORE_APP_ID}" || -z "${MS_STORE_TENANT_ID}" \
                || -z "${MS_STORE_CLIENT_ID}" || -z "${MS_STORE_CLIENT_SECRET}" ]]; then
            echo "::notice::MS_STORE_* secrets not set — credential health check skipped."
            summary "### MS Store credential health: ⏭️ skipped (secrets not configured)"
            exit 0
          fi

          echo ":: Requesting Partner Center access token..."
          token_resp="$(curl -sS -m 30 \
            -X POST "https://login.microsoftonline.com/${MS_STORE_TENANT_ID}/oauth2/token" \
            --data-urlencode "grant_type=client_credentials" \
            --data-urlencode "client_id=${MS_STORE_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_STORE_CLIENT_SECRET}" \
            --data-urlencode "resource=https://manage.devcenter.microsoft.com")"

          token="$(printf '%s' "$token_resp" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null || true)"

          if [[ -z "${token}" ]]; then
            err="$(printf '%s' "$token_resp" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("error",""), "—", d.get("error_description","")[:200])' 2>/dev/null \
              || echo "unparseable token response")"
            echo "::error::Partner Center auth FAILED — credentials likely expired or revoked (${err})"
            summary "### MS Store credential health: ❌ AUTH FAILED"
            summary ""
            summary "Token request returned no access_token (\`${err}\`). Most likely the **client secret expired** or the Entra app lost the **Manager** role in Partner Center."
            summary ""
            summary "**Fix:** create a new client secret in Microsoft Entra → update \`MS_STORE_CLIENT_SECRET\` in \`.env\` → run \`./scripts/setup-gh-secrets.sh\`."
            exit 1
          fi

          echo ":: Verifying app API access for ${MS_STORE_APP_ID}..."
          http="$(curl -sS -m 30 -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${token}" \
            "https://manage.devcenter.microsoft.com/v1.0/my/applications/${MS_STORE_APP_ID}")"

          if [[ "${http}" != "200" ]]; then
            echo "::error::Auth OK but app API returned HTTP ${http} for ${MS_STORE_APP_ID}."
            summary "### MS Store credential health: ⚠️ auth OK, app API HTTP ${http}"
            summary ""
            summary "The token is valid but \`GET applications/${MS_STORE_APP_ID}\` returned **${http}**. Check that \`MS_STORE_APP_ID\` is the correct Product ID and that the Entra app still has the **Manager** role."
            exit 1
          fi

          echo "Credentials valid and app API reachable."
          summary "### MS Store credential health: ✅ OK"
          summary ""
          summary "Auth succeeded and \`GET applications/${MS_STORE_APP_ID}\` returned 200 — the next tagged release will auto-submit to the Microsoft Store."
