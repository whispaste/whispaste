name: Whisper Server Assets

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to attach assets to (for manual runs)
        required: true
        type: string
      whisper_ref:
        description: Optional whisper.cpp ref override
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, cuda12, vulkan]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

      - name: Ensure CMake is available
        shell: pwsh
        run: |
          if (!(Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System' -y --no-progress
          }
          cmake --version

      - name: Install CUDA toolkit
        if: matrix.backend == 'cuda12'
        uses: Jimver/cuda-toolkit@v0.2.34
        with:
          cuda: '12.4.1'

      - name: Install Vulkan SDK
        if: matrix.backend == 'vulkan'
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          Get-ChildItem C:\VulkanSDK -Directory | Sort-Object Name -Descending | Select-Object -First 1

      - name: Resolve whisper.cpp ref
        id: whisper_ref
        shell: pwsh
        run: |
          $ref = ''
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $ref = '${{ inputs.whisper_ref }}'
          }
          if ([string]::IsNullOrWhiteSpace($ref)) {
            $ref = (Get-Content -Path .\scripts\whispercpp-ref.txt -Raw).Trim()
          }
          if ([string]::IsNullOrWhiteSpace($ref)) {
            throw "whisper.cpp ref could not be resolved"
          }
          "value=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Build whisper-server
        id: build
        shell: pwsh
        run: |
          $buildOutput = "C:\wp\ci-build"
          if (Test-Path $buildOutput) { Remove-Item -Recurse -Force $buildOutput }
          $result = .\scripts\build-whisper-server.ps1 `
            -Backend '${{ matrix.backend }}' `
            -WhisperRef '${{ steps.whisper_ref.outputs.value }}' `
            -OutputDir $buildOutput `
            -VulkanSDKRoot 'C:\VulkanSDK'
          "exe_path=$($result.ExecutablePath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Smoke test whisper-server binary
        shell: pwsh
        run: |
          & '${{ steps.build.outputs.exe_path }}' -h *> $null
          if ($LASTEXITCODE -ne 0 -and $LASTEXITCODE -ne 1) {
            throw "whisper-server smoke test failed with exit code $LASTEXITCODE"
          }

      - name: Package release asset
        id: package
        shell: pwsh
        run: |
          $packageOutput = "C:\wp\ci-release"
          if (Test-Path $packageOutput) { Remove-Item -Recurse -Force $packageOutput }
          $checksumFile = Join-Path $packageOutput "${{ matrix.backend }}.sha256"
          $result = .\scripts\package-whisper-server.ps1 `
            -Backend '${{ matrix.backend }}' `
            -ExecutablePath '${{ steps.build.outputs.exe_path }}' `
            -OutputDir $packageOutput `
            -ChecksumFile $checksumFile `
            -VulkanSDKRoot 'C:\VulkanSDK'
          "asset_path=$($result.AssetPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "checksum_path=$($result.ChecksumPath)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload packaged asset
        uses: actions/upload-artifact@v4
        with:
          name: whisper-server-${{ matrix.backend }}
          path: |
            ${{ steps.package.outputs.asset_path }}
            ${{ steps.package.outputs.checksum_path }}
          retention-days: 14

  publish:
    runs-on: windows-latest
    needs: build

    steps:
      - name: Download packaged assets
        uses: actions/download-artifact@v4
        with:
          path: whisper-release

      - name: Merge checksums
        shell: pwsh
        run: |
          $target = Join-Path $PWD "whisper-release\checksums.sha256"
          if (Test-Path $target) { Remove-Item -Force $target }
          Get-ChildItem -Path whisper-release -Filter *.sha256 -Recurse | Sort-Object FullName | ForEach-Object {
            Get-Content $_.FullName | Add-Content -Encoding ascii $target
          }
          if (!(Test-Path $target)) {
            throw "Combined checksum file was not created"
          }

      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = '${{ github.event.release.tag_name }}'
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $tag = '${{ inputs.tag }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw "No release tag available for publishing"
          }
          "value=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload assets to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          files: |
            whisper-release\**\whisper-server-*.zip
            whisper-release\checksums.sha256
