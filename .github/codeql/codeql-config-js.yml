# CodeQL configuration for WhisPaste (JavaScript/TypeScript analysis)
# Covers Supabase Edge Functions and website scripts.
# Note: Dart analysis is handled by flutter analyze in ci.yml.

queries:
  - uses: security-and-quality

paths:
  - supabase/functions
  - website/src

paths-ignore:
  - node_modules
  - website/node_modules
  - "**/*.test.*"
