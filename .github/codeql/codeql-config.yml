# CodeQL configuration for WhisPaste (Go analysis)
# Extends the default security suite with project-specific Go queries.

queries:
  - uses: security-and-quality
  - uses: ./codeql-custom-queries-go

paths:
  - "."

paths-ignore:
  - website
  - node_modules
  - "**/*_test.go"
  - installer
  - msix
  - scripts
  - winres
