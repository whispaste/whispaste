<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- HyperFrames composition M1: the waveform pill writes into a text field.
         Colours come from the theme roles (themes/*.css) injected by
         scripts/stage.sh. No text in the picture. Geometry rules are declared
         with data-* attributes and checked by scripts/geometry-check.js. -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /*WP_THEME*/
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--stage);
      }
      #root {
        position: relative;
        width: 920px;
        height: 576px;
        overflow: hidden;
        background: var(--stage);
      }
      .abs {
        position: absolute;
      }
      .bar {
        position: absolute;
        width: 12px;
        height: 120px;
        top: 228px;
        border-radius: 6px;
        background: var(--action-bright);
        transform-origin: 50% 50%;
      }
      .line {
        position: absolute;
        height: 22px;
        border-radius: 11px;
        background: var(--ink-muted);
        transform-origin: 0% 50%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="m1-welcome"
      data-width="920"
      data-height="576"
      data-duration="5"
    >
      <!-- Waveform pill: the voice. One step lighter than the stage. -->
      <div
        class="abs"
        data-box="pill"
        style="left: 56px; top: 196px; width: 384px; height: 184px; border-radius: 92px; background: var(--pill); box-shadow: var(--shadow-lift), inset 0 0 0 2px var(--line-strong)"
      ></div>
      <div id="bars"></div>

      <!-- Connector from the pill into the field: a bar, never a loose dot. -->
      <div
        id="connector"
        class="abs"
        style="left: 440px; top: 286px; width: 60px; height: 4px; border-radius: 2px; background: var(--action-on-stage)"
      ></div>

      <!-- Text field: a real surface with a caret. Padding 32 px all round. -->
      <div
        class="abs"
        data-box="field"
        style="left: 500px; top: 150px; width: 364px; height: 276px; border-radius: 28px; background: var(--panel); box-shadow: var(--shadow-lift)"
      ></div>
      <div
        id="marker"
        class="abs"
        data-in="field"
        data-pad="24"
        data-overlap-ok="m1-text"
        data-group="m1-text"
        data-within="field"
        style="left: 524px; top: 247px; width: 316px; height: 38px; border-radius: 9px; background: var(--accent-on-light)"
      ></div>
      <div id="lines"></div>
      <div
        id="caret"
        class="abs"
        data-in="field"
        data-pad="24"
        data-overlap-ok="m1-text"
        style="left: 532px; top: 207px; width: 4px; height: 30px; border-radius: 2px; background: var(--action-on-light)"
      ></div>
    </div>

    <script>
      // Deterministic pseudo-random numbers: the same loop on every render.
      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      const rand = rng(7);
      // Bars: 13 at a 26 px pitch, centred in the pill (pill centre x 248).
      const barHost = document.getElementById("bars");
      const barCount = 13;
      const barPitch = 26;
      const barLeft = 86;
      const idleScale = 0.3;
      for (let i = 0; i < barCount; i++) {
        const el = document.createElement("div");
        el.className = "bar";
        el.style.left = barLeft + i * barPitch + "px";
        el.dataset.in = "pill";
        el.dataset.pad = "24";
        el.dataset.group = "m1-pill";
        el.dataset.within = "pill";
        barHost.appendChild(el);
      }
      const barEls = Array.from(barHost.children);

      // Text lines: a 154 px block centred vertically in the field (centre 288).
      // Every line starts at x 532 (32 px inset); the longest is 300 px, so the
      // block is centred horizontally too.
      const lineSpec = [
        { top: 211, width: 260 },
        { top: 255, width: 300 },
        { top: 299, width: 200 },
        { top: 343, width: 140 },
      ];
      const lineHost = document.getElementById("lines");
      const lineEls = lineSpec.map((spec) => {
        const el = document.createElement("div");
        el.className = "line";
        el.style.left = "532px";
        el.style.top = spec.top + "px";
        el.style.width = spec.width + "px";
        el.dataset.in = "field";
        el.dataset.pad = "24";
        el.dataset.group = "m1-text";
        el.dataset.within = "field";
        lineHost.appendChild(el);
        return el;
      });
      const placeholder = { scaleX: 0.55, opacity: 0.35 };

      const tl = gsap.timeline({ paused: true });

      // Idle start state (identical at t = 0 and t = 5 for a seamless loop).
      gsap.set(barEls, { scaleY: idleScale });
      gsap.set(lineEls, placeholder);
      gsap.set("#marker", { scaleX: 0, transformOrigin: "0% 50%" });
      gsap.set("#caret", { x: 0, y: 0 });
      gsap.set("#connector", { scaleX: 0, transformOrigin: "0% 50%" });

      // 0.2 - 1.8 s: the voice. Six random segments per bar.
      const seg = 0.267;
      barEls.forEach((bar) => {
        for (let k = 0; k < 6; k++) {
          tl.to(bar, { scaleY: 0.4 + rand() * 0.6, duration: seg, ease: "sine.inOut" }, 0.2 + k * seg);
        }
      });
      tl.to(barEls, { scaleY: idleScale, duration: 0.4, ease: "power2.inOut", stagger: 0.02 }, 1.8);

      // 2.0 - 2.5 s: the connector draws from the pill into the field.
      tl.to("#connector", { scaleX: 1, duration: 0.5, ease: "power1.inOut" }, 2.0);
      tl.to("#connector", { opacity: 0, duration: 0.2 }, 2.8);
      tl.set("#connector", { scaleX: 0, opacity: 1 }, 4.95);

      // 2.6 - 4.0 s: the words are written at the caret, one line after another.
      lineEls.forEach((line, i) => {
        const t0 = 2.6 + i * 0.45;
        const w = lineSpec[i].width;
        tl.set("#caret", { y: lineSpec[i].top - 211, x: 0 }, t0);
        tl.to(line, { scaleX: 1, opacity: 1, duration: 0.4, ease: "power2.out" }, t0);
        tl.to("#caret", { x: w + 8, duration: 0.4, ease: "power2.out" }, t0);
      });
      // Amber highlight behind the second line once it is written.
      tl.to("#marker", { scaleX: 1, duration: 0.4, ease: "power2.out" }, 3.4);

      // 4.2 - 4.8 s: the words return to placeholders; the field stays filled.
      tl.to("#marker", { scaleX: 0, duration: 0.4, ease: "power1.in" }, 4.2);
      tl.to(lineEls, { ...placeholder, duration: 0.5, ease: "power1.in" }, 4.3);
      tl.set("#caret", { y: 0, x: 0 }, 4.85);
      tl.set(lineEls, placeholder, 4.95);

      // Caret blink: on for 0.25 s, off for 0.25 s, across the whole loop.
      for (let t = 0; t < 5; t += 0.5) {
        tl.set("#caret", { opacity: 1 }, t);
        tl.set("#caret", { opacity: 0 }, t + 0.25);
      }
      tl.set("#caret", { opacity: 1 }, 5);

      window.__timelines["m1-welcome"] = tl;
    </script>
  </body>
</html>
