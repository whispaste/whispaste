<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- HyperFrames composition M5: hold-to-talk. A keycap is pressed and held: it
         goes down, its cast shadow shortens, a hold bar fills, and the voice pill
         opens beside it with the wave running. On release the pill closes and the
         recognised lines fall into a field, the same panel as M1 and M4. The key
         carries a neutral glyph (dots), never a letter. No text in the picture.
         Colours come from the theme roles (themes/*.css) injected by
         scripts/stage.sh. Geometry rules are declared with data-* attributes and
         checked by scripts/geometry-check.js. -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /*WP_THEME*/
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--stage);
      }
      #root {
        position: relative;
        width: 920px;
        height: 576px;
        overflow: hidden;
        background: var(--stage);
      }
      .abs {
        position: absolute;
      }
      .bar {
        position: absolute;
        width: 12px;
        height: 90px;
        top: 43px;
        border-radius: 6px;
        background: var(--action-bright);
      }
      .line {
        position: absolute;
        height: 20px;
        border-radius: 10px;
        background: var(--ink);
        transform-origin: 0% 50%;
      }
      .key-dot {
        position: absolute;
        width: 14px;
        height: 14px;
        border-radius: 7px;
        background: var(--ink-muted);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="m5-hotkey"
      data-width="920"
      data-height="576"
      data-duration="5"
    >
      <!-- Keycap: side (depth) first, then the face. Face x 60 to 240, y 192 to 368. -->
      <div
        id="key-side"
        class="abs"
        data-overlap-ok="key"
        data-group="m5-all"
        data-within="stage"
        style="left: 60px; top: 208px; width: 180px; height: 176px; border-radius: 24px; background: var(--line-strong)"
      ></div>
      <div
        id="key-face"
        class="abs"
        data-box="key"
        data-group="m5-all"
        data-within="stage"
        style="left: 60px; top: 192px; width: 180px; height: 176px; border-radius: 24px; background: var(--chip); box-shadow: inset 0 0 0 2px var(--line-strong)"
      ></div>
      <!-- Neutral glyph on the face: a 2 x 2 dot grid, centred on (150, 280). -->
      <div class="key-dot" data-overlap-ok="key" style="left: 130px; top: 260px"></div>
      <div class="key-dot" data-overlap-ok="key" style="left: 156px; top: 260px"></div>
      <div class="key-dot" data-overlap-ok="key" style="left: 130px; top: 286px"></div>
      <div class="key-dot" data-overlap-ok="key" style="left: 156px; top: 286px"></div>
      <!-- Cast shadow under the keycap; shortens while the key is pressed. -->
      <div
        id="key-shadow"
        class="abs"
        style="left: 80px; top: 388px; width: 140px; height: 14px; border-radius: 50%; box-shadow: var(--shadow-lift)"
      ></div>

      <!-- Voice pill: x 290 to 560, centre y 280. -->
      <div
        id="pill"
        class="abs"
        data-box="pill"
        data-group="m5-all"
        data-within="stage"
        style="left: 290px; top: 192px; width: 270px; height: 176px; border-radius: 88px; background: var(--pill); box-shadow: var(--shadow-lift), inset 0 0 0 2px var(--line-strong)"
      >
        <!-- Bars are children of the pill, so the pill's open and close scale moves them with it. -->
        <div id="bars"></div>
      </div>
      <!-- Hold bar under the pill: fills while the key is held. -->
      <div
        class="abs"
        style="left: 290px; top: 392px; width: 270px; height: 8px; border-radius: 4px; background: var(--line)"
      ></div>
      <div
        id="hold-fill"
        class="abs"
        data-overlap-ok="hold-track"
        style="left: 290px; top: 392px; width: 270px; height: 8px; border-radius: 4px; background: var(--action-on-stage)"
      ></div>

      <!-- Field: x 610 to 860, y 176 to 400, centre (735, 288). The lines land here. -->
      <div
        class="abs"
        data-box="field"
        data-group="m5-all"
        data-within="stage"
        style="left: 610px; top: 176px; width: 250px; height: 224px; border-radius: 28px; background: var(--panel); box-shadow: var(--shadow-lift)"
      ></div>
      <div id="lines"></div>
    </div>

    <script>
      // Deterministic pseudo-random numbers: the same loop on every render.
      function rng(seed) {
        let a = seed >>> 0;
        return function () {
          a = (a + 0x6d2b79f5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }
      const rand = rng(5);

      // Eleven bars at a 22 px pitch, centred in the pill (pill-local x 19 to 251).
      const barHost = document.getElementById("bars");
      for (let i = 0; i < 11; i++) {
        const el = document.createElement("div");
        el.className = "bar";
        el.style.left = 19 + i * 22 + "px";
        el.dataset.in = "pill";
        el.dataset.keepIn = "pill";
        el.dataset.pad = "12";
        el.dataset.group = "m5-pill";
        el.dataset.within = "pill";
        barHost.appendChild(el);
      }
      const barEls = Array.from(barHost.children);

      // Field lines: block 635 to 835 (widest 200), centred on the field axis x 735;
      // rows 242 to 334, centred on y 288.
      const lineSpec = [
        { top: 242, width: 200 },
        { top: 278, width: 150 },
        { top: 314, width: 100 },
      ];
      const lineHost = document.getElementById("lines");
      const lineEls = lineSpec.map((spec) => {
        const el = document.createElement("div");
        el.className = "line";
        el.style.left = "635px";
        el.style.top = spec.top + "px";
        el.style.width = spec.width + "px";
        el.dataset.in = "field";
        el.dataset.pad = "24";
        el.dataset.group = "m5-text";
        el.dataset.within = "field";
        lineHost.appendChild(el);
        return el;
      });

      const keyParts = Array.from(document.querySelectorAll(".key-dot")).concat(
        [document.getElementById("key-face")],
      );

      const tl = gsap.timeline({ paused: true });

      // Idle start state (identical at t = 0 and t = 5 for a seamless loop).
      gsap.set(keyParts, { y: 0 });
      gsap.set("#key-shadow", { scaleX: 1, opacity: 1, transformOrigin: "50% 50%" });
      gsap.set("#pill", { scaleX: 0.15, opacity: 0, transformOrigin: "0% 50%" });
      gsap.set(barEls, { scaleY: 0.3, transformOrigin: "50% 50%" });
      gsap.set("#hold-fill", { scaleX: 0, transformOrigin: "0% 50%", opacity: 1 });
      gsap.set(lineEls, { scaleX: 0.55, opacity: 0.35, transformOrigin: "0% 50%" });

      // 0.2 - 0.5 s: the key goes down; its cast shadow shortens.
      tl.to(keyParts, { y: 10, duration: 0.3, ease: "power2.out" }, 0.2);
      tl.to("#key-shadow", { scaleX: 0.8, opacity: 0.5, duration: 0.3, ease: "power2.out" }, 0.2);

      // 0.5 - 2.6 s: the hold bar fills; the pill opens beside the key.
      tl.to("#hold-fill", { scaleX: 1, duration: 2.1, ease: "linear" }, 0.5);
      tl.to("#pill", { scaleX: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 0.5);

      // 0.9 - 2.6 s: the voice. Four random segments per bar while the key is held.
      const seg = 0.425;
      barEls.forEach((bar) => {
        for (let k = 0; k < 4; k++) {
          tl.to(bar, { scaleY: 0.4 + rand() * 0.6, duration: seg, ease: "sine.inOut" }, 0.9 + k * seg);
        }
      });

      // 2.6 - 2.9 s: the key is released and comes back up.
      tl.to(keyParts, { y: 0, duration: 0.3, ease: "power2.out" }, 2.6);
      tl.to("#key-shadow", { scaleX: 1, opacity: 1, duration: 0.3, ease: "power2.out" }, 2.6);

      // 2.8 - 3.4 s: the pill closes and the hold bar is cleared.
      tl.to(barEls, { scaleY: 0.3, duration: 0.3, ease: "power2.inOut", stagger: 0.02 }, 2.8);
      tl.to("#pill", { scaleX: 0.15, opacity: 0, duration: 0.5, ease: "power2.in" }, 2.9);
      tl.to("#hold-fill", { opacity: 0, duration: 0.3 }, 2.9);
      tl.set("#hold-fill", { scaleX: 0, opacity: 1 }, 3.2);

      // 3.0 - 3.6 s: the recognised text lands in the field, line by line.
      lineEls.forEach((line, i) => {
        tl.to(line, { scaleX: 1, opacity: 1, duration: 0.35, ease: "power3.out" }, 3.0 + i * 0.15);
      });

      // 4.2 - 4.6 s: back to the idle field; the loop closes invisibly.
      tl.to(lineEls, { scaleX: 0.55, opacity: 0.35, duration: 0.4, ease: "power1.in" }, 4.2);

      window.__timelines["m5-hotkey"] = tl;
    </script>
  </body>
</html>
