<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- HyperFrames composition M3: the two permissions in the first-run flow.
         Step 1 (microphone) and step 2 (notifications) are two circles joined by
         a track. The active step is outlined by a ring on the circle contour; the
         ring travels to step 2. A finished step swaps its icon for a check mark
         inside the circle. No text in the picture. Colours come from the theme
         roles (themes/*.css) injected by scripts/stage.sh. Geometry rules are
         declared with data-* attributes and checked by scripts/geometry-check.js. -->
    <script src="../node_modules/gsap/dist/gsap.min.js"></script>
    <style>
      /*WP_THEME*/
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--stage);
      }
      #root {
        position: relative;
        width: 920px;
        height: 576px;
        overflow: hidden;
        background: var(--stage);
      }
      .abs {
        position: absolute;
      }
      .circle {
        position: absolute;
        width: 112px;
        height: 112px;
        border-radius: 56px;
        background: var(--chip);
        box-shadow: inset 0 0 0 2px var(--line-strong);
        box-sizing: border-box;
      }
      .ring {
        position: absolute;
        width: 112px;
        height: 112px;
        border-radius: 56px;
        border: 3px solid var(--action-on-light);
        box-sizing: border-box;
      }
      .icon {
        position: absolute;
        width: 56px;
        height: 56px;
        color: var(--ink);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="m3-access"
      data-width="920"
      data-height="576"
      data-duration="5"
    >
      <!-- Panel: the permission card. Everything sits inside it with 24 px padding. -->
      <div
        class="abs"
        data-box="panel"
        style="left: 130px; top: 88px; width: 660px; height: 400px; border-radius: 32px; background: var(--panel); box-shadow: var(--shadow-lift)"
      ></div>

      <!-- Track: joins the two circle contours exactly (bottom of step 1 at y 254,
           top of step 2 at y 322, centre x 312). Endpoints are checked by the gate. -->
      <div
        id="track"
        class="abs"
        data-link="step1,step2"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 308px; top: 254px; width: 8px; height: 68px; border-radius: 4px; background: var(--line)"
      ></div>
      <div
        id="progress"
        class="abs"
        data-overlap-ok="track"
        data-in="panel"
        data-pad="24"
        style="left: 308px; top: 254px; width: 8px; height: 68px; border-radius: 4px; background: var(--action-on-light)"
      ></div>

      <!-- Step circles: centres (312, 198) and (312, 378). -->
      <div
        id="step1"
        class="circle"
        data-circle="step1"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 256px; top: 142px"
      ></div>
      <div
        id="step2"
        class="circle"
        data-circle="step2"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 256px; top: 322px"
      ></div>

      <!-- Active-step ring: same size and centre as the circle, so its outer edge is
           the circle contour. It travels from step 1 to step 2. -->
      <div
        id="ring"
        class="ring"
        data-ring-set="step1,step2"
        data-overlap-ok="circle"
        style="left: 256px; top: 142px; opacity: 0"
      ></div>

      <!-- Icons: microphone (step 1) and bell (step 2), centred on their circles. -->
      <svg
        id="icon-mic"
        class="icon"
        data-center="step1"
        data-overlap-ok="circle check"
        style="left: 284px; top: 170px"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="9" y="3" width="6" height="11" rx="3" />
        <path d="M5 11a7 7 0 0 0 14 0" />
        <path d="M12 18v3" />
      </svg>
      <svg
        id="icon-bell"
        class="icon"
        data-center="step2"
        data-overlap-ok="circle check"
        style="left: 284px; top: 350px"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8" />
        <path d="M10 20a2 2 0 0 0 4 0" />
      </svg>

      <!-- Check marks replace the icons inside the circles once a step is granted. -->
      <svg
        id="check1"
        class="icon"
        data-center="step1"
        data-overlap-ok="icon"
        style="left: 284px; top: 170px; color: var(--action-on-light)"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path pathLength="1" d="M5 12.5 L10 17.5 L19 7" />
      </svg>
      <svg
        id="check2"
        class="icon"
        data-center="step2"
        data-overlap-ok="icon"
        style="left: 284px; top: 350px; color: var(--action-on-light)"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.4"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path pathLength="1" d="M5 12.5 L10 17.5 L19 7" />
      </svg>

      <!-- Label placeholders: a title bar and a subtitle bar per step, no text. -->
      <div
        id="title1"
        class="abs"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 442px; top: 174px; width: 222px; height: 24px; border-radius: 12px; background: var(--ink)"
      ></div>
      <div
        id="sub1"
        class="abs"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 442px; top: 206px; width: 170px; height: 16px; border-radius: 8px; background: var(--ink-muted)"
      ></div>
      <div
        id="title2"
        class="abs"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 442px; top: 354px; width: 222px; height: 24px; border-radius: 12px; background: var(--ink)"
      ></div>
      <div
        id="sub2"
        class="abs"
        data-in="panel"
        data-pad="24"
        data-group="m3-content"
        data-within="panel"
        style="left: 442px; top: 386px; width: 170px; height: 16px; border-radius: 8px; background: var(--ink-muted)"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Idle start state (identical at t = 0 and t = 5 for a seamless loop).
      gsap.set("#ring", { opacity: 0, y: 0 });
      gsap.set("#progress", { scaleY: 0, transformOrigin: "50% 0%" });
      gsap.set(["#icon-mic", "#icon-bell"], { opacity: 0.35, scale: 0.9, transformOrigin: "50% 50%" });
      gsap.set(["#check1", "#check2"], { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" });
      gsap.set(["#check1 path", "#check2 path"], { strokeDashoffset: 1 });
      gsap.set(["#title1", "#title2", "#sub1", "#sub2"], { opacity: 0.4 });

      // 0.2 - 0.6 s: the ring outlines step 1, the microphone lights up.
      tl.to("#ring", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.2);
      tl.to("#icon-mic", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 0.2);
      tl.to(["#title1", "#sub1"], { opacity: 1, duration: 0.3 }, 0.3);

      // 1.0 - 1.4 s: step 1 is granted; the icon gives way to the check mark.
      tl.to("#icon-mic", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power1.in" }, 1.0);
      tl.to("#check1", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 1.1);
      tl.to("#check1 path", { strokeDashoffset: 0, duration: 0.3, ease: "power1.inOut" }, 1.15);

      // 2.0 - 2.6 s: the ring travels to step 2; the track fills down to it.
      tl.to("#ring", { y: 180, duration: 0.6, ease: "power2.inOut" }, 2.0);
      tl.to("#progress", { scaleY: 1, duration: 0.6, ease: "power2.inOut" }, 2.0);
      tl.to(["#title2", "#sub2"], { opacity: 1, duration: 0.3 }, 2.2);
      tl.to("#icon-bell", { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.6)" }, 2.4);

      // 3.0 - 3.4 s: step 2 is granted; the check mark replaces the bell.
      tl.to("#icon-bell", { opacity: 0, scale: 0.9, duration: 0.25, ease: "power1.in" }, 3.0);
      tl.to("#check2", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)" }, 3.1);
      tl.to("#check2 path", { strokeDashoffset: 0, duration: 0.3, ease: "power1.inOut" }, 3.15);
      tl.to("#ring", { opacity: 0, duration: 0.3, ease: "power1.in" }, 3.6);

      // 4.3 - 4.9 s: back to the idle state; the loop closes invisibly.
      tl.to(["#check1", "#check2"], { opacity: 0, scale: 0.9, duration: 0.3, ease: "power1.in" }, 4.3);
      tl.to(["#check1 path", "#check2 path"], { strokeDashoffset: 1, duration: 0.1 }, 4.65);
      tl.to(["#icon-mic", "#icon-bell"], { opacity: 0.35, scale: 0.9, duration: 0.3, ease: "power1.in" }, 4.3);
      tl.to(["#title1", "#title2", "#sub1", "#sub2"], { opacity: 0.4, duration: 0.3 }, 4.4);
      tl.to("#progress", { scaleY: 0, duration: 0.3, ease: "power1.in" }, 4.3);
      tl.set("#ring", { y: 0 }, 4.6);
      tl.set("#progress", { scaleY: 0 }, 4.6);

      window.__timelines["m3-access"] = tl;
    </script>
  </body>
</html>
