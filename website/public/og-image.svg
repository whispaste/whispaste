<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%" fx="50%" fy="45%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.12"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:0.04"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <filter id="icon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" style="fill:#0f172a"/>

  <!-- Radial glow -->
  <rect width="1200" height="630" style="fill:url(#glow)"/>

  <!-- Subtle grid pattern -->
  <g style="opacity:0.03;stroke:#94a3b8;stroke-width:0.5;fill:none">
    <line x1="0" y1="0" x2="0" y2="630"/><line x1="60" y1="0" x2="60" y2="630"/>
    <line x1="120" y1="0" x2="120" y2="630"/><line x1="180" y1="0" x2="180" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/><line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/><line x1="420" y1="0" x2="420" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/><line x1="540" y1="0" x2="540" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/><line x1="660" y1="0" x2="660" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/><line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/><line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/><line x1="1020" y1="0" x2="1020" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/><line x1="1140" y1="0" x2="1140" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/><line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/><line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/><line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Waveform graphic behind content -->
  <g style="opacity:0.08" transform="translate(600,315)">
    <rect x="-380" y="-3" width="16" height="6" rx="3" style="fill:#06b6d4"/>
    <rect x="-350" y="-12" width="16" height="24" rx="3" style="fill:#06b6d4"/>
    <rect x="-320" y="-22" width="16" height="44" rx="3" style="fill:#06b6d4"/>
    <rect x="-290" y="-40" width="16" height="80" rx="3" style="fill:#06b6d4"/>
    <rect x="-260" y="-60" width="16" height="120" rx="3" style="fill:#06b6d4"/>
    <rect x="-230" y="-80" width="16" height="160" rx="3" style="fill:#06b6d4"/>
    <rect x="-200" y="-55" width="16" height="110" rx="3" style="fill:#06b6d4"/>
    <rect x="-170" y="-90" width="16" height="180" rx="3" style="fill:#06b6d4"/>
    <rect x="-140" y="-70" width="16" height="140" rx="3" style="fill:#06b6d4"/>
    <rect x="-110" y="-100" width="16" height="200" rx="3" style="fill:#06b6d4"/>
    <rect x="-80" y="-75" width="16" height="150" rx="3" style="fill:#06b6d4"/>
    <rect x="-50" y="-110" width="16" height="220" rx="3" style="fill:#06b6d4"/>
    <rect x="-20" y="-85" width="16" height="170" rx="3" style="fill:#06b6d4"/>
    <rect x="10" y="-105" width="16" height="210" rx="3" style="fill:#06b6d4"/>
    <rect x="40" y="-80" width="16" height="160" rx="3" style="fill:#06b6d4"/>
    <rect x="70" y="-95" width="16" height="190" rx="3" style="fill:#06b6d4"/>
    <rect x="100" y="-65" width="16" height="130" rx="3" style="fill:#06b6d4"/>
    <rect x="130" y="-85" width="16" height="170" rx="3" style="fill:#06b6d4"/>
    <rect x="160" y="-50" width="16" height="100" rx="3" style="fill:#06b6d4"/>
    <rect x="190" y="-75" width="16" height="150" rx="3" style="fill:#06b6d4"/>
    <rect x="220" y="-55" width="16" height="110" rx="3" style="fill:#06b6d4"/>
    <rect x="250" y="-35" width="16" height="70" rx="3" style="fill:#06b6d4"/>
    <rect x="280" y="-20" width="16" height="40" rx="3" style="fill:#06b6d4"/>
    <rect x="310" y="-10" width="16" height="20" rx="3" style="fill:#06b6d4"/>
    <rect x="340" y="-5" width="16" height="10" rx="3" style="fill:#06b6d4"/>
    <rect x="370" y="-2" width="16" height="4" rx="2" style="fill:#06b6d4"/>
  </g>

  <!-- Microphone icon -->
  <g transform="translate(600,200)" style="filter:url(#icon-glow)">
    <rect x="-18" y="-50" width="36" height="64" rx="18" style="fill:none;stroke:url(#logo-grad);stroke-width:3"/>
    <path d="M-30,10 A30,30 0 0,0 30,10" style="fill:none;stroke:url(#logo-grad);stroke-width:3;stroke-linecap:round"/>
    <line x1="0" y1="40" x2="0" y2="55" style="stroke:url(#logo-grad);stroke-width:3;stroke-linecap:round"/>
    <line x1="-14" y1="55" x2="14" y2="55" style="stroke:url(#logo-grad);stroke-width:3;stroke-linecap:round"/>
  </g>

  <!-- App name -->
  <text x="600" y="320" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:72px;font-weight:700;fill:#f8fafc;text-anchor:middle;letter-spacing:-1px;filter:url(#text-glow)">
    <tspan style="fill:url(#logo-grad)">Whis</tspan><tspan style="fill:#f8fafc">Paste</tspan>
  </text>

  <!-- Accent line -->
  <rect x="350" y="345" width="500" height="2" rx="1" style="fill:url(#accent-line)"/>

  <!-- Tagline -->
  <text x="600" y="390" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:28px;font-weight:400;fill:#94a3b8;text-anchor:middle;letter-spacing:0.5px">Voice to text, pasted anywhere.</text>

  <!-- Subtle bottom badge -->
  <g transform="translate(600,470)">
    <rect x="-100" y="-16" width="200" height="32" rx="16" style="fill:#1e293b;stroke:#334155;stroke-width:1"/>
    <text x="0" y="6" style="font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;font-weight:500;fill:#64748b;text-anchor:middle;letter-spacing:1px">WINDOWS APP</text>
  </g>

  <!-- Corner accents -->
  <path d="M0,0 L80,0 L80,3 L3,3 L3,80 L0,80 Z" style="fill:#06b6d4;opacity:0.3"/>
  <path d="M1200,0 L1120,0 L1120,3 L1197,3 L1197,80 L1200,80 Z" style="fill:#06b6d4;opacity:0.3"/>
  <path d="M0,630 L80,630 L80,627 L3,627 L3,550 L0,550 Z" style="fill:#06b6d4;opacity:0.3"/>
  <path d="M1200,630 L1120,630 L1120,627 L1197,627 L1197,550 L1200,550 Z" style="fill:#06b6d4;opacity:0.3"/>
</svg>
