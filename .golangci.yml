version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  default: none
  enable:
    # Security
    - gosec
    - bodyclose
    - noctx
    - rowserrcheck
    - sqlclosecheck
    # Bug detection
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - nilerr
    - nilnil
    - makezero
    - wastedassign
    - errorlint
    # Code quality
    - gocritic
    - unparam
    - exhaustive

  settings:
    gosec:
      excludes:
        # G104: unhandled errors — covered by errcheck
        - G104

    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
        - hugeParam

    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - (io.Closer).Close
        - (net/http.ResponseWriter).Write

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    exhaustive:
      default-signifies-exhaustive: true

    staticcheck:
      checks:
        - all

  exclusions:
    presets:
      - std-error-handling
    paths:
      - vendor
      - website
      - build
      - installer
      - msix
      - cmd
      - third_party
    rules:
      # CGO files may have unusual patterns
      - path: audio\.go
        linters: [gocritic]
      - path: offline\.go
        linters: [gocritic]
      # Allow unhandled errors in test helpers
      - path: _test\.go
        linters: [errcheck, gosec]
